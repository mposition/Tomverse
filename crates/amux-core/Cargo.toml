[package]
name = "amux-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AMUX shared types and pure logic for Tomverse orchestration. No I/O."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1"
