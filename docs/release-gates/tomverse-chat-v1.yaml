  - id: PRIVACY-01
    rationale: "Users and store reviewers must be able to complete account deletion inside the app without an external support workflow, and every table holding their data needs a traced and implemented deletion path rather than a decided one."
    status: pending
    approvedBy: []
    approvedAt: null
    evidenceRefs: []
    category: privacy
    title: Account deletion is complete inside the app
    blocking: true
    owner: security-privacy
    criteria:
      - metric: in_app_account_deletion_e2e_pass_percent
        operator: eq
        value: 100
      # A row whose deletion path nobody has traced is not evidence of safety.
      - metric: data_domains_with_unverified_deletion_action_count
        operator: eq
        value: 0
      # A decided-but-unbuilt anonymisation leaves every identifier in place.
      # The registry records the intent precisely so it cannot be mistaken for
      # the implementation.
      - metric: data_domains_with_planned_deletion_action_count
        operator: eq
        value: 0
      # The deletion-side counterpart to the export's sentinel test. Clearing
      # userId is where an anonymisation starts, not where it finishes: three
      # of these tables relate to User with onDelete: SetNull, so the database
      # performs half of it and a source scan sees an anonymisation that never
      # touched subjectKey, traceId or the provider request identifiers.
      - metric: identifier_sentinels_surviving_account_deletion_count
        operator: eq
        value: 0
    evidence:
      - deletion E2E covering reauthentication, completion, and token revocation
      - two-axis data-domain registry passing scripts/check-data-domain-registry.mjs, with every anonymise row carrying a re-identification review and every retain row a legal basis, period, owner and review date
      - tests/integration/account-anonymisation.db.test.ts planting a sentinel in every column the registry says is anonymised, deleting the account for real, and asserting none survives
      - tests/accountDataAnonymisation.test.mjs pinning the implemented column list and replacements against the registry field for field, so neither side can drift

  - id: PRIVACY-02
    rationale: "A versioned data-domain registry prevents new product tables from silently escaping the shared account export, and the export tells the user what it withheld instead of presenting a projection as the whole answer."
    status: pending
    approvedBy: []
    approvedAt: null
    evidenceRefs: []
    category: privacy
    title: Account data export covers every registered Tomverse data domain
