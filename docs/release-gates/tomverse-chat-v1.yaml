schemaVersion: 1

metadata:
  product: tomverse-chat
  release: v1
  status: draft
  lastUpdated: "2026-08-05"
  sourceOfTruth: true

governance:
  description: >-
    Canonical release-gate registry for Tomverse Chat v1. Human-readable tables
    must be generated from this file and must not be edited independently.
  generatedMarkdownOnly: true
  manualThresholdTablesForbidden: true
  thresholdChangeRequires:
    - product-owner
    - independent-reviewer
  validatorCommand: npm run verify:tomverse-chat-release-gates
  implementationStatus: planned
  approvalSystemOfRecord: this-file
  approvalPolicy:
    allowedStatuses:
      - pending
      - evidence-ready
      - approved
      - failed
      - not-applicable
    releaseModeRules:
      - Every applicable blocking gate must have status approved.
      - >-
        approvedBy must contain an accountable gate-owner approval and an
        independent-reviewer approval. Whether those two roles may be held by
        the same subject is decided by soleApproverAllowed below.
      - approvedAt must be a non-null RFC 3339 timestamp.
      - evidenceRefs must contain immutable links or artifact identifiers.
      - >-
        not-applicable is allowed only when appliesWhen evaluates false and the
        decision has independent approval and an applicability evidence reference.
    soleApproverAllowed: true
    soleApproverRationale: >-
      This organization has one accountable person. A rule requiring two
      different human subjects is not strict here, it is unsatisfiable: every
      blocking gate would stay unapprovable forever, and the register would stop
      describing the release rather than start describing it more carefully. So
      one subject may hold both roles.

      What the two-person rule was protecting is kept in the dimension that still
      exists. Most evidence in this repository is produced by automation, and the
      separation that matters is that a person reads it before it counts: the
      approver must be a human who did not produce the referenced evidence, and
      automation may never appear in approvedBy under either role. An
      AI-generated artefact approved by the human who commissioned it is one
      review; the same artefact approved by nobody is none.

      Set this back to false the day a second accountable person exists. The
      validator reads this field rather than hard-coding either answer, so that
      is the only edit required to restore two-person approval.
    approvedByEntrySchema:
      required:
        - subject
        - role
      roles:
        - gate-owner
        - independent-reviewer
      subjectFormat: repository-or-corporate-identity
    independentReviewerRule: >-
      The independent reviewer must be a person who did not produce the
      referenced evidence. Co-implementers of a feature may approve as
      gate-owner but may not serve as the independent reviewer for gates whose
      evidence they produced. Where soleApproverAllowed is true, "did not
      produce the evidence" is read against the actual author of the artefacts
      -- automation, in most cases -- rather than against the other human, of
      whom there is none.
  requiredFields:
    - id
    - rationale
    - category
    - title
    - blocking
    - owner
    - criteria
    - evidence
    - status
    - approvedBy
    - approvedAt
    - evidenceRefs

ownerRoles:
  backend-ai: Router, Planner, provider adapters, billing integration, and auth server
  web-ui: shared chat UI, mobile web, PWA, and accessibility
  mobile-release: native shell, deep links, store submission, and review operations
  product-qa: evaluation sets, release evidence, regression, and gate sign-off
  security-privacy: threat tests, privacy workflows, and data-domain registry
  finance-ops: credit ledger reconciliation and refund policy

gates:
  - id: ROUTE-01
    rationale: "A 95% confidence-interval lower bound prevents a noisy point estimate from approving a Router that may be materially worse than the fixed-model baseline."
    status: pending
    approvedBy: []
    approvedAt: null
    evidenceRefs: []
    category: routing
    title: Auto Router quality is non-inferior to the fixed-model baseline
    blocking: true
    owner: backend-ai
    criteria:
      - metric: evaluation_win_rate_delta_ci95_lower_pp
        operator: gte
        value: -2
    evidence:
      - >-
        Versioned decision-grade evaluation report with fixed-model baseline,
        sample size, paired evaluation unit, confidence-interval method, seed,
        point estimate, and 95% confidence-interval bounds.
      - >-
        NOT the shadow report. Shadow records the model the Router would have
        chosen; it never generated that model's answer, so there is no pair to
        compare and no win rate to compute. A Router that echoed the user would
        agree with every shadow row and be worth nothing, and one that is right
        where the user was wrong appears there as disagreement. The shadow
        agreement rate measures how much would change if Auto were switched on
        -- the blast radius -- and nothing about whether the change would be an
        improvement. npm run report:routing-shadow prints that distinction
        beside its own numbers so the two cannot be read as one result.
      - >-
        Produced by npm run eval:router-quality -- --mode=decision, which makes
        real billed calls and emits the report above. npm run
        check:router-quality-eval validates a report before it may be cited: it
        refuses a pilot or judge-bias run, a run against the development set, a
        run that stopped at its cost ceiling, a second use of an already-used
        decision set, a baseline pre-registered after the run started, and a
        routable judge whose cited calibration is not a calibration of that
        judge, over development-set answers from a run that finished, against
        an independent judge that wrote none of them. The procedure the harness
        implements is docs/ops/tomverse-chat-router-evaluation-set.md; a
        passing check means the report is citable, not that the gate is
        approved.

