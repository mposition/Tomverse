      convention: that is what makes the effective-request hash evidence rather
      than a field. Immutability stops at the account boundary, though --
      the routing policy is explicit that user deletion takes priority over
      audit retention, so the cascade removes it like anything else. It holds
      references and hashes, never the prompt, so there is nothing here that
      deletion would otherwise have to scrub.

  # --- routing identity (dark) ----------------------------------------------
  #
  # Design: .github/audits/multi-provider-routing-deployment-identity-design-2026-09-22.md.
  #
  # Both tables are dark -- nothing reads or writes them, held by
  # `npm run check:dark-tables` -- and both are here anyway. A table reaches
  # this registry because the schema says it is reachable from User, not
  # because a writer exists yet: a row that arrives before the registry entry
  # is a row nobody graded, and the first one would arrive on the day somebody
  # enables the config writer.
  #
  # Neither holds a secret. A credential binding names where a key is kept and
  # who pays for calls made with it; the key itself is not in this database.

  # Two approver identities, both `actor` and neither with a User relation.
  #
  # `approvedBy` is a durable operator identifier, which is what the sweep
  # started reading on 2026-09-21. These two rows exist because it does: the
  # whole value of an approval is that somebody is answerable for it, and one
  # that cannot say who gave it is not an approval.
  #
  # Deliberately no relation to User. Deleting the approver's account must
  # not rewrite the record of what they approved -- the same reasoning
  # AdminAuditLog, the Prompt Refiner stage and EmailSendApproval record.

