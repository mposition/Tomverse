    prismaModel: ChatComposerDraft
    userLinkageRole: subject
    owner: backend-ai
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      Authenticated Chat's unsent composer text and ordered opaque attachment
      handles. The row cascades both from the account and, for a stored scope,
      from its conversation. Unified export includes the user's text, scopeKey
      (which is the conversation id for a stored scope), revision and timestamps
      while withholding the duplicate conversation foreign key, internal row id
      and attachment identifiers. Deleting this row never deletes the referenced
      upload or attachment; their existing lifecycle remains authoritative.

  - domain: chatResponseAttempt
