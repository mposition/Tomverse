  # The two suppression tables, registered 2026-09-22.
  #
  # They were outside this registry because the identifier pattern read
  # `email` or something ending in `Email`, and theirs is `emailAddress` --
  # the two tables whose entire purpose is to remember a mailbox after the
  # account is gone were the ones the pattern could not see.
  #
  # Deletion and retention are decided: docs/policy/email-notifications.md
  # section 13.3 keys suppression by address precisely so that closing an
  # account and signing up again does not clear it. The export axis is not
  # decided, and saying so is the point of `unverified`.

  - domain: suppressionCause
    prismaModel: SuppressionCause
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - evidence
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        One cause of a suppression, append-only, and the record every send
        decision reads. It is keyed by address rather than by account on
        purpose: a spam complaint follows the mailbox, so deleting an account
        and signing up again must not clear it
        (docs/policy/email-notifications.md section 13.3). A suppression that
        disappeared with the account would mean sending again to the person
        who complained, which is the outcome the whole table exists to
        prevent.
      retentionStartsFrom: "occurredAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: unverified
    note: >-
      No User relation, by design. The export axis is unverified rather than
      decided: this registry's export is scoped to an account, and a
      suppression is scoped to an address, so returning one means resolving
      the account's current address -- which would miss a suppression against
      a previous address and disclose one against an address the account no
      longer holds. Whether an account is entitled to be told it is suppressed,
      and against which address, is a decision nobody has made.

  - domain: suppressionEntry
    prismaModel: SuppressionEntry
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - evidence
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        What the suppression list looked like before causes existed. Nothing
        writes it since deploy C (migration 20260921090000) and nothing reads
        it in a send decision, but the rows are the record of why addresses
        were suppressed before 2026-09, which the cause rows derived from them
        do not independently prove.
      retentionStartsFrom: "createdAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: unverified
    note: >-
      Frozen: no writer remains. Registered for the same reason as
      suppressionCause and carrying the same open export question; a table
      nothing writes is still a table holding addresses.

  - domain: emailPermissionEvent
    prismaModel: EmailPermissionEvent
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - evidence
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        The facts a sending basis rests on that are not a consent: a notice
        shown, an objection, a relationship starting and ending. Australia puts
        the burden of proving an inferred consent on the sender, so these carry
        the same burden ConsentRecord carries for express consent -- and for the
        same reason they cannot leave with the account, because the addresses
        most likely to be complained about are the ones most likely to have
        closed first. Establishing this against GDPR Article 17(3) and PIPA
        Article 21 is contract question Q6, the same one consentRecord waits on.
      retentionStartsFrom: "occurredAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      Append-only, and the database enforces it: the one update the row accepts
      is the foreign key's own SET NULL when the account goes, which is the
      anonymisation recorded here. Everything else raises. emailAddress stays
      because the fact attaches to a mailbox rather than to an account, exactly
      as it does in consentRecord; evidence holds a screen identifier and the
      notice copy's hash, never the request and never message content.

  - domain: emailSendApproval
    prismaModel: EmailSendApproval
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    subjectReference:
      kind: child_rows
      childModel: EmailSendApprovalMember
      childColumn: approvalId
    minimisationFields:
      - approvedByEmail
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        An owner's decision to send without a basis, or to not perform a display
        duty. The identity kept is the approver's, and it is kept on purpose:
        the whole value of the row is that somebody is answerable for it, and an
        approval that cannot say who gave it is not an approval. The address is
        held beside the account id because an account can be renamed and a
        reader a year later needs the second. Deleting the approver's account
        must not rewrite it, which is why there is no User relation -- the same
        reasoning as AdminAuditLog and the Prompt Refiner stage.
      retentionStartsFrom: "approvedAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: excluded
    exclusionReason: >-
      The subject of the row is the approver, not the exporting account.
      Returning it would hand one account another person's identity and
      reasoning. An account's own presence in what was approved is exported
      through emailSendApprovalMember, which carries the approval's type, scope
      and dates without the approver.
    note: >-
      Sealed: once sealedAt is set, triggers refuse every update and delete on
      the row and on its cohort. An approver asking for their own data or its
      erasure is a manual PrivacyRequest rather than an automated path: the row
      is immutable audit evidence under legal hold, so the answer is the
      retention basis above and not a deletion. The cohort is the link to the
      people the decision was about.

  - domain: emailSendApprovalMember
    prismaModel: EmailSendApprovalMember
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - addressDigest
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Which accounts an approval covered. "78 accounts" is the description and
        this list is the scope, so removing a row would silently widen or narrow
        a decision that was already made -- and the question the row answers,
        "was this send within what was approved", is asked after the fact and
        often about an account that has since closed.
      retentionStartsFrom: "createdAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      Deliberately has no foreign key to User, which is why deletion is retain
      rather than a cascade or a SET NULL: the cohort is what an approval
      covered at the moment it was sealed, and a membership that changed when an
      account closed would no longer be that. The address is held only as a
      SHA-256 of its normalised form -- enough to refuse a send to a mailbox the
      approval was not about, not enough to be a second copy of the mailing
      list. addressNormalizationVersion records which rule produced it.

  - domain: emailSendApprovalRevocation
    prismaModel: EmailSendApprovalRevocation
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    subjectReference:
      kind: parent_row
      parentColumn: approvalId
      parentModel: EmailSendApproval
    minimisationFields:
      - revokedByEmail
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Withdrawal of an approval, kept for as long as the approval it
        withdraws, and holding the revoking person's identity for the same
        reason the approval holds the approver's. A revocation that could be
        deleted would let a withdrawn approval look live again, which is the one
        direction this ledger must never move in.
      retentionStartsFrom: "revokedAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: excluded
    exclusionReason: >-
      The identity in it is the revoking person's, not the exporting account's.
      The people the withdrawn approval was about reach it through the
      approval's cohort, which is exported.
    note: >-
      Append-only by trigger; the approval row is never touched. Erasure or
      access for the revoking person is a manual PrivacyRequest against the
      retention basis above, as it is for the approval itself.

  - domain: emailPermissionDecision
    prismaModel: EmailPermissionDecision
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - authorities
      - blockers
      - countryCandidates
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Why one message was or was not permitted. It is the answer to a
        regulator's question and to a complaint, both of which arrive after the
        send and often after the account has closed. It holds no message content
        -- only which authorities were applied, how each ended, and which rows it
        rested on.
      retentionStartsFrom: "evaluatedAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      Effectively immutable: after insert the row accepts exactly one of four
      transitions, each once -- the account detaching (the SET NULL recorded
      here), the delivery detaching when it is purged, the evidence set
      sealing, and the provider submission being recorded. Anything else
      raises. The delivery link is SET NULL rather than
      RESTRICT because a delivery is purged on its own schedule and the verdict
      is what outlives it: losing the message must not take the reason it was
      permitted with it.

  - domain: emailCampaignRecipient
    prismaModel: EmailCampaignRecipient
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      The campaign's record of who was in an audience and who received nothing,
      which EmailDelivery cannot hold: the reasons somebody is skipped are
      exactly the reasons no delivery row is written for them. Cascaded rather
      than SetNull like emailDelivery, and the difference is what the two rows
      are. A delivery is evidence that a required notice was delivered and
      outlives the account for that reason; this is the record that one was
      *not*, which nothing obliges anybody to keep -- and it holds the address,
      so keeping it unlinked would be the worse outcome rather than the safer
      one. The campaign's own reach survives in EmailCampaignWave.expandedCount,
      which names nobody.

  - domain: emailDelivery
    prismaModel: EmailDelivery
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - renderedSubject
      - renderDataSnapshot
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Evidence that a legally required notice was actually delivered --
        a breach notification, a terms change, a price change. The notices that
        most need proving are the ones people close their account over, so a
        record that cascades away is missing exactly when it is wanted.
        Ordinary transactional and marketing rows have no such basis and should
        fall to a TTL well short of this; splitting the two is contract question
        Q6 and the reason this row is legal_hold rather than ttl today.
      retentionStartsFrom: "createdAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      renderDataSnapshot is the personalisation input a message was built from,
      kept so an audit can reconstruct what was sent rather than merely attest
      that something was. It is always NULL on the credential lane, enforced by
      a CHECK: for a login code the personalisation input is the secret itself,
      so minimising it leaves nothing to store. renderedHash is a keyed HMAC for
      the same reason -- a plain digest over a body containing a six-digit code
      is reversible in a million tries, which would make the audit column the
      thing worth stealing.

  # --- native mobile sign-in ------------------------------------------------
  #
  # Four rows for five tables. MobileRefreshRotation is absent deliberately and
  # not by oversight: it carries no user column and no User relation -- a
  # digest, a pepper generation and four timestamps hanging off a family -- so
  # the sweep does not ask it to register and registering it would fail on the
  # "carries no user data in the schema" rule. It is removed by the cascade
  # from MobileTokenFamily, which is removed by the cascade from User.
  #
  # 2026-09-09: that table gained `mintedByDeploymentId` (A2 of the
  # evidence-binding approval), and the judgement above is unchanged. The value
  # is a Railway deployment identifier -- a fact about our own infrastructure,
  # the same one /api/build-info already publishes unauthenticated -- so it
  # neither makes the row user-linked nor changes how it is deleted. E4 of that
  # approval asked for the column to be reflected here; this note is that
  # reflection, because a row for the table would be rejected by the very rule
  # the paragraph above states.
  - domain: mobileDevice
    prismaModel: MobileDevice
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      The devices a person has signed in on. What it deliberately does not hold
      is the point of the row: no hardware fingerprint, advertising identifier,
      IDFV, ANDROID_ID, model detail or OS build, and no IP at all -- not even
      a truncated one (mobile auth design D16 and D17, approved 2026-08-31).
      A device list rich enough to be genuinely useful is also a location and
      hardware history, and this product has no password, so the account
      takeover path is email and the collateral is correspondingly larger.
      The `id` is a server-issued random value, so it identifies the device to
      Tomverse and to nothing else.

  - domain: mobileTokenFamily
    prismaModel: MobileTokenFamily
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      One row per mobile sign-in, and the parent of the rotation chain that
      keeps it alive. Reached from User twice over -- directly and through
      MobileDevice -- because both deletions must take it: removing a device
      ends its sessions, and removing an account ends all of them.

  - domain: mobileLoginGrant
    prismaModel: MobileLoginGrant
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: excluded
    note: >-
      The sixty-second one-time grant that carries an authorisation from the
      signed-in browser to the native app (design D14.1). Neither the grant
      secret nor the PKCE verifier is stored -- only digests of each -- and the
      row is single-use. The maintenance sweep deletes expired grants on its own
      schedule; the cascade is what covers a deletion that arrives inside the
      minute.

  - domain: mobileAuthEvent
    prismaModel: MobileAuthEvent
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      The mobile auth audit trail (design D15). Approved decision 9 of
      2026-08-31 requires that account deletion remove the rows and identifiers
      naming the user, their devices and their families, leaving only
      de-identified aggregates -- so the row cascades rather than being
      anonymised, and no aggregate table exists yet to keep anything in. The
      two columns that could have escaped that, `deviceId` and `familyId`, carry
      no foreign key of their own (an audit row outlives the device it describes,
      which is the point of auditing a revocation); a CHECK constraint therefore
      requires `userId` to be present whenever either of them is, so the only
      rows the cascade leaves behind are refusals that name nobody.
      Separately from deletion, the table has a 90-day operational ceiling
      (`MOBILE_AUTH_EVENT_RETENTION_DAYS`, approved decision 9), enforced by the
      `mobileAuthEvents` retention policy and its maintenance step. That is an
      age limit on a live account's rows, not a period anything survives a
      deletion for, which is why this row's retentionPolicy is `immediate`.

  - domain: amuxBoardImportApproval
    prismaModel: AmuxBoardImportApproval
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: statutory
    implementationStatus: implemented
    retention:
      retentionPolicyRef: "TBD-security-retention-schedule"
      legalBasis: >-
        Operator approval evidence for one catalog-import attempt. The row
        names the administrator who prepared it and is retained for security
        investigation and audit. The retention period is not a legal
        determination; it stays TBD until security and legal approval, and a
        legal hold outranks any later purge.
      retentionStartsFrom: "preparedAt"
      retentionPeriod: "TBD-pending-security-and-legal-approval"
      owner: security-privacy
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-12-22"
    subjectReference:
      kind: none
    inUnifiedExport: excluded
    note: >-
      actorUserId is the operator id and intentionally has no User foreign key:
      account deletion must not rewrite approval evidence. The row is operator
      approval evidence, not customer data. It stores source identities and
      digests, not a customer's prompt or file. Operator requests are handled
      through the manual PrivacyRequest path, together with the linked
      tamper-evident AdminAuditLog entry.
