  - domain: comparisonReviewRun
    prismaModel: ComparisonReviewRun
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: ttl
    ttlDays: 90
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - subjectKey
      - traceId
      - conversationId
    anonymisationReplacements:
      subjectKey: "deleted-account"
      traceId: "deleted-account"
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-30"
      joinRisksConsidered:
        - >-
          Closed. userId is nullable and carries no relation, deliberately: a
          guest run has no user at all, and a cascade would delete the
          operational history the reliability trend is computed from.
