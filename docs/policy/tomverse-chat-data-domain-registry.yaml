    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      The audit trail of who downloaded this account's data. Cascade rather
      than an explicit delete on purpose: the validator can verify a cascade
      against the schema, where a line in accountDeletion.ts is only a claim.
      Live rows are also swept at 90 days by cleanupExpiredData -- the ticket
      dies at its five-minute expiry, but an audit covering only the last five
      minutes is the same as having none.

  # --- deleted explicitly ---------------------------------------------------
  - domain: chatContextBundleConsumption
    prismaModel: ChatContextBundleConsumption
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: excluded
    note: >-
      Also swept by deleteExpiredContextBundleConsumptions on the bundle's own
      expiry, which is minutes. The explicit delete in lib/accountDeletion.ts is
      what makes deletion immediate rather than eventual: the userId column is
      non-null and carries no relation, so nothing else would remove it.

  - domain: routingRun
    prismaModel: RoutingRun
    # The row describes the person whose request was routed, not an operator
    # who wrote it about someone else -- same reading as ProductAnalyticsEvent,
    # and the reason the cascade below is the whole obligation.
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: excluded
    note: >-
      Shadow routing telemetry (docs/policy/tomverse-chat-routing.md §5): the
      model the Router would have chosen, beside the one that actually ran, as
      versions, labels and counts. Cascade rather than SetNull, deliberately.
      subjectKey and traceId would still name the person after a null userId,
      so a surviving row would be a half-anonymisation this registry would have
      to carry as a gap -- and a new telemetry table has no claim on outliving
      its subject. Shadow evaluation is an aggregate, so losing the rows of
      accounts that delete is a sampling effect rather than a hole. A guest run
      carries no userId and is untouched, which is why the column stays
      nullable.

  # --- anonymised at deletion, implemented ----------------------------------
  - domain: feedback
    prismaModel: Feedback
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - email
      - message
      - traceId
      - userAgent
      - emailUpdatesConsent
    anonymisationReplacements:
      message: "[deleted account]"
      emailUpdatesConsent: false
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          OPEN. traceId is nulled here, but FeedbackAutoFixCase.traceId and
          TraceErrorEvidence.traceId carry the same value and are not nulled, so
          the trace can be recovered in reverse and re-linked to whatever else
          logged it. Closing this needs those two scrubbed in the same
          transaction.
        - >-
          OPEN. FeedbackLifecycleEvent rows hang off this report and hold the
          submitter's address for the notification they rendered. The parent's
          email is cleared and the children's is not.
        - >-
          Accepted. The report body is replaced wholesale rather than redacted,
          so free text the submitter wrote about themselves does not survive.
    inUnifiedExport: included

  - domain: refundRequest
    prismaModel: RefundRequest
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - email
      - stripeCustomerId
      - stripeSubscriptionId
      - reason
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          OPEN. stripeRefundId and stripeChargeId survive, and Stripe holds the
          customer behind both. The Tomverse-side identifiers are cleared while
          the third-party ones that resolve to the same person are not.
        - >-
          OPEN. RefundRequestTimelineEvent.actorEmail survives on the child
          rows, and the requester is the actor on the events they raised.
        - >-
          Accepted. subscriptionCurrentPeriodEnd, plan and the refund amount
          remain. They are a financial shape, not an identifier, and the row is
          kept so a refund dispute can still be answered.
    inUnifiedExport: included_filtered

  # --- anonymised at deletion, decided but not yet built ---------------------
  - domain: chatLimitDecisionEvent
    prismaModel: ChatLimitDecisionEvent
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: ttl
    ttlDays: 90
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - subjectKey
      - traceId
    anonymisationReplacements:
      subjectKey: "deleted-account"
      traceId: "deleted-account"
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. userId is nullable but carries no relation, so neither a
          cascade nor a SetNull touched this table; the row kept naming the user
          until purgeExpiredChatLimitDecisions reached it up to 90 days later.
          anonymiseAccountData now clears it at deletion, and the TTL is the
          backstop it was always meant to be.
        - >-
          Closed. subjectKey and traceId both re-join the row to the chat logs
          and are NOT NULL, so each takes the shared "deleted-account"
          placeholder rather than a value that still resolves.
        - >-
          Accepted. modelIds, enabledTools, the token and cost estimates and the
          limit thresholds remain. They describe a refused request, not a
          person, and the row exists to answer "why was this blocked".
    inUnifiedExport: excluded

  - domain: chatCreditReservation
    prismaModel: ChatCreditReservation
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - subjectKey
      - traceId
      - providerRequestId
      - providerResponseId
      - reservationPayload
      - providerUsageSnapshot
    anonymisationReplacements:
      subjectKey: "deleted-account"
      traceId: "deleted-account"
      reservationPayload: "{}"
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. subjectKey and traceId join this row to the chat logs and
          providerRequestId and providerResponseId join it to the provider's own
          records, which are held by somebody else and outlive anything decided
          here. All four are cleared; the two NOT NULL columns take the shared
          placeholder.
        - >-
          Closed. reservationPayload and providerUsageSnapshot are snapshots of
          the request and the provider's reply. The credit lots they would let a
          reconciliation sweep refund cascade away with the account, so there is
          nothing left to refund and nothing lost by emptying them.
        - >-
          Accepted. provider, modelId, the credit and token counts and the
          timings remain. This is the financial record the row exists to be, and
          without a subject key or a trace it describes a transaction rather
          than a person.
    inUnifiedExport: included_filtered
    note: >-
      The relation is onDelete: SetNull, so userId clears itself today and
      nothing else does. subjectKey and traceId still join this row to the chat
      logs, and providerRequestId joins it to the provider's own records --
      which is exactly the case where userId = NULL looks like anonymisation
      and is not.

  - domain: imageCreditReservation
    prismaModel: ImageCreditReservation
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - generationId
      - conversationId
      - targetId
      - providerRequestId
      - reservationPayload
    anonymisationReplacements:
      generationId: "anonymised:{id}"
      reservationPayload: "{}"
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. generationId is UNIQUE, so a shared placeholder would collide
          across every anonymised row; it takes "anonymised:" plus the row's own
          primary key instead. It points at an ImageGeneration that cascades
          away, but the identifier is what other logs recorded, so the join is
          what mattered rather than the row it used to reach.
        - >-
          Closed. conversationId and targetId reach the user's own conversations
          and earlier generations, and providerRequestId reaches the provider's
          records. All three are cleared, along with the reservationPayload
          snapshot.
        - >-
          Accepted. preset, quality, size, provider, modelId and the credit
          amounts remain, as the financial record. identitySource is deliberately
          NOT anonymised -- it says whether the row's identity was recorded or
          inferred by the v1 backfill, which is a fact about Tomverse's own data
          quality and names nobody.
    inUnifiedExport: included_filtered
    note: >-
      generationId is unique, so it cannot take a shared placeholder; the
      replacement interpolates the row's own primary key. It points at an
      ImageGeneration that cascades away, but the identifier itself is what
      other logs recorded.

  - domain: memoryExtractionCreditReservation
    prismaModel: MemoryExtractionCreditReservation
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - userId
      - runId
      - reservationPayload
    anonymisationReplacements:
      runId: "anonymised:{id}"
      reservationPayload: "{}"
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. runId is UNIQUE and reaches the MemoryExtractionRun, which
          reaches the memories themselves; it takes "anonymised:" plus the row's
          own primary key. The run cascades away with the account, so the
          identifier is again the join rather than the destination.
        - >-
          Closed. reservationPayload held the per-lot refund entries, whose lots
          cascade away with the account.
        - >-
          Accepted. provider, extractionModelId, promptVersion, the chunk counts
          and the credit amounts remain. promptVersion is Tomverse's own prompt
          revision, not anything the user wrote.
    inUnifiedExport: included_filtered

  # --- retained -------------------------------------------------------------
  - domain: billingTransaction
    prismaModel: BillingTransaction
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: statutory
    implementationStatus: implemented
    retention:
      retentionPolicyRef: "TBD-finance-retention-schedule"
      legalBasis: >-
        Statutory accounting and tax records, and evidence for payment disputes
        and refunds. Australian tax law requires records explaining a
        transaction be kept for five years from the transaction; the OAIC's
        APP 11.2 destruction obligation is expressly subject to a retention
        requirement under an Australian law, and GDPR Article 17(3)(b) makes
        the same carve-out for a legal obligation. Both are exemptions from
        deletion, not from minimisation.
      retentionStartsFrom: "paidAt"
      retentionPeriod: "TBD-pending-finance-and-legal-approval"
      owner: finance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-05"
    inUnifiedExport: included_filtered
    note: >-
      OPEN, and it cuts both ways. The relation is onDelete: SetNull, so the
      userId clears on deletion while the row is kept for a statutory purpose
      that normally needs the record attributable. Either the retention basis
      does not require attribution -- in which case the row is really
      retain-and-anonymise and should say so -- or the SetNull defeats the
      basis. Finance and legal have to answer that before the period below can
      be filled in.

  - domain: privacyRequest
    prismaModel: PrivacyRequest
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - email
      - note
      - legalHoldReason
      - handledByEmail
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Evidence that a privacy request was received and answered, and defence
        of related legal claims -- GDPR Article 17(3)(e). The record of a
        deletion request is the one record a deletion request cannot itself
        erase.
      retentionStartsFrom: "completedAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-05"
    inUnifiedExport: included
    note: >-
      The retained row should be the fact of the request, not its contents.
      email is what proves who asked, so it stays until the hold lifts; note and
      legalHoldReason are free text that can name anyone and should be
      minimised once the request closes. handledByEmail names a Tomverse
      operator rather than the requester and is withheld from the export for
      that reason, not kept for this one.

  # --- the User link is the operator, not the subject -----------------------
  #
  # These three escaped the registry entirely until schemaVersion 3. The
  # derivation matched `user User @relation`; all three are `X User? @relation`
  # under some other field name, so nothing graded them.
  #
  # Both of their linkages needed a decision, and they are different people:
  # the operator who acted (a typed relation, onDelete: SetNull) and the person
  # the record is about (an untyped targetType/targetId pair with no foreign
  # key, which no derivation over the schema can see).
  - domain: adminAuditLog
    prismaModel: AdminAuditLog
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: statutory
    implementationStatus: implemented
    retention:
      retentionPolicyRef: "TBD-security-retention-schedule"
      legalBasis: >-
        Tamper-evident record of administrator action, kept for security
        investigation and to demonstrate that access controls were enforced.
        GDPR Article 17(3)(b) and (e) and the legitimate-interest basis for
        security monitoring; the OAIC's APP 11.2 destruction obligation is
        subject to a retention requirement under an Australian law.
      retentionStartsFrom: "createdAt"
      retentionPeriod: "TBD-pending-security-and-legal-approval"
      owner: security-privacy
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-05"
    subjectReference:
      kind: untyped_target
      targetTypeColumn: targetType
      targetIdColumn: targetId
      subjectTargetType: "User"
      deletionAction: retain
      retention:
        retentionPolicyRef: "TBD-security-retention-schedule"
        legalBasis: >-
          Same tamper-evident record, seen from the other side. An entry
          recording that an account was suspended or deleted is evidence about
          the subject as well as the operator, and removing it on the subject's
          request would let the one action most worth auditing erase its own
          audit.
        retentionStartsFrom: "createdAt"
        retentionPeriod: "TBD-pending-security-and-legal-approval"
        owner: security-privacy
        legalHoldOverridesPurge: true
        nextReviewAt: "2026-11-05"
    inUnifiedExport: excluded
    note: >-
      The actor's own address cannot be scrubbed here even though the relation
      is onDelete: SetNull and leaves it behind: actorEmail, ipAddress,
      userAgent, summary and metadata are all inputs to entryHash, and the
      chain verified by lib/adminAuditIntegrity.ts is what makes this table
      evidence rather than a log. Anonymising any of them would break every
      subsequent link. That is a real cost of the design and the reason this
      row is retain rather than anonymise -- not an oversight.
      OPEN for legal: a subject access request plausibly reaches entries about
      the requester. Automating that is not safe, because an entry names the
      operator and can name third parties, so it is routed to the manual
      PrivacyRequest path rather than the unified export.

  - domain: adminNote
    prismaModel: AdminNote
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - createdById
      - createdByEmail
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. The relation is onDelete: SetNull, so deleting the operator's
          account cleared createdById and left createdByEmail sitting beside it
          -- the exact shape the four reservation tables had. Both are cleared
          now.
        - >-
          Accepted. The note body remains after the author's account is gone.
          It is a record about the subject, not about the author, and the
          subject's own deletion is handled by subjectReference below.
    subjectReference:
      kind: untyped_target
      targetTypeColumn: targetType
      targetIdColumn: targetId
      subjectTargetType: "User"
      deletionAction: delete
      deletionMechanism: explicit_deletion
    inUnifiedExport: excluded
    note: >-
      Free text written by staff about a customer. Nothing deleted it when that
      customer deleted their account -- targetId is a bare string with no
      foreign key, so no cascade could reach it and none did. It is deleted
      explicitly now.
      OPEN for legal: a subject access request plausibly reaches notes about the
      requester, with third parties redacted. Redaction of free text cannot be
      automated safely, so it is routed to the manual PrivacyRequest path rather
      than the unified export.

  - domain: modelOverride
    prismaModel: ModelOverride
    userLinkageRole: actor
    owner: security-privacy
    deletionAction: anonymise
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    anonymisationFields:
      - updatedById
      - updatedByEmail
    reidentificationReview:
      reviewedBy: security-privacy
      reviewedAt: "2026-08-06"
      joinRisksConsidered:
        - >-
          Closed. Same SetNull-leaves-the-address shape as adminNote; both
          columns are cleared.
        - >-
          Accepted. status, reason and visibleNote remain. They describe a
          model, not a person -- this row is keyed by modelId and is global
          configuration, not anybody's setting.
    subjectReference:
      kind: none
    inUnifiedExport: excluded
    note: >-
      Global per-model configuration, keyed by modelId. It appears here only
      because an operator's identity is stamped on it; there is no data subject
      for it to be about.

  # --- the routing record's per-attempt half (routing policy §5) ------------
  #
  # Both cascade from RoutingRun, which cascades from User. The registry
  # verifies that transitively, so "deleted with the account" is a checked
  # claim rather than a comment -- and both carry their own userId so they are
  # data domains in their own right rather than child tables nothing grades.
  - domain: routingAttempt
    prismaModel: RoutingAttempt
    userLinkageRole: subject
    owner: backend-ai
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: excluded
    note: >-
      A separate table rather than columns on RoutingRun because one logical
      response can produce several attempts -- primary fails before any visible
      token, the fallback's Planner fails and is never dispatched, the
      fallback's pass-through succeeds -- each with its own model, tokenizer,
      Planner mode and effective request. Flattened onto the run they overwrite
      each other; in a JSON array they cannot carry the constraints that make
      ROUTE-06 true.

  - domain: contextManifest
    prismaModel: ContextManifest
    userLinkageRole: subject
    owner: backend-ai
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: excluded
    note: >-
      Immutable once finalized, enforced by a trigger rather than by
      convention: that is what makes the effective-request hash evidence rather
      than a field. Immutability stops at the account boundary, though --
      the routing policy is explicit that user deletion takes priority over
      audit retention, so the cascade removes it like anything else. It holds
      references and hashes, never the prompt, so there is nothing here that
      deletion would otherwise have to scrub.

  # --- email notification (MVP) ---------------------------------------------
  #
  # Contract: docs/policy/email-notifications.md.
  #
  # These three sit on opposite sides of one deliberate split. What a person
  # currently wants goes when they go; what proves what they once agreed to, and
  # what we did about it, does not. That asymmetry is the reason consent is two
  # tables rather than one: EmailPreference is overwritten every time a toggle
  # moves, and a row that gets overwritten cannot be evidence of anything.
  #
  # The retained pair keeps `emailAddress` after the account is gone, which the
  # SetNull relation does not scrub. That is the point rather than an oversight
  # -- consent and suppression attach to a mailbox, so a deleted-and-recreated
  # account must not clear a spam complaint -- and it is why both are `retain`
  # rather than `anonymise`. Whether GDPR Article 17(3) and PIPA Article 21
  # actually carry that, and for how long, is question Q6 of the contract and is
  # not settled here.

  - domain: emailPreference
    prismaModel: EmailPreference
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included
    note: >-
      Current state only, and it belongs to the person: it says which mail they
      want, which is theirs to take with them and theirs to have removed. The
      history behind it lives in ConsentRecord, which is what survives. Security
      and billing rows cannot be written disabled -- a CHECK constraint holds
      that -- so what cascades away here is never the reason a login alert was
      not sent.

  - domain: consentRecord
    prismaModel: ConsentRecord
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - ipHash
      - userAgentHash
      - evidence
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Proof of consent, which CASL and the Australian Spam Act both place on
        the sender rather than the recipient. A record that disappears with the
        account cannot discharge a burden that outlives it -- and the addresses
        most likely to be complained about are the ones most likely to have
        closed their account first. Establishing this against GDPR Article
        17(3) and PIPA Article 21 is contract question Q6.
      retentionStartsFrom: "occurredAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      Append-only: never updated, never deleted with the account. ipHash and
      userAgentHash are already the minimised form -- the raw values are not
      stored, because a hash proves the same thing about a consent event and a
      raw address proves things about everything else the person did. evidence
      holds the consent wording's hash and a screen identifier, never the
      request.

  - domain: emailDelivery
    prismaModel: EmailDelivery
    userLinkageRole: subject
    owner: security-privacy
    deletionAction: retain
    retentionPolicy: legal_hold
    implementationStatus: implemented
    minimisationFields:
      - emailAddress
      - renderedSubject
      - renderDataSnapshot
    retention:
      retentionPolicyRef: "TBD-compliance-retention-schedule"
      legalBasis: >-
        Evidence that a legally required notice was actually delivered --
        a breach notification, a terms change, a price change. The notices that
        most need proving are the ones people close their account over, so a
        record that cascades away is missing exactly when it is wanted.
        Ordinary transactional and marketing rows have no such basis and should
        fall to a TTL well short of this; splitting the two is contract question
        Q6 and the reason this row is legal_hold rather than ttl today.
      retentionStartsFrom: "createdAt"
      retentionPeriod: "TBD-pending-legal-approval"
      owner: legal-compliance
      legalHoldOverridesPurge: true
      nextReviewAt: "2026-11-21"
    inUnifiedExport: included_filtered
    note: >-
      renderDataSnapshot is the personalisation input a message was built from,
      kept so an audit can reconstruct what was sent rather than merely attest
      that something was. It is always NULL on the credential lane, enforced by
      a CHECK: for a login code the personalisation input is the secret itself,
      so minimising it leaves nothing to store. renderedHash is a keyed HMAC for
      the same reason -- a plain digest over a body containing a six-digit code
      is reversible in a million tries, which would make the audit column the
      thing worth stealing.
