    userLinkageRole: subject
    owner: backend-ai
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      Durable recovery state for one authenticated stored-Chat assistant
      response. The user-visible committed response prefix, status, attribution
      and terminal metadata are exported. Fingerprint, worker owner and lease
      are withheld concurrency internals. User, conversation and source-message
      cascades all remove the row; the assistant id is deliberately not a
      foreign key because the attempt must be claimed before an assistant
      Message exists.

