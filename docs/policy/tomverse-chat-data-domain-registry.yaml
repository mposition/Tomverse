schemaVersion: 2

metadata:
  status: draft
  lastUpdated: "2026-08-06"
  owner: security-privacy
  validatorCommand: npm run check:data-domain-registry
  purpose: >-
    Every table holding user data, and what account deletion and account export
    do with it. The delivery plan promises that a new product table cannot
    silently escape the privacy workflows; this registry plus its validator are
    that promise, made checkable. PRIVACY-01 and PRIVACY-02 are graded against
    it.

# Why two axes instead of one enum.
#
# schemaVersion 1 had a single `deletionMechanism` that mixed two unrelated
# questions -- what happens to the row when the account is deleted, and how long
# whatever survives is kept. "retained" answered neither precisely: it did not
# say whether the row keeps naming the person, and it did not say until when.
#
#   deletionAction   what happens to the row itself at account deletion.
#     delete         the row is gone.
#     anonymise      the row survives without pointing at the person. It is only
#                    honest when the row cannot be re-joined to them through
#                    another table, a log, or a third party -- setting userId to
#                    NULL is the beginning of that, not the end of it.
#     retain         the row survives, still attributable, under a stated legal
#                    basis. A legitimate decision, and a recorded one.
#
#   retentionPolicy  how long whatever survives is kept.
#     immediate      nothing survives past the deletion.
#     ttl            a purge job removes it after ttlDays.
#     statutory      a fixed period set by accounting or tax law.
#     legal_hold     kept until a hold is lifted, which can outlast the statute.
#
# The two are independent: a row can be anonymised and still sit under a TTL
# (ChatLimitDecisionEvent), or retained under a statute while its account is
# gone (BillingTransaction).

rules:
  - >-
    Every Prisma model carrying user data needs a row. The validator derives
    that set from prisma/schema.prisma, so adding a table without registering
    it fails the build rather than being noticed later.
  - >-
    deletionMechanism is pinned against the schema. "cascade_from_user" is only
    accepted when the model really is reachable from User by cascading
    relations, so removing a cascade cannot quietly leave data behind.
  - >-
    "anonymise" requires the field list, and the validator checks every field
    against the schema. Any column that still names the person directly --
    userId, ownerId, subjectKey, traceId, email -- must be in that list, because
    a row that keeps one of them has not been anonymised.
  - >-
    A non-nullable column cannot be anonymised by setting NULL, so
    anonymisationReplacements has to say what it becomes instead. A unique
    column needs a per-row value; "{id}" interpolates the row's own primary key.
  - >-
    "anonymise" also requires a reidentificationReview once implemented. The
    validator can check that the direct identifiers are handled; it cannot check
    whether the row can be re-joined to the person through a child table, a log,
    or Stripe. That is a human judgement, so the registry demands it in writing
    with its open risks named rather than assuming it was made.
  - >-
    "retain" requires the full retention block. Keeping financial or audit
    records past deletion is a legitimate decision; keeping them by omission is
    not, and "we keep it" without a period, a basis and a review date is
    indistinguishable from having forgotten.
  - >-
    implementationStatus separates what the code does from what has been
    decided. A "planned" row is an honest gap with a work reference, not a
    claim; PRIVACY-01 stays blocked while any row is planned or unverified.
  - >-
    "unverified" means nobody has established what happens yet. It is the
    honest state for a row that has not been traced through the deletion path,
    and it blocks PRIVACY-01 rather than being read as safe.
  - >-
    inUnifiedExport must equal the state declared in
    lib/accountDataExportDomains.ts. The registry describes the export that
    exists, not the one that was intended.

# Measured against develop on 2026-08-06: 33 registered models. User is the root
# and is deleted explicitly last; 23 are reachable from it by cascade. Of the
# remaining 9, ChatContextBundleConsumption is deleted explicitly in
# lib/accountDeletion.ts, six are anonymised there (Feedback and RefundRequest
# inline, the three credit reservations and ChatLimitDecisionEvent through
# lib/accountDataAnonymisation.ts), and BillingTransaction and PrivacyRequest
# are retained.
#
# The anonymisationFields below are also the column list
# lib/accountDataAnonymisation.ts writes, and tests/accountDataAnonymisation.test.mjs
# fails if the two drift. Writing it twice is the point: this file is the
# decision, that file is the implementation, and neither can quietly stop
# matching the other.
domains:
  # --- the account itself ---------------------------------------------------
  - domain: user
    prismaModel: User
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: explicit_deletion
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included_filtered
    note: >-
      The root row, deleted last inside the same transaction so every cascade
      above fires from it. Registered like any other domain because the export
      side needs it: without this row a user asking for their data receives
      their conversations and not their own name, email or plan.

  # --- cascade from User ----------------------------------------------------
  - domain: userSettings
    prismaModel: UserSettings
    owner: security-privacy
    deletionAction: delete
    deletionMechanism: cascade_from_user
    retentionPolicy: immediate
    implementationStatus: implemented
    inUnifiedExport: included

  - domain: userMemorySettings
    prismaModel: UserMemorySettings
    owner: security-privacy
    deletionAction: delete
