    notes: >-
      Pending review. https://help.aliyun.com/zh/model-studio/qwen3-7-max
      on 2026-08-24 publishes exact integers for this model: context length
      1,000,000, maximum input length 991,808, maximum output length 131,072.
      The page states the id is functionally equivalent to the snapshot
      qwen3.7-max-2026-05-20, so aliasOrLatest needs deciding when the row is
      verified -- no automatic-movement rule is documented either way.


      The output figure matches what the max-output probe measured against
      staging on the same date, so documentation and API agree there.


      Blocked on contextWindowIncludesOutput, which the page does not state.
      The arithmetic is suggestive: 1,000,000 - 991,808 = 8,192, and the
      thinking-mode input limit of 983,616 leaves exactly 16,384. Both land
      on powers of two, which reads as input and output sharing one
      1,000,000 window with a reserved minimum for the answer -- and that is
      what fitChatOutputToContextWindow already computes, since 1,000,000
      minus an input of 991,808 leaves the 8,192 the provider documents.


      It is still a derivation, and it is being held rather than adopted.
      Mistral and Anthropic have just shown, in this same file, that a clean
      reading of one provider's numbers does not transfer to the next.

