schemaVersion: 1

metadata:
  status: draft
  lastUpdated: "2026-08-24"
  owner: backend-ai
  validatorCommand: npm run check:context-window-register
  purpose: >-
    Verified provider context-window limits for every enabled Tomverse model,
    kept separate from executing code. Filling lib/models.ts directly is not a
    no-op: the chat route's guard only runs when contextWindowTokens is set, so
    a newly declared value immediately starts rejecting long requests that used
    to pass. Values are verified and recorded here first, their blast radius is
    measured in a shadow analysis, and only then are they connected to runtime.

rules:
  - >-
    A row may carry contextWindowTokens only when status is "verified".
    An unverified row keeps null. Values are never estimated, inferred from a
    sibling model, or copied from a provider's marketing page.
  - >-
    "verified" requires sourceUrl, sourceTitle, verifiedAt and verifiedBy.
    A number without provenance is not a verification.
  - >-
    contextWindowIncludesOutput must be stated explicitly. Providers differ on
    whether the published window covers input only or input plus output, and
    that difference decides what the guard may compare against.
  - >-
    catalogueDeclaredTokens mirrors whatever lib/models.ts currently declares.
    It is context for the verifier, never evidence: the 14 models that already
    declare a window recorded no source, so they are unverified too.
  - >-
    aliasOrLatest records whether apiModel points at a moving target. An alias
    can change window behind a fixed name, so its verification expires sooner.
  - >-
    Models sharing one upstream model still keep separate rows, referencing the
    same source. gpt-5-5 and gpt-5-5-thinking are the current example.

