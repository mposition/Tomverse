      max_completion_tokens exceeds the model context window, the API returns
      invalid_request_error." Stated, not inferred.


      maxOutputTokens stays null. That page documents a settable ceiling for
      K3 but not for K2.7 Code, and the max-output probe learned nothing --
      Moonshot accepted a cap of 1,000,000,000 rather than refusing it, the
