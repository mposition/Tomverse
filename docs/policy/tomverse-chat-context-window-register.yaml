  - modelId: "mistral-small-4"
    apiModel: "mistral-small-latest"
    provider: mistral
    status: verified
    contextWindowTokens: 262144
    contextWindowIncludesOutput: true
    maxInputTokens: null
    maxOutputTokens: null
    aliasOrLatest: true
    sourceUrl: "https://docs.mistral.ai/resources/known-limitations"
    sourceTitle: "Known limitations | Mistral Docs"
    verifiedAt: "2026-08-24"
    verifiedBy: backend-ai
    catalogueDeclaredTokens: null
    notes: >-
      Two independent sources agree, and that is what carries this row. The
      documentation states "Mistral Small 4 | 256k tokens". The provider's own
      /v1/models reports max_context_length 262,144 for mistral-small-latest,
      observed by the provider catalog monitor on 2026-08-24. 262,144 is
      256 x 1024, so the API resolves the documented "256k" into the exact
      integer this register requires. Neither source alone would have.


      Do not carry that reading to another provider. Anthropic's API answers
      200,000 for a documented "200k", which is decimal. The same letter means
      different things and each provider has to be checked on its own.


      contextWindowIncludesOutput is taken from the same page and is stated
      rather than inferred: "Token counts include both input and output
      tokens. Plan your max_tokens accordingly."


      aliasOrLatest is true, and it matters more here than usual. apiModel is
      the moving alias, currently resolving to mistral-small-2603
      (Mistral Small 4 v26.03). https://docs.mistral.ai/inference/model-lifecycle
      describes -latest as the "Latest General Availability version, across
      generations", so a new GA generation changes what Tomverse calls and
      this verification expires with it. lib/models.ts points at the alias
      too, so the exposure is not confined to this file.


      maxOutputTokens stays null: no settable ceiling is published, and the
      max-output probe learned nothing here -- Mistral accepted a cap of
      1,000,000,000 rather than refusing it, so it does not validate that
      field up front.

