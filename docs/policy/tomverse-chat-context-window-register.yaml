      on powers of two, which reads as input and output sharing one
      1,000,000 window with a reserved minimum for the answer -- and that is
      what fitChatOutputToContextWindow already computes, since 1,000,000
      minus an input of 991,808 leaves the 8,192 the provider documents.


      It is still a derivation, and it is being held rather than adopted.
      Mistral and Anthropic have just shown, in this same file, that a clean
      reading of one provider's numbers does not transfer to the next.

