    notes: >-
      Pending review. Two readings, both 2026-08-24.


      https://platform.claude.com/docs/en/about-claude/models/overview gives
      Claude Sonnet 5 a context window of "1M tokens" and max output of "128k tokens",
      against Claude API ID claude-sonnet-5, which is this row's apiModel.


      The provider's /v1/models resolves those into integers: the provider
      catalog monitor observed max_input_tokens 1,000,000 and max_tokens
      128,000 on the same date. So Anthropic's "1M tokens" is decimal, where
      Mistral's "256k" on the mistral-small-4 row is 262,144. The letters are
      not a shared convention and each provider has to be read separately.
      

      Blocked on contextWindowIncludesOutput. The API reference describes
      max_input_tokens as "Maximum input context window size in tokens",
      which is suggestive but is not a statement about whether the window
      covers the answer -- and the documented context window and the reported
      input limit are the same number, which is exactly the ambiguity.
      Guessing is the failure this field exists to prevent: a window that is
      too large passes the guard by inventing headroom, which is worse than
      declaring none.

