version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native port and no longer ships the JavaScript
      # compiler API. `next build` refuses it ("TypeScript 7.0.2 does not
      # provide the compiler API required by Next.js").
      #
      # This hold had a second reason -- scripts/text-encoding-check-core.mjs
      # used ts.createSourceFile and ts.SyntaxKind directly -- which is now
      # resolved (#278): the checker scans for string ranges itself and imports
      # nothing from typescript. Next.js is the only remaining blocker, and it
      # is not ours to fix; remove this entry once it supports the TypeScript 7
      # compiler API. TypeScript 6 stays eligible.
      - dependency-name: typescript
        versions: [">=7"]
      # ESLint 10 changed the rule context passed to a rule's create(), and the
      # eslint-plugin-react that eslint-config-next bundles still calls
      # context.getFilename(). Every lint run dies on the first React file with
      # "TypeError: Error while loading rule 'react/display-name':
      # contextOrFilename.getFilename is not a function", so `eslint .` reports
      # nothing at all rather than reporting less. eslint-config-next is pinned
      # to the Next.js version and cannot be upgraded on its own. Remove this
      # entry once the eslint-config-next that ships with our Next.js version
      # supports ESLint 10. ESLint 9 stays eligible.
      - dependency-name: eslint
        versions: [">=10"]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
