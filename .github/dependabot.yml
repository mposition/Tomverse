version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native port and no longer ships the JavaScript
      # compiler API. Both of this hold's original reasons are now gone, and
      # neither is why it is still here -- measured on typescript@7.0.2 with
      # next@16.3.0 on 2026-08-12:
      #
      #   next build     passes. Next.js runs the project-local tsc CLI by
      #                  default now (experimental.useTypeScriptCli), which is
      #                  documented as the way to enable TypeScript 7.
      #   tsc --noEmit   passes, no errors.
      #   test:unit      2495 pass. scripts/text-encoding-check-core.mjs scans
      #                  for string ranges itself and imports nothing from
      #                  typescript (#278).
      #   eslint .       dies before linting one file: "typescript-eslint does
      #                  not support TS 7.0."
      #
      # So the blocker is typescript-eslint, which eslint-config-next bundles
      # and which throws on any major >= 7 -- not Next.js, and not ours. Its
      # own tracking issue (typescript-eslint#10940) targets TS >= 7.1, so keep
      # the range at >=7 rather than excluding 7.0 alone: a 7.1 bump that
      # arrives before that support does would break every lint run again.
      # Remove this entry once the bundled typescript-eslint accepts TS 7.
      # TypeScript 6 stays eligible.
      - dependency-name: typescript
        versions: [">=7"]
      # ESLint 10 changed the rule context passed to a rule's create(), and the
      # eslint-plugin-react that eslint-config-next bundles still calls
      # context.getFilename(). Every lint run dies on the first React file with
      # "TypeError: Error while loading rule 'react/display-name':
      # contextOrFilename.getFilename is not a function", so `eslint .` reports
      # nothing at all rather than reporting less. eslint-config-next is pinned
      # to the Next.js version and cannot be upgraded on its own. Remove this
      # entry once the eslint-config-next that ships with our Next.js version
      # supports ESLint 10. ESLint 9 stays eligible.
      - dependency-name: eslint
        versions: [">=10"]
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
