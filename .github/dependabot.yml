version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    # Version updates go to develop, so a dependency change is released the way
    # every other change is: through staging, in a release someone cut.
    #
    # The default is the default branch, and on 2026-08-15 that put PR #570 --
    # twelve runtime dependencies at once, including the AI SDK, Stripe, the
    # Postgres driver, Sentry and the AWS S3 client -- straight onto `main`,
    # where it deployed to production ten minutes later. PR Fast Gate passed,
    # and that is real evidence; it is not evidence about the provider, the
    # payment processor, the database driver or the observability pipeline
    # those packages talk to, because CI talks to none of them. `/api/ready`
    # answering true is a startup and dependency-reachability fact, not a
    # behavioural one.
    #
    # ## Security updates do NOT honour this
    #
    # Dependabot raises security updates against the default branch whatever
    # `target-branch` says:
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#target-branch
    #
    # That is deliberate on their side and fine on ours -- an urgent fix should
    # not queue behind a release train. It does mean a `main` PR from Dependabot
    # is now a signal rather than routine, and the exception it travels under is
    # written down in `.github/RELEASE_CHECKLIST.md` ("Out-of-band changes to
    # main"): named as a security update, human-approved with a staging waiver,
    # a new release SHA recorded, verified beyond PR CI, a rollback SHA, and a
    # confirmed back-merge.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 is the native port and no longer ships the JavaScript
      # compiler API. Both of this hold's original reasons are now gone, and
      # neither is why it is still here -- measured on typescript@7.0.2 with
      # next@16.3.0 on 2026-08-12:
      #
      #   next build     passes. Next.js runs the project-local tsc CLI by
      #                  default now (experimental.useTypeScriptCli), which is
      #                  documented as the way to enable TypeScript 7.
      #   tsc --noEmit   passes, no errors.
      #   test:unit      2495 pass. scripts/text-encoding-check-core.mjs scans
      #                  for string ranges itself and imports nothing from
      #                  typescript (#278).
      #   eslint .       dies before linting one file: "typescript-eslint does
      #                  not support TS 7.0."
      #
      # So the blocker is typescript-eslint, which eslint-config-next bundles
      # and which throws on any major >= 7 -- not Next.js, and not ours. Its
      # own tracking issue (typescript-eslint#10940) targets TS >= 7.1, so keep
      # the range at >=7 rather than excluding 7.0 alone: a 7.1 bump that
      # arrives before that support does would break every lint run again.
      # Remove this entry once the bundled typescript-eslint accepts TS 7.
      # TypeScript 6 stays eligible.
      - dependency-name: typescript
        versions: [">=7"]
      # ESLint 10 changed the rule context passed to a rule's create(), and the
      # eslint-plugin-react that eslint-config-next bundles still calls
      # context.getFilename(). Every lint run dies on the first React file with
      # "TypeError: Error while loading rule 'react/display-name':
      # contextOrFilename.getFilename is not a function", so `eslint .` reports
      # nothing at all rather than reporting less. eslint-config-next is pinned
      # to the Next.js version and cannot be upgraded on its own. Remove this
      # entry once the eslint-config-next that ships with our Next.js version
      # supports ESLint 10. ESLint 9 stays eligible.
      - dependency-name: eslint
        versions: [">=10"]
      # @types/node is not an ordinary dependency: its major tracks a Node
      # runtime major, and describing a runtime we do not run is worse than
      # describing an old one. Everything here is pinned to Node 22 --
      # `engines.node` is "22.x", `.nvmrc` is 22.22.2, and every workflow sets
      # `node-version: 22` -- so @types/node@26 would type the standard library
      # as Node 26's. Code calling an API that only exists in 26 would
      # typecheck, pass CI, and throw at runtime, which is the one failure mode
      # a types package is supposed to make impossible.
      #
      # Raise this bound in the same change that raises the runtime, never on
      # its own. 22.x patches and minors stay eligible.
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      # Split by blast radius, not by `dependency-type`.
      #
      # #570 moved twelve runtime packages in one commit. Had production
      # misbehaved afterwards, the first question -- which of these did it --
      # would have had twelve answers and one revert covering all of them.
      # Grouping is still right (twelve separate PRs is how a queue stops being
      # read), but a group should be a set of packages that fail the same way.
      #
      # A package matching no pattern below still gets a PR of its own, which
      # is the safe residue.
      provider-sdks:
        dependency-type: production
        patterns:
          - "@ai-sdk/*"
          - "ai"
          - "openai"
          - "@anthropic-ai/*"
      payments-and-data:
        dependency-type: production
        patterns:
          - "stripe"
          - "pg"
          - "@prisma/*"
          - "prisma"
          - "next-auth"
          - "@auth/*"
      infrastructure-and-observability:
        dependency-type: production
        patterns:
          - "@sentry/*"
          - "@aws-sdk/*"
          - "@cloudflare/*"
      user-interface:
        dependency-type: production
        patterns:
          - "react"
          - "react-dom"
          - "next"
          - "lucide-react"
          - "highlight.js"
          - "tailwindcss"
          - "@tailwindcss/*"
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
