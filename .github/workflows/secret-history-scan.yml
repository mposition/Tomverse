name: Secret History Scan

# The token-level cache control, which a restore-only action is not: it narrows
# one declared step while the job keeps a key anything running in it can reserve
# an entry with. This workflow can run on develop or main, whose entries every
# run can restore, so its token gets none of that capability.
# .github/audits/actions-cache-poisoning-audit-2026-10-03.md P1a.
cache-mode: read

# The Tomverse app waits on the pushed commit's whole check suite
# (`checkSuites: true`). A red suite marks that deployment SKIPPED.
# On 2026-09-28 the weekly full-history scan started against
# d07ae95e46f5d37f4e727eee000c290632b2ef20 while Railway was still waiting,
# failed at 01:13:38Z, and both production deployments of that commit were
# marked SKIPPED at 01:13:40Z. The push scan of the same commit had already
# passed. The finding was a historical generic-api-key hit, not a change in
# that commit. The same collision is why back-merge and deployed-commit-drift
# use continue-on-error: the job stays red, the suite stays green, and
# Railway still deploys.
#
# continue-on-error is only for schedule and workflow_dispatch. A push to
# main still fails the suite, so a new leak still blocks the deploy.
#
# No pull_request trigger since 2026-11-09. PR Fast Gate's required
# `static-and-unit` job runs the same scripts/ci/gitleaks-scan.sh over the
# same base..head range on every ready pull request, so this workflow's PR
# run was a second runner and full-history checkout per PR push for an
# identical verdict (~170 runs a week). Pull requests keep their scan on the
# merge-blocking path; this file keeps the main push and weekly history scans.

on:
  push:
    branches: [main]
  schedule:
    - cron: "45 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a burst of pushes does not
# queue up scans of commits nobody will deploy. The event name keeps the push
# and the weekly full-history scan in separate groups -- they scan different
# commit ranges, and one must never cancel the other.
concurrency:
  group: secret-history-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # See the header. A scheduled or hand-run full-history failure must not
    # skip the production deploy that is waiting on this commit.
    continue-on-error: "${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # gitleaks-action until 2026-11-08, when its only download path (the
      # release web URL) returned 504; see scripts/ci/gitleaks-scan.sh. The
      # scan fails the check and writes no PR comments, as before.
      - name: Scan git history with gitleaks
        run: scripts/ci/gitleaks-scan.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload gitleaks SARIF report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore
