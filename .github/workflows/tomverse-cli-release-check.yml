          TOMVERSE_CLI_BIN="$exe" node --import tsx --test --test-concurrency=1 tests/cli.process.test.ts

      # WiX runs on .NET; not every Windows image ships the SDK (Arm).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # WiX v5 (MS-RL); v6 adds the Open Source Maintenance Fee terms.
      - name: Build the installer
