          TOMVERSE_CLI_BIN="$exe" node --import tsx --test --test-concurrency=1 tests/cli.process.test.ts

      - name: Build the installers
        run: |
          command -v rpmbuild || { sudo apt-get update && sudo apt-get install -y rpm; }
          node apps/tomverse-cli/scripts/build-installer.mjs

      - name: Install, run and remove the DEB
