name: Tomverse CLI release check

# Before the Tomverse CLI is published, this proves the package on every
# operating system it claims, on the machines GitHub provides for each:
#
# - npm package: build, unit and process tests, then `pack:verify` (pack,
#   install the tarball outside the repository, run the process suite against
#   the installed copy) on Windows, macOS and Linux with Node 22 and 24.
# - standalone executables: one Node.js single executable application per
#   OS and architecture (a SEA is built on the platform it targets), each run
#   through the same process suite with no Node.js on PATH; then its native
#   installer (Windows .msi, macOS .pkg, Linux .deb and .rpm) is built,
#   installed, run and removed again on that machine. Archives and installers
#   are kept as workflow artifacts, each with its .sha256.
#
# It only builds and tests. It publishes nothing: no npm publish, no GitHub
# Release, no signing identity. The operator runs it by hand before a release
# (Actions > Tomverse CLI release check > Run workflow) and publishes from the
# result -- apps/tomverse-cli/RELEASING.md.

on:
  workflow_dispatch:

# Read-only: nothing here may plant a cache entry another workflow restores.
cache-mode: read

permissions:
  contents: read

# Each job names its GitHub-hosted runner literally rather than through a
# matrix expression, so lib/agentCredentialReachability.ts can see that no job
# here runs anywhere that could hold a credential.

concurrency:
  group: tomverse-cli-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-linux:
    name: npm package (Linux, Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # v6 caches by default once package.json names a package manager;
          # nothing here restores a cache
          # (.github/audits/actions-cache-poisoning-audit-2026-10-03.md 4.2).
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run cli:typecheck

      - name: Build and test
        run: npm run cli:test

      - name: Pack, install and verify the tarball
        run: npm run cli:pack:verify

  npm-macos:
    name: npm package (macOS, Node ${{ matrix.node }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # v6 caches by default once package.json names a package manager;
          # nothing here restores a cache
          # (.github/audits/actions-cache-poisoning-audit-2026-10-03.md 4.2).
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run cli:typecheck

      - name: Build and test
        run: npm run cli:test

      - name: Pack, install and verify the tarball
        run: npm run cli:pack:verify

  npm-windows:
    name: npm package (Windows, Node ${{ matrix.node }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # v6 caches by default once package.json names a package manager;
          # nothing here restores a cache
          # (.github/audits/actions-cache-poisoning-audit-2026-10-03.md 4.2).
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run cli:typecheck

      - name: Build and test
        run: npm run cli:test

      - name: Pack, install and verify the tarball
        run: npm run cli:pack:verify

  standalone-windows-x64:
    name: standalone windows-x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TARGET: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The executable carries this runtime, so it is the current LTS line.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the executable
        run: npm --workspace @tomverse/cli run build:binary

      - name: Process tests against the executable
        shell: bash
        working-directory: apps/tomverse-cli
        run: |
          built="$(node -p "({win32:'windows',darwin:'macos',linux:'linux'})[process.platform]+'-'+process.arch")"
          if [ "$built" != "$TARGET" ]; then echo "this runner builds $built, not $TARGET"; exit 1; fi
          # A native path (not Git Bash's /d/...), so node can spawn it on Windows too.
          exe="$(node -e "const p=require('path'),v=require('./package.json').version;console.log(p.resolve('release','tomverse-'+v+'-'+process.env.TARGET,process.platform==='win32'?'tomverse.exe':'tomverse'))")"
          TOMVERSE_CLI_BIN="$exe" node --import tsx --test --test-concurrency=1 tests/cli.process.test.ts

      # WiX runs on .NET; not every Windows image ships the SDK (Arm).
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # WiX v5 (MS-RL); v6 adds the Open Source Maintenance Fee terms.
      - name: Build the installer
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          $env:WIX = "$env:RUNNER_TEMP\wix\wix.exe"
          node apps/tomverse-cli/scripts/build-installer.mjs

      - name: Install, run and remove the MSI
        shell: pwsh
        run: |
          $msi = Get-Item "apps/tomverse-cli/release/tomverse-*-$env:TARGET.msi"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 50; throw "msiexec /i exited $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Tomverse CLI\tomverse.exe"
          $version = & $exe --version
          if ($version -ne (Get-Content apps/tomverse-cli/package.json | ConvertFrom-Json).version) { throw "installed tomverse --version printed '$version'" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*Tomverse CLI*") { throw "the user PATH does not name the install folder: $userPath" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw "tomverse.exe is still there after uninstall" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -like "*Tomverse CLI*") { throw "the user PATH still names the install folder" }

      - name: Keep the archive and installers
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-windows-x64
          path: |
            apps/tomverse-cli/release/*.zip
            apps/tomverse-cli/release/*.tar.gz
            apps/tomverse-cli/release/*.msi
            apps/tomverse-cli/release/*.pkg
            apps/tomverse-cli/release/*.deb
            apps/tomverse-cli/release/*.rpm
            apps/tomverse-cli/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  standalone-windows-arm64:
    name: standalone windows-arm64
    runs-on: windows-11-arm
    timeout-minutes: 30
    env:
      TARGET: windows-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
