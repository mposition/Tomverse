          deb="$(ls apps/tomverse-cli/release/tomverse-*-$TARGET.deb)"
          sudo dpkg -i "$deb"
          test "$(/usr/bin/tomverse --version)" = "$(node -p "require('./apps/tomverse-cli/package.json').version")"
          sudo dpkg -r tomverse-cli
          test ! -e /usr/bin/tomverse

      - name: Install, run and remove the RPM (Fedora container)
        run: |
          rpm="$(basename "$(ls apps/tomverse-cli/release/tomverse-*-$TARGET.rpm)")"
          want="$(node -p "require('./apps/tomverse-cli/package.json').version")"
          docker run --rm -v "$PWD/apps/tomverse-cli/release:/release:ro" fedora:41 sh -ec             "dnf -y -q install /release/$rpm && test \"\$(tomverse --version)\" = '$want' && dnf -y -q remove tomverse-cli && test ! -e /usr/bin/tomverse"

      - name: Keep the archive and installers
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-linux-x64
          path: |
            apps/tomverse-cli/release/*.zip
            apps/tomverse-cli/release/*.tar.gz
