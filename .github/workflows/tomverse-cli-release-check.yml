      - name: Keep the archive and installers
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-windows-arm64
          path: |
            apps/tomverse-cli/release/*.zip
            apps/tomverse-cli/release/*.tar.gz
            apps/tomverse-cli/release/*.msi
            apps/tomverse-cli/release/*.pkg
            apps/tomverse-cli/release/*.deb
            apps/tomverse-cli/release/*.rpm
            apps/tomverse-cli/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  standalone-macos-arm64:
    name: standalone macos-arm64
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TARGET: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The executable carries this runtime, so it is the current LTS line.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the executable
        run: npm --workspace @tomverse/cli run build:binary

      - name: Process tests against the executable
        shell: bash
        working-directory: apps/tomverse-cli
        run: |
