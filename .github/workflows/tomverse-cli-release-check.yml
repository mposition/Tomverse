          if [ "$built" != "$TARGET" ]; then echo "this runner builds $built, not $TARGET"; exit 1; fi
          # A native path (not Git Bash's /d/...), so node can spawn it on Windows too.
          exe="$(node -e "const p=require('path'),v=require('./package.json').version;console.log(p.resolve('release','tomverse-'+v+'-'+process.env.TARGET,process.platform==='win32'?'tomverse.exe':'tomverse'))")"
          TOMVERSE_CLI_BIN="$exe" node --import tsx --test --test-concurrency=1 tests/cli.process.test.ts

      - name: Build the installer
        run: node apps/tomverse-cli/scripts/build-installer.mjs

      - name: Install, run and remove the PKG
        run: |
          pkg="$(ls apps/tomverse-cli/release/tomverse-*-$TARGET.pkg)"
          sudo installer -pkg "$pkg" -target /
          test "$(/usr/local/bin/tomverse --version)" = "$(node -p "require('./apps/tomverse-cli/package.json').version")"
          pkgutil --pkg-info app.tomverse.cli
          sudo rm /usr/local/bin/tomverse
          sudo rm -rf /usr/local/share/doc/tomverse-cli
          sudo pkgutil --forget app.tomverse.cli
          test ! -e /usr/local/bin/tomverse

      - name: Keep the archive and installers
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-macos-arm64
