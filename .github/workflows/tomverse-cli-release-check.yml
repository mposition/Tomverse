          $exe = Join-Path $env:LOCALAPPDATA "Programs\Tomverse CLI\tomverse.exe"
          $version = & $exe --version
          if ($version -ne (Get-Content apps/tomverse-cli/package.json | ConvertFrom-Json).version) { throw "installed tomverse --version printed '$version'" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($userPath -notlike "*Tomverse CLI*") { throw "the user PATH does not name the install folder: $userPath" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -PassThru
