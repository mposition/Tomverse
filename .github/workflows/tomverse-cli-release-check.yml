          retention-days: 14

  standalone-linux-x64:
    name: standalone linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET: linux-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The executable carries this runtime, so it is the current LTS line.
