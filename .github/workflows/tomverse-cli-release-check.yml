name: Tomverse CLI release check

# Before the Tomverse CLI is published, this proves the package on every
# operating system it claims, on the machines GitHub provides for each:
#
# - npm package: build, unit and process tests, then `pack:verify` (pack,
#   install the tarball outside the repository, run the process suite against
#   the installed copy) on Windows, macOS and Linux with Node 22 and 24.
# - standalone executables: one Node.js single executable application per
#   OS and architecture (a SEA is built on the platform it targets), each run
#   through the same process suite with no Node.js on PATH, then kept as a
#   workflow artifact with its .sha256.
#
# It only builds and tests. It publishes nothing: no npm publish, no GitHub
# Release, no signing identity. The operator runs it by hand before a release
# (Actions > Tomverse CLI release check > Run workflow) and publishes from the
# result -- apps/tomverse-cli/RELEASING.md.

on:
  workflow_dispatch:

# Read-only: nothing here may plant a cache entry another workflow restores.
cache-mode: read

permissions:
  contents: read

concurrency:
  group: tomverse-cli-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-package:
    name: npm package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # v6 caches by default once package.json names a package manager; this
          # job holds the run's token, so it restores no cache
          # (.github/audits/actions-cache-poisoning-audit-2026-10-03.md 4.2).
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run cli:typecheck

      - name: Build and test
        run: npm run cli:test

      - name: Pack, install and verify the tarball
        run: npm run cli:pack:verify

  standalone:
    name: standalone ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-x64, runner: windows-2025 }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The executable carries this runtime, so it is the current LTS line.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the executable
        run: npm --workspace @tomverse/cli run build:binary

      - name: Process tests against the executable
        shell: bash
        working-directory: apps/tomverse-cli
        env:
          TARGET: ${{ matrix.target }}
        run: |
          built="$(node -p "({win32:'windows',darwin:'macos',linux:'linux'})[process.platform]+'-'+process.arch")"
          if [ "$built" != "$TARGET" ]; then echo "this runner builds $built, not $TARGET"; exit 1; fi
          # A native path (not Git Bash's /d/...), so node can spawn it on Windows too.
          exe="$(node -e "const p=require('path'),v=require('./package.json').version;console.log(p.resolve('release','tomverse-'+v+'-'+process.env.TARGET,process.platform==='win32'?'tomverse.exe':'tomverse'))")"
          TOMVERSE_CLI_BIN="$exe" node --import tsx --test --test-concurrency=1 tests/cli.process.test.ts

      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-${{ matrix.target }}
          path: |
            apps/tomverse-cli/release/*.zip
            apps/tomverse-cli/release/*.tar.gz
            apps/tomverse-cli/release/*.sha256
          if-no-files-found: error
          retention-days: 14
