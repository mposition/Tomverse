            apps/tomverse-cli/release/*.msi
            apps/tomverse-cli/release/*.pkg
            apps/tomverse-cli/release/*.deb
            apps/tomverse-cli/release/*.rpm
            apps/tomverse-cli/release/*.sha256
          if-no-files-found: error
          retention-days: 14

  # macOS Developer ID signing and notarization (owner decision 2026-11-21).
  # Off unless the repository variable CLI_MACOS_SIGNING is exactly `on`. The
  # only job here that holds credentials: the `cli-release` environment's
  # secrets, which the owner creates with required reviewers and a branch
  # policy, so each run waits for the owner's approval before any secret is
  # read. It re-signs the two macOS executables the jobs above built and
  # tested (hardened runtime), rebuilds each .pkg signed with the installer
  # identity, sends both to Apple's notary service, staples the ticket to the
  # .pkg, checks Gatekeeper's verdict, and keeps the result as an artifact.
  # It uploads nothing to a release.
  sign-macos:
    name: sign and notarize macOS
    needs: [standalone-macos-arm64, standalone-macos-x64]
    if: vars.CLI_MACOS_SIGNING == 'on'
    runs-on: macos-15
    environment: cli-release
    # Apple's first notarizations for a new Developer account can take hours
    # (run 44904786247 passed 45 minutes on one submission); four submissions
    # wait up to 3 hours each, so the job gets the hosted runner's 6 hours.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the tested macOS builds
        uses: actions/download-artifact@v8
        with:
          pattern: tomverse-cli-macos-*
          path: unsigned
          merge-multiple: true

      - name: Import the Developer ID certificates
        env:
          APP_P12: ${{ secrets.APPLE_DEVID_APP_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/tomverse-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          umask 077
          printf '%s' "$APP_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          umask 022
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign, package and notarize
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/tomverse-cli/package.json').version")"
          app_identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -v t="($TEAM_ID)" '/Developer ID Application/ && index($0, t) { print $2; exit }')"
          installer_identity="$(security find-identity -v "$KEYCHAIN" | awk -v t="($TEAM_ID)" '/Developer ID Installer/ && index($0, t) { print $2; exit }')"
          test -n "$app_identity" || { echo "no Developer ID Application identity for team $TEAM_ID"; exit 1; }
          test -n "$installer_identity" || { echo "no Developer ID Installer identity for team $TEAM_ID"; exit 1; }
          key="$RUNNER_TEMP/notary.p8"
          private_key_header='-----BEGIN PRIVATE KEY-----'
          # Owner-only for the key file alone; the package payload below keeps normal modes.
          # The secret may hold the .p8 file base64-encoded or as its PEM text.
          (
            umask 077
            if printf '%s' "$NOTARY_KEY" | grep -q -- "$private_key_header"; then
              printf '%s\n' "$NOTARY_KEY" | tr -d '\r' > "$key"
            else
              printf '%s' "$NOTARY_KEY" | tr -d ' \r\n\t' | base64 --decode > "$key"
            fi
          )
          umask 022
          # Checked before anything is sent to Apple; says what arrived, never its content.
          if ! head -1 "$key" | grep -q -- "$private_key_header" || ! openssl pkey -in "$key" -noout 2> /dev/null; then
            echo "APPLE_NOTARY_KEY_P8_BASE64 does not decode to a .p8 private key:"
            echo "  $(wc -c < "$key" | tr -d ' ') bytes; first line is $(head -1 "$key" | grep -q -- '-----BEGIN' && echo 'a PEM header' || echo 'not a PEM header')."
            echo "  Put the content of AuthKey_<KEY ID>.p8.base64.txt (or of the .p8 file itself) in the cli-release environment secret."
            exit 1
          fi
          notarize() {
            # One submission, waited on; a failure prints Apple's log and stops. Never resubmitted here.
            # A wait that runs out leaves the outcome unknown: the id is printed so it is
            # looked up (notarytool info <id>) before anything is submitted again.
            rc=0
            out="$(xcrun notarytool submit "$1" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 3h --output-format json)" || rc=$?
            echo "$out"
            field() { printf '%s' "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[process.argv[1]]??'')}catch{console.log('')}})" "$1"; }
            status="$(field status)"
            id="$(field id)"
            if [ "$status" != "Accepted" ]; then
              if [ -z "$status" ]; then
                echo "Notarization outcome unknown (notarytool exit $rc) for submission '${id:-none}'. Look it up before submitting again."
                exit 1
              fi
              xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
              exit 1
            fi
          }
          mkdir -p signed
          for arch in arm64 x64; do
            base="tomverse-$version-macos-$arch"
            work="$RUNNER_TEMP/$base"
            mkdir -p "$work/stage" "$work/root/usr/local/bin" "$work/root/usr/local/share/doc/tomverse-cli"
            tar -xzf "unsigned/$base.tar.gz" -C "$work/stage"
            codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
              --entitlements apps/tomverse-cli/installer/macos-entitlements.plist \
              --sign "$app_identity" "$work/stage/tomverse"
            codesign --verify --strict --verbose=2 "$work/stage/tomverse"
            if [ "$arch" = arm64 ] || arch -x86_64 /usr/bin/true 2>/dev/null; then
              test "$("$work/stage/tomverse" --version)" = "$version"
            fi
            # The executable alone, for the archive (a bare binary cannot be stapled; Gatekeeper checks online).
            ditto -c -k --keepParent "$work/stage/tomverse" "$work/tomverse.zip"
            notarize "$work/tomverse.zip"
            # What every user of the Mac must be able to run and read, whatever the extraction left.
            chmod 755 "$work/stage/tomverse"
            chmod 644 "$work/stage/LICENSE" "$work/stage/README.md" "$work/stage/THIRD_PARTY_NOTICES.txt"
            tar -czf "signed/$base.tar.gz" -C "$work/stage" tomverse LICENSE README.md THIRD_PARTY_NOTICES.txt
            cp "$work/stage/tomverse" "$work/root/usr/local/bin/tomverse"
            for doc in LICENSE README.md THIRD_PARTY_NOTICES.txt; do cp "$work/stage/$doc" "$work/root/usr/local/share/doc/tomverse-cli/$doc"; done
            chmod -R u=rwX,go=rX "$work/root"
            chmod 755 "$work/root/usr/local/bin/tomverse"
            pkgbuild --root "$work/root" --identifier app.tomverse.cli --version "$version" --install-location / \
              --sign "$installer_identity" --keychain "$KEYCHAIN" --timestamp "signed/$base.pkg"
            pkgutil --expand-full "signed/$base.pkg" "$work/expanded"
            mode="$(stat -f %Lp "$work/expanded/Payload/usr/local/bin/tomverse")"
            test "$mode" = 755 || { echo "the packaged tomverse has mode $mode, not 755"; exit 1; }
            notarize "signed/$base.pkg"
            xcrun stapler staple "signed/$base.pkg"
            xcrun stapler validate "signed/$base.pkg"
            spctl --assess --type install --verbose=4 "signed/$base.pkg"
            for f in "signed/$base.pkg" "signed/$base.tar.gz"; do
              (cd signed && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256")
            done
          done
          rm -f "$key"
          ls -la signed

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

      - name: Keep the signed macOS builds
        uses: actions/upload-artifact@v7
        with:
          name: tomverse-cli-macos-signed
          path: signed/*
          if-no-files-found: error
          retention-days: 14
