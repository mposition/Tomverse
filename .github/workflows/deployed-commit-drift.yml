name: Deployed Commit Drift
#
# Asks each environment which commit it is actually serving, and compares that
# against the branch it deploys from.
#
# On 2026-08-26 three pull requests merged into `main` inside three minutes and
# none of them deployed. Railway's Wait for CI holds a deployment until the
# commit's own check suite finishes; the suites were still running, and the
# deployment that eventually succeeded was an *older* commit whose checks had
# already passed. Production served that older commit for over an hour.
#
# Nothing was broken and nothing was red. The pull requests were merged, the
# Actions list was green, and `/api/build-info` had the answer the whole time
# -- unauthenticated, one request away, and asked by nobody. That is the gap
# this closes: not the mechanism, which the release checklist §7.9.4 already
# documents, but the absence of anything that would notice.
#
# Deliberately its own scheduled workflow rather than a step in PR Fast Gate.
# A deployment lagging is not something a pull request caused and not something
# a pull request should be stopped for; it is also not true yet at the moment a
# pull request runs. Blocking merges on it would gate every change on a
# third-party platform being current, which is a single point of failure
# wearing a safety feature's clothes.
#
# Hourly, because the failure it exists for is measured in hours and a daily
# run would have reported this one the next morning. The threshold does the
# noise control instead of the schedule: a merge that has not deployed yet is
# ordinary and passes.
#
# Why the job may go red but the run may not
# ------------------------------------------
#
# This workflow is scheduled, so it runs against `main`'s head and its run
# joins that commit's check suite. The Tomverse app service is configured with
# `checkSuites: true` -- Railway's Wait for CI -- and that rule is
# all-or-nothing: a red suite marks the deployment SKIPPED. The five worker
# services have no such setting and deploy regardless.
#
# So a failing run here skipped the deployment of the very commit whose absence
# it was reporting, and then reported the same absence an hour later against
# the next commit. Once entered, the loop has no exit:
#
#   2026-09-10T21:36:37  77da3f41 merged; the app deployment is created
#   2026-09-10T21:39:18  this workflow starts against 77da3f41
#   2026-09-10T21:41:41  it fails -- production was 60+ minutes behind
#   2026-09-10T21:41:43  Railway marks that deployment SKIPPED
#                        (Provider Probe's deployment of the same commit, created
#                         in the same second, built and ran: only the app waits
#                         on the suite)
#   2026-09-11T00:11:58  it fails again, now two commits behind
#
# Production served a commit from 22:02 for the next nine hours, and each new
# merge inherited the skip.
#
# `continue-on-error` at the job level is the same instrument
# back-merge-main-to-develop.yml uses for the same collision, and for the
# reason its header records: a failing `continue-on-error` job reports check
# run conclusion `failure` while the commit's check *suite* concludes
# `success`. Railway reads the suite, a person reads the job.
#
# What is given up is the red X at the run level in the Actions list. The job
# stays red inside the run, and the report step below pages Slack through the
# same release-lane notifier -- keyed off the report step's own outcome rather
# than `job.status`, so a step added below cannot quietly change what it says.
#
# This does NOT weaken the gate. The drift is still detected, still reported
# and still fails a job; what changes is that reporting a stalled deployment no
# longer causes one.

on:
  schedule:
    # Every hour at :20, away from the top of the hour where scheduled runs
    # queue behind each other on shared runners.
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      threshold-minutes:
        description: "How long a gap may stand before the run fails"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  # Never cancel a run in progress: each one is a fresh reading, and a
  # cancelled reading is indistinguishable from an environment that could not
  # be reached -- the exact confusion this workflow exists to remove.
  group: deployed-commit-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Deployed commit vs branch head
    runs-on: ubuntu-latest
    # The run must not fail; this job still does. See the header.
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Both branches are compared, and the deployed commit may be well
          # behind either. A shallow clone answers "the deployed commit is not
          # in this checkout" -- true, and useless.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # No `npm ci`: the report reads `/api/build-info` with fetch and shells
      # out to git. Installing the dependency tree to run it would make an
      # hourly job depend on the registry being up, for nothing.
      - name: Compare each environment against its branch
        id: drift
        timeout-minutes: 5
        env:
          # Overrides for a renamed host. Absent, the script falls back to the
          # public addresses, which is what these environments actually are.
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
        run: |
          node scripts/report-deployed-commit-drift.mjs \
            --gate \
            --fetch \
            --threshold-minutes="${{ inputs.threshold-minutes || '60' }}"

      # The alert, because the run's own conclusion no longer carries it.
      #
      # Keyed off the compare step's outcome rather than `job.status` for the
      # reason back-merge-main-to-develop.yml gives: a step added below this
      # one must not be able to change what this reports. The notifier never
      # exits non-zero -- see its module header -- so a missing webhook or a
      # Slack outage cannot turn a lagging deployment into a second failure.
      #
      # `github.event.head_commit` does not exist on a `schedule` event, so the
      # commit message is empty here and the notifier prints the sha alone.
      # That is the right amount: the run URL is what anyone opens.
      - name: Report the red lane
        if: always() && steps.drift.outcome == 'failure'
        env:
          RELEASE_LANE: deployed-commit-drift
          RELEASE_LANE_CONCLUSION: failure
          RELEASE_LANE_BRANCH: ${{ github.ref_name }}
          RELEASE_LANE_WORKFLOW: ${{ github.workflow }}
          RELEASE_LANE_SHA: ${{ github.sha }}
          RELEASE_LANE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_LANE_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_LANE_ALERT_SLACK_WEBHOOK_URL }}
          OPS_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.OPS_ALERT_SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-release-lane-failure.mjs
