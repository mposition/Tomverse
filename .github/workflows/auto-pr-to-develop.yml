name: Auto PR to Develop

on:
  push:
    branches-ignore:
      - main
      - develop
      # Dependabot branches target main, never develop, so there is no auto-PR
      # to create for them. A push from Dependabot also cannot read repository
      # secrets -- GH_AUTOMATION_PAT arrives empty and every gh call exits 4 --
      # which put a red required check on each Dependabot PR for a reason that
      # was never a defect in the update.
      - dependabot/**
      # Automation-owned branch namespaces own their PR creation themselves.
      # cron-auto-fix.yml pushes autofix/** with a PAT (a PAT push DOES
      # trigger workflows) and opens its own main PR; without this exclusion
      # the same branch also got an auto develop PR -- two PRs, one branch.
      # feedback-autofix/** is the Phase 3 error-report namespace
      # (docs/policy/trace-feedback-automation.md §9): its workflow opens the
      # develop PR itself so the case can record the PR number it created.
      - autofix/**
      - feedback-autofix/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-to-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Deliberately not falling back to ${{ github.token }}: a pull request
      # opened with GITHUB_TOKEN does not trigger workflow runs, so the auto-PR
      # would sit there with no checks at all. A missing PAT has to be fixed,
      # not worked around -- this step just says so in one line instead of
      # leaving gh's "set the GH_TOKEN environment variable" hint behind.
      - name: Verify the automation token is available
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_AUTOMATION_PAT is empty for this run. Check that the secret exists and that this event can read repository secrets."
            exit 1
          fi

      # Two questions, not one: is this branch's work already on develop, and
      # if not, does it change anything?
      #
      # This used to be a single `git diff origin/develop...HEAD` after a
      # `git fetch origin develop --depth=1`, and that combination is what
      # opened PR #467 for a branch whose work was already merged -- a pull
      # request whose merge commit changed no file at all.
      #
      # `actions/checkout` above fetches the full history (`fetch-depth: 0`).
      # Fetching develop again with `--depth=1` then re-shallowed the
      # repository, cutting develop's tip off from its parents. Once develop
      # had advanced past the point this branch last merged it, `merge-base`
      # had nothing to walk, so the three-dot diff did not report "no changes"
      # -- it failed outright:
      #
      #     fatal: origin/develop...HEAD: no merge base
      #
      # and the `if` read that failure as the "there is a diff" branch. A
      # broken measurement became a positive answer.
      #
      # So: fetch develop with its history, ask the containment question
      # directly, and treat an unanswerable merge-base as an error rather than
      # as a yes.
      - name: Skip if the branch has nothing to merge into develop
        id: diff-check
        run: |
          set -uo pipefail
          git fetch origin develop
          if git merge-base --is-ancestor HEAD origin/develop; then
            echo "HEAD is already contained in develop; nothing to open a PR for."
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base origin/develop HEAD >/dev/null 2>&1; then
            echo "::error::No merge base between origin/develop and HEAD. The repository is shallow or the branch is unrelated to develop; refusing to guess whether a PR is needed."
            exit 1
          fi
          if git diff --quiet origin/develop...HEAD; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_diff=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR to develop if missing
        if: steps.diff-check.outputs.has_diff == 'true'
        run: |
          existing=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$BRANCH" \
              --base develop \
              --title "$BRANCH -> develop" \
              --body "Auto-created by the Auto PR to Develop workflow. Will merge automatically once required checks pass."
            echo "Created PR for $BRANCH -> develop"
          else
            echo "PR #$existing already open for $BRANCH -> develop"
          fi

      # A pull request that touches .github/workflows/** cannot have auto-merge
      # enabled by this token: GitHub refuses the mutation with
      #
      #   refusing to allow a Personal Access Token to create or update
      #   workflow ... without `workflow` scope (enablePullRequestAutoMerge)
      #
      # That is a deliberate restriction and the right one -- a change to the
      # gate should not be able to arrange its own merge. But failing the job
      # over it puts a red check on every workflow PR for a reason that is not
      # a defect, and a check that is red for non-defects stops being read.
      #
      # So the refusal is reported and tolerated; anything else still fails.
      # The pull request is unaffected either way -- only auto-merge is, and
      # such a PR is merged by a human on purpose.
      - name: Enable auto-merge
        if: steps.diff-check.outputs.has_diff == 'true'
        run: |
          set -uo pipefail
          pr_number=$(gh pr list --head "$BRANCH" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            exit 0
          fi
          if [ "$(gh pr view "$pr_number" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "Auto-merge not enabled: PR #$pr_number is still a draft."
            exit 0
          fi
          if output=$(gh pr merge "$pr_number" --squash --auto 2>&1); then
            echo "$output"
            exit 0
          fi
          echo "$output"
          if printf '%s' "$output" | grep -q "without \`workflow\` scope"; then
            echo "Auto-merge not enabled: this PR changes a workflow file, so it must be merged by a human."
            exit 0
          fi
          exit 1
