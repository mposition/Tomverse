# Automated repair of failed scheduled jobs.
#
# DARK BY DEFAULT, and off today. This workflow does nothing unless the
# repository variable CRON_AUTO_FIX_ENABLED is exactly "true". The schedule
# stays, so activation is one variable rather than a workflow edit, but until
# that variable is set every run stops at the first step and reports why.
#
# Activation is a decision, not a missing value. The absence of a secret must
# never stand in for it: a guard that skipped whenever AUTO_FIX_SYNC_SECRET was
# empty would make a rotated, mistyped or expired secret indistinguishable from
# "we chose not to run this", and the pipeline would go quiet at exactly the
# moment it should be loud. So the variable decides, and once it says yes a
# missing credential is a configuration error that fails the run.
#
# What this cost while it was neither on nor off: runs #1 (2026-07-22) through
# #31 (2026-08-21) failed identically, every day, six seconds in, because
# AUTO_FIX_SYNC_SECRET was never set in Actions and the poll endpoint answers
# 404 to an unauthenticated request. A month of red runs that meant "not
# configured" trains the reader to ignore the one that will mean "broken".
#
# BEFORE SETTING CRON_AUTO_FIX_ENABLED=true, settle all four. None is fixed by
# this file, and each can lose or corrupt work if it is skipped:
#
#   1. Every credential, not just the sync secret. AUTO_FIX_SYNC_SECRET (>= 32
#      chars, identical to the deployed app's env), ANTHROPIC_API_KEY and
#      GH_AUTOMATION_PAT must all exist. The preflight below checks for their
#      presence and fails when one is missing; it cannot check that they work.
#   2. The `|| true` on the LLM step. A failed `claude` invocation currently
#      leaves the tree unchanged, which the diff check reads as "no fix was
#      needed" and reports to the server as `no_action_needed`. An unattempted
#      incident would be recorded as an examined one.
#   3. Claim recovery. GET .../auto-fix/pending is not a read: it stamps
#      `autoFixAttemptedAt` on every run it returns. Anything that fails after
#      the response -- parsing, the matrix, a cancelled job -- consumes those
#      incidents permanently, because the next poll no longer sees them. A
#      lease with reclaim, or an explicit release on failure, is needed first.
#   4. The merge target. `attempt-fix` opens its PR against `main` and enables
#      auto-merge, so a machine-authored change can reach production with no
#      human in the path. That is a separate approval from switching the
#      pipeline on.

name: Cron Auto-Fix

on:
  schedule:
    # 00:15 and 01:15 UTC, shortly after Provider Model Catalog Monitor (00:00)
    # and Provider Usage Sync (00:30) run.
    #
    # Only one run per day has actually appeared, at ~01:50 UTC, for all 31
    # runs so far. The cause is not established -- GitHub delays scheduled runs
    # under load, and the two entries are an hour apart -- and it has never
    # mattered while the workflow could not authenticate. Worth re-checking
    # once real runs exist.
    - cron: "15 0,1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cron-auto-fix
  cancel-in-progress: false

env:
  TOMVERSE_APP_URL: https://tomverse.app

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.poll.outputs.runs }}
      has_runs: ${{ steps.poll.outputs.has_runs }}
    steps:
      # The job runs rather than being skipped at the `jobs:` level so that a
      # disabled day leaves a readable line in the log saying so, instead of a
      # grey square that looks the same as a workflow nobody remembers.
      - name: Resolve activation state
        id: activation
        env:
          CRON_AUTO_FIX_ENABLED: ${{ vars.CRON_AUTO_FIX_ENABLED }}
        run: |
          if [ "$CRON_AUTO_FIX_ENABLED" = "true" ]; then
            echo "Cron auto-fix is enabled."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron auto-fix is disabled: repository variable CRON_AUTO_FIX_ENABLED is '${CRON_AUTO_FIX_ENABLED:-unset}', not 'true'. Nothing to poll."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Booleans, not values: `secrets.X != ''` is evaluated by Actions, so no
      # secret material enters this step's environment merely to be counted.
      #
      # This runs before the poll on purpose. The poll claims the incidents it
      # returns, so discovering a missing ANTHROPIC_API_KEY afterwards would
      # already have burned them.
      - name: Verify required credentials are present
        if: steps.activation.outputs.enabled == 'true'
        env:
          HAS_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET != '' }}
          HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_AUTOMATION_PAT: ${{ secrets.GH_AUTOMATION_PAT != '' }}
        run: |
          missing=""
          [ "$HAS_SYNC_SECRET" = "true" ] || missing="$missing AUTO_FIX_SYNC_SECRET"
          [ "$HAS_ANTHROPIC_KEY" = "true" ] || missing="$missing ANTHROPIC_API_KEY"
          [ "$HAS_AUTOMATION_PAT" = "true" ] || missing="$missing GH_AUTOMATION_PAT"
          if [ -n "$missing" ]; then
            echo "::error::Cron auto-fix is enabled but these repository secrets are unset:${missing}. Set them, or set CRON_AUTO_FIX_ENABLED to false."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Poll for unattempted auto-fix-eligible failures
        id: poll
        if: steps.activation.outputs.enabled == 'true'
        env:
          AUTO_FIX_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET }}
        run: |
          # `curl -f` collapsed every outcome into exit 22, which is how a
          # month of "not configured" was indistinguishable from an outage.
          # The status code is read instead, and each case says what it means.
          status=$(curl -sS -o /tmp/pending.json -w '%{http_code}' \
            -H "Authorization: Bearer ${AUTO_FIX_SYNC_SECRET}" \
            "${TOMVERSE_APP_URL}/api/internal/scheduled-jobs/auto-fix/pending") || status=000
          case "$status" in
            200)
              ;;
            404)
              echo "::error::The poll endpoint answered 404. The request was not authenticated, or the route is absent from the deployed app. The endpoint answers 404 rather than 401 by design, so this one code covers a wrong secret, a secret missing from the server's env, and a missing route -- check the deployed app before assuming which."
              exit 1
              ;;
            000)
              echo "::error::The poll request did not complete: DNS, TLS or connection failure reaching ${TOMVERSE_APP_URL}."
              exit 1
              ;;
            *)
              echo "::error::The poll endpoint answered HTTP ${status}."
              exit 1
              ;;
          esac
          # A 200 is not yet an answer this workflow can use. The body decides
          # the matrix, and the incidents in it are already claimed by the time
          # it is read -- so it is validated here rather than trusted into jq
          # further down, where `.runs` on an error body would silently become
          # `null` and the run would end reporting nothing pending.
          if ! jq -e '.runs | arrays' /tmp/pending.json > /dev/null 2>&1; then
            echo "::error::The poll endpoint answered 200 without a 'runs' array. These incidents are now claimed server-side (autoFixAttemptedAt is stamped on read) and the next poll will not return them; they need releasing by hand."
            exit 1
          fi
          runs=$(jq -c '.runs' /tmp/pending.json)
          count=$(echo "$runs" | jq 'length')
          echo "Found $count pending run(s)."
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_runs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_runs=false" >> "$GITHUB_OUTPUT"
          fi

  attempt-fix:
    needs: discover
    if: needs.discover.outputs.has_runs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.discover.outputs.runs) }}
    env:
      RUN_ID: ${{ matrix.run.id }}
      JOB_KEY: ${{ matrix.run.jobKey }}
      RUN_ERROR: ${{ matrix.run.error }}
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTOMATION_PAT }}
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "tomverse-auto-fix[bot]"
          git config user.email "tomverse-auto-fix-bot@users.noreply.github.com"

      - name: Resolve allowed file scope for this job
        id: scope
        run: |
          case "$JOB_KEY" in
            provider_model_catalog_monitor)
              echo "paths=lib/providerModelCatalogMonitor.ts lib/providerModelCatalogReport.ts app/api/internal/provider-model-catalog" >> "$GITHUB_OUTPUT"
              ;;
            provider_usage_sync)
              echo "paths=lib/providerUsageSync.ts lib/providerDailyUsageReport.ts lib/infrastructureSlackReport.ts app/api/internal/provider-usage" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown or non-eligible jobKey: $JOB_KEY"
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: "2.1.220"
          CLAUDE_CODE_INTEGRITY: "sha512-ogBrvwkqF9f8okmnXKxmRNHuvtFxFEffe5pWdqOV3iQDxlUOKirFqnyWC7NGXXnDA4WkkbPH8pvSbwyCR2Auyw=="
        run: |
          package=$(npm pack --json "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" | jq -r '.[0].filename')
          actual="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          if [ "$actual" != "$CLAUDE_CODE_INTEGRITY" ]; then
            echo "Claude Code package integrity mismatch."
            exit 1
          fi
          npm install -g "./$package"
          rm -f "$package"

      - name: Write incident context
        env:
          INCIDENT_JSON: ${{ toJson(matrix.run) }}
        run: |
          printf '%s' "$INCIDENT_JSON" > /tmp/incident.txt

      - name: Run Claude Code to analyze and fix
        id: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ALLOWED_PATHS="${{ steps.scope.outputs.paths }}"
          claude -p "A scheduled job failed in the Tomverse repo. Job key: ${JOB_KEY}. Run id: ${RUN_ID}. Failure details (raw JSON) are in /tmp/incident.txt.

          Investigate the root cause and, if you can produce a safe, minimal, well-understood fix, apply it. You may ONLY edit files under these paths: ${ALLOWED_PATHS}. Do not touch any other file, do not modify dependencies, do not modify database schema or migrations. If the failure looks like a transient third-party/network issue with no code defect (e.g. the provider API was temporarily down), or you are not confident about a safe fix within this scope, make NO changes and exit without editing anything.

          After making a change (if any), briefly explain your diagnosis and fix in your final message." \
            --allowedTools "Read,Edit,Grep,Glob,Bash(npm run *)" \
            --permission-mode acceptEdits \
            --output-format json > /tmp/claude-output.json || true
          cat /tmp/claude-output.json

      - name: Check for out-of-scope changes
        id: diff-check
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "has_diff=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_diff=true" >> "$GITHUB_OUTPUT"
          ALLOWED_PATHS="${{ steps.scope.outputs.paths }}"
          for file in $changed; do
            ok=false
            for prefix in $ALLOWED_PATHS; do
              case "$file" in
                "$prefix"|"$prefix"/*) ok=true ;;
              esac
            done
            if [ "$ok" = false ]; then
              echo "out_of_scope=true" >> "$GITHUB_OUTPUT"
              echo "Out-of-scope file changed: $file"
            fi
          done

      - name: Report no action needed
        if: steps.diff-check.outputs.has_diff != 'true'
        env:
          AUTO_FIX_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET }}
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${AUTO_FIX_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"runId\":\"${RUN_ID}\",\"jobKey\":\"${JOB_KEY}\",\"outcome\":\"no_action_needed\",\"detail\":\"Claude made no changes.\"}" \
            "${TOMVERSE_APP_URL}/api/internal/scheduled-jobs/auto-fix/result"

      - name: Discard out-of-scope changes and report needs_human
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope == 'true'
        env:
          AUTO_FIX_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET }}
        run: |
          git checkout -- .
          git clean -fd
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${AUTO_FIX_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"runId\":\"${RUN_ID}\",\"jobKey\":\"${JOB_KEY}\",\"outcome\":\"needs_human\",\"detail\":\"Claude changed files outside the allowed scope; discarded.\"}" \
            "${TOMVERSE_APP_URL}/api/internal/scheduled-jobs/auto-fix/result"

      - name: Security regression checks
        id: gate-security
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: npm run security:regression

      - name: Unit and API policy tests
        id: gate-unit
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: npm run test:unit

      - name: Strict encoding validation
        id: gate-encoding
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: npm run check:encoding:strict

      - name: ESLint and production build
        id: gate-build
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: npm run check

      - name: Install Chromium
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: scripts/ci/install-playwright.sh chromium

      - name: Run desktop Chromium PR smoke tests
        id: gate-e2e
        if: steps.diff-check.outputs.has_diff == 'true' && steps.diff-check.outputs.out_of_scope != 'true'
        run: npm run test:e2e:pr

      - name: Report gate failure as needs_human
        if: >
          steps.diff-check.outputs.has_diff == 'true' &&
          steps.diff-check.outputs.out_of_scope != 'true' &&
          (failure() && (steps.gate-security.outcome == 'failure' || steps.gate-unit.outcome == 'failure' || steps.gate-encoding.outcome == 'failure' || steps.gate-build.outcome == 'failure' || steps.gate-e2e.outcome == 'failure'))
        env:
          AUTO_FIX_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET }}
        run: |
          git checkout -- .
          git clean -fd
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${AUTO_FIX_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"runId\":\"${RUN_ID}\",\"jobKey\":\"${JOB_KEY}\",\"outcome\":\"needs_human\",\"detail\":\"Claude's fix did not pass the CI gate.\"}" \
            "${TOMVERSE_APP_URL}/api/internal/scheduled-jobs/auto-fix/result"

      - name: Commit, push branch, and open PR to main
        if: >
          steps.diff-check.outputs.has_diff == 'true' &&
          steps.diff-check.outputs.out_of_scope != 'true' &&
          steps.gate-security.outcome == 'success' &&
          steps.gate-unit.outcome == 'success' &&
          steps.gate-encoding.outcome == 'success' &&
          steps.gate-build.outcome == 'success' &&
          steps.gate-e2e.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          AUTO_FIX_SYNC_SECRET: ${{ secrets.AUTO_FIX_SYNC_SECRET }}
        run: |
          gh auth setup-git
          branch="autofix/${JOB_KEY}-${RUN_ID}"
          git checkout -b "$branch"
          git add -A -- ${{ steps.scope.outputs.paths }}
          git commit -m "Auto-fix: ${JOB_KEY} failure (run ${RUN_ID})

          Automated fix generated by the cron-auto-fix pipeline after this
          scheduled job failed. All existing CI gates passed before this
          branch was pushed."
          git push origin "$branch"
          gh pr create \
            --head "$branch" \
            --base main \
            --title "Auto-fix: ${JOB_KEY} failure (run ${RUN_ID})" \
            --body "Auto-created by the Cron Auto-Fix workflow after \`${JOB_KEY}\` (run \`${RUN_ID}\`) failed. Security, unit, encoding, build, and E2E gates already passed in the automation run before this PR was opened. Will auto-merge once required checks pass."
          gh pr merge "$branch" --squash --auto
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${AUTO_FIX_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"runId\":\"${RUN_ID}\",\"jobKey\":\"${JOB_KEY}\",\"outcome\":\"fixed_and_merged\",\"detail\":\"Branch ${branch} opened as a PR to main and auto-merge enabled.\"}" \
            "${TOMVERSE_APP_URL}/api/internal/scheduled-jobs/auto-fix/result"
