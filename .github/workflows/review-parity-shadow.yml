name: Review Parity (shadow)
#
# ############################################################################
# # NOT a required check -- deliberately.                                    #
# #                                                                          #
# # This is the pre-refactor baseline for UI-01: the Tomverse Review chat    #
# # contracts that the chat-core/chat-ui extraction must not break. It runs  #
# # on every PR so its stability can be measured before it is allowed to     #
# # block anyone. Only `fast-gate` is registered in branch protection, so a  #
# # red run here is a signal, not a merge block.                             #
# #                                                                          #
# # Promotion criteria (docs/qa/review-parity-baseline.md):                  #
# #   - 20 consecutive runs green on develop-bound PRs                       #
# #   - zero flaky failures unrelated to the change under test               #
# #   - wall-clock within the PR-tier budget                                 #
# # Promotion means adding this job to branch protection, at which point the #
# # manifest check should also move into pr-fast-gate's static tier.         #
# ############################################################################
#
# The manifest check runs first and without a browser: if the baseline has
# silently shrunk, that is worth knowing even when the tests themselves pass.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-parity-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-parity:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Review parity baseline (shadow, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Same decision the fast gate's browser jobs use (scripts/pr-ui-scope.mjs),
      # so a PR that cannot change what the app renders does not pay for a
      # build it cannot affect.
      - name: Determine whether this PR can change what the app renders
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if ! changed=$(git diff --no-renames --name-only "$BASE_SHA"...HEAD); then
            echo "Could not diff against $BASE_SHA; running the baseline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Diff reported no changed paths; running the baseline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed" | node scripts/pr-ui-scope.mjs

      - name: Setup Node.js
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-v2-parity-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          # Namespaced and versioned: next-v2-parity-<lockfile>-<sources>. A restore-key
          # no narrower than Linux-next- matches every other workflow entry, and an
          # entry written in a scope every run can see then becomes one shared pool.
          # That also broke builds: a 16.3.4 cache from another workflow fails a
          # 16.3.5 Turbopack font build. v2 abandons the entries written while the
          # fallback was open. Enforced by npm run check:ci-cache-keys
          # (scripts/ci-cache-key-policy.mjs, .github/audits/actions-cache-poisoning-audit-2026-10-03.md F2).
          restore-keys: |
            ${{ runner.os }}-next-v2-parity-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      # No browser needed: catches a renamed, deleted, untagged, or untracked
      # contract, and @smoke overlap drift, before anything is built.
      - name: Verify review parity manifest
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 5
        run: npm run verify:review-parity-coverage

      - name: Production build
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 15
        run: npm run build

      - name: Restore Playwright Chromium cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-parity-${{ hashFiles('package-lock.json') }}-chromium
          # Namespaced per workflow: five workflows shared one exact
          # Linux-playwright-<lockfile>-chromium entry, so whichever wrote it first in a
          # scope every run can see owned the browser binaries the others execute -- and
          # a cache hit skips the download and verifies nothing. v2 abandons the shared
          # entries. Enforced by npm run check:ci-cache-keys
          # (.github/audits/actions-cache-poisoning-audit-2026-10-03.md F1).
          restore-keys: |
            ${{ runner.os }}-playwright-v2-parity-${{ hashFiles('package-lock.json') }}-

      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 20
        run: scripts/ci/install-playwright.sh chromium

      # Runs through scripts/run-review-parity.mjs, which also fails on a
      # runtime skip -- a contract that stays tagged and listed but never
      # executes is the same silent baseline shrink the manifest prevents.
      - name: Run the review parity baseline
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 12
        run: npm run test:e2e:review-parity

      - name: Upload failed test evidence
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: review-parity-shadow-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
