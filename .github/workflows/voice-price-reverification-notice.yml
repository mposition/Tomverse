name: Voice Price Re-verification Notice

# The token-level cache control, which a restore-only action is not: it narrows
# one declared step while the job keeps a key anything running in it can reserve
# an entry with. This workflow can run on develop or main, whose entries every
# run can restore, so its token gets none of that capability.
# .github/audits/actions-cache-poisoning-audit-2026-10-03.md P1a.
cache-mode: read
#
# Says a voice transcription price is due for re-reading, before the deadline
# does the saying by locking the merge gate.
#
# `check:voice-price-register` is a PR Fast Gate check and it fails on the
# deadline itself. Both halves are right, and together they meant the first
# signal anybody would get was every pull request turning red on the morning
# of the deadline -- a correct gate arriving as an outage. The register was no
# less true the day before; nobody had been told to act.
#
# So the notice is a separate scheduled workflow, not a step in the gate. A
# deadline approaching is not something a pull request caused and not something
# a pull request should be stopped for. It is also, on the day it matters,
# something no pull request may be running to notice: a quiet week is exactly
# when the deadline passes unannounced, and a check that only runs on pull
# requests cannot speak then.
#
# Daily rather than hourly. The thing being watched moves once a day, and the
# marks it fires at (30, 14, 7 days) are days.
#
# It can only say. It does not move a deadline, edit the register, or open an
# issue -- the register entry already names the ticket, and moving a deadline
# without re-reading the price is the one repair that repairs nothing.

on:
  schedule:
    # 07:10 UTC, which is mid-afternoon in the timezone this repository is
    # operated from -- a notice that lands while somebody is awake. Off the
    # hour, where scheduled runs queue behind each other on shared runners.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # The notice is a comment on the ticket the register entry already names.
  issues: write

concurrency:
  # Never cancel a run in progress. The notice de-duplicates by reading the
  # thread, so a cancelled run mid-read is the one way it could post twice.
  group: voice-price-reverification-notice
  cancel-in-progress: false

jobs:
  notice:
    name: Voice price re-reading deadlines
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # This step caches nothing, and saying so is not redundant: v6 defaults
          # `package-manager-cache` to true and starts caching the moment package.json
          # names a package manager. This job holds a credential, and nothing can write
          # a cache in a scope this job runs in any more, so the entry it used to look
          # for was already a certain miss: daily-security-audit run 37162314395, in the
          # same scope and while it still asked for the cache, logged "npm cache is not
          # found" and then "cache write denied: token has no writable scopes".
          # Declaring it costs nothing here and takes the job out of the analyser's
          # cache-restoring set.
          # .github/audits/actions-cache-poisoning-audit-2026-10-03.md 4.3 and P3.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Send any due notices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run notify:voice-price-reverification
