name: Credit Finance DB Integration

on:
  pull_request:
    paths:
      - "prisma/**"
      - "lib/chatSecurity.ts"
      - "lib/credit*.ts"
      - "lib/billing*.ts"
      - "lib/stripe*.ts"
      - "lib/adminUsers.ts"
      - "lib/userTimeZone.ts"
      - "app/api/billing/**"
      - "app/api/admin/**/refund/**"
      - "app/api/admin/refund*/**"
      # Deep research reserves credits in one request and settles them in a
      # later one, so its routes are covered by these scenarios too.
      - "app/api/chat/route.ts"
      - "app/api/chat/deep-research/**"
      - "lib/perplexityDeepResearch.ts"
      - "tests/integration/**"
      - "scripts/run-db-integration-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/credit-finance-db-integration.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-finance-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credit-finance-db:
    name: Credit and finance PostgreSQL scenarios
    runs-on: ubuntu-latest
    # These scenarios run against a real PostgreSQL, serially, because they
    # assert lock ordering and constraint behaviour that concurrent files would
    # make nondeterministic. That puts the suite at 17:26-18:22 across runs
    # 763-780, against a ceiling of 20: under 10% headroom, which ordinary
    # runner variance eats. Runs 775 and 776 crossed it on two unrelated
    # branches within an hour of each other, and a suite that takes 18 minutes
    # then reports "cancelled" reads as a code failure to whoever opened the
    # PR. 30 leaves room for the suite to keep growing while still failing a
    # genuine hang well inside the runner's own limit, and matches what the
    # other long jobs here already use (25 for admin E2E, 40 for e2e).
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tomverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tomverse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tomverse_test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run financial DB integration tests
        run: npm run test:db:integration
