name: Credit Finance DB Integration

on:
  pull_request:
    paths:
      - "prisma/**"
      - "lib/chatSecurity.ts"
      - "lib/credit*.ts"
      - "lib/billing*.ts"
      - "lib/stripe*.ts"
      - "lib/adminUsers.ts"
      - "lib/userTimeZone.ts"
      - "app/api/billing/**"
      - "app/api/admin/**/refund/**"
      - "app/api/admin/refund*/**"
      # Deep research reserves credits in one request and settles them in a
      # later one, so its routes are covered by these scenarios too.
      - "app/api/chat/route.ts"
      - "app/api/chat/deep-research/**"
      - "lib/perplexityDeepResearch.ts"
      - "tests/integration/**"
      - "scripts/run-db-integration-tests.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/credit-finance-db-integration.yml"
  # Both release branches, and deliberately without the path filter above.
  #
  # A pull_request run tests the merge of head and base, so it answers "would
  # this branch be green" -- not "is the branch it merged into green". Those
  # came apart on 2026-08-21: a readiness dependency landed on develop with no
  # matching test change, and because nothing ran this suite on the merge, the
  # failure sat on develop until an unrelated routing PR picked it up and
  # looked like that PR's fault. Whoever merged it had already moved on, and
  # the branch it broke is the one every other PR is measured against.
  #
  # No `paths` here on purpose. A path filter answers "did this push touch
  # something the suite covers", and the case above is the one where it does
  # not: the push that broke it changed a route, and the file that failed was a
  # test the filter would have matched only by luck. On a release branch the
  # question is whether the branch is green, which does not depend on what the
  # last push happened to touch.
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credit-finance-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credit-finance-db:
    name: Credit and finance PostgreSQL scenarios (${{ matrix.group }})
    runs-on: ubuntu-latest

    # Seven lanes, because one job stopped fitting.
    #
    # 20 minutes left no margin, so on 2026-08-15 this became 30 with a note
    # saying what would have to happen next: "past about 25 minutes the suite
    # needs splitting by scenario group, because raising this again would be
    # the second time the number was chosen to fit the runtime rather than to
    # bound it."
    #
    # By 2026-08-26 an ordinary run took 27-29 minutes against that 30:
    #
    #   develop 1439        28.6   success
    #   develop 1434        28.2   success
    #   eval-batch 1436     27.8   success
    #   eval-development    28.4   success
    #   audit-no-rotation   30.6   cancelled
    #
    # Every branch was one slow minute from a red check that said nothing about
    # the branch, and the branch that drew it was a documentation change whose
    # diff does not touch a single suite here. So the number goes back to
    # bounding a hang, and the work is divided instead.
    #
    # The lanes are named in scripts/db-integration-groups.mjs and a test
    # asserts this matrix runs all of them -- a lane defined and not listed
    # here would look exactly like a passing check.
    strategy:
      fail-fast: false
      matrix:
        group:
          - email
          - assistant
          - memory
          - import
          - routing
          - finance
          - accounts

    # Bounds a hang, not the runtime. The largest lane holds under a third of
    # the suites, and a test fails if the rules drift far enough to change
    # that.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tomverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tomverse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tomverse_test
      DB_INTEGRATION_GROUP: ${{ matrix.group }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run financial DB integration tests
        id: scenarios
        run: npm run test:db:integration

      # Only the release-branch lane is worth an alert, and the notifier
      # enforces that itself rather than trusting this condition -- a
      # pull_request run that reached here would be refused by
      # `resolveReleaseLaneAlert` on the branch name.
      #
      # This lane can be red on `develop` for hours without anyone seeing it,
      # and was on 2026-08-25: the change that broke it touched no path in the
      # `pull_request` filter above, so its own pull request never ran this
      # suite, and every run afterwards was cancelled by the next merge until
      # one finally survived. Four merges passed over it in between.
      #
      # Cancellation is deliberately not alerted on -- a superseded run answers
      # nothing about the branch, and the newer run answers for both -- but it
      # does delay this message, which is the cost of `cancel-in-progress` and
      # is cheaper than queueing thirty-minute runs behind every merge.
      #
      # The commit message is passed through `env:` rather than interpolated
      # into a `run:` line, so its contents are a string to the script and
      # never shell.
      - name: Report the red lane
        if: always() && steps.scenarios.outcome == 'failure'
        env:
          # The lane, not the shard. `LANE_KEYS` names kinds of lane and
          # the consequence text is the same whichever group went red; the
          # run URL already points at the failing job.
          RELEASE_LANE: db-integration
          RELEASE_LANE_CONCLUSION: failure
          RELEASE_LANE_BRANCH: ${{ github.ref_name }}
          RELEASE_LANE_WORKFLOW: ${{ github.workflow }}
          RELEASE_LANE_SHA: ${{ github.sha }}
          RELEASE_LANE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_LANE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_LANE_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.RELEASE_LANE_ALERT_SLACK_WEBHOOK_URL }}
          OPS_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.OPS_ALERT_SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-release-lane-failure.mjs

  # The name branch protection knows.
  #
  # Splitting one job into a matrix renames its check: "Credit and finance
  # PostgreSQL scenarios" becomes seven checks with the group in brackets. A
  # required check that no longer reports is not a failure an operator can see
  # -- it is a pull request that waits forever for something nobody is going to
  # run, which is worse than a red one.
  #
  # So the original name stays, now as the conjunction of the lanes. `needs`
  # gives it the dependency and `always()` makes it run even when a lane failed,
  # because a skipped aggregate would leave the same silent gap it exists to
  # close.
  credit-finance-db-result:
    name: Credit and finance PostgreSQL scenarios
    runs-on: ubuntu-latest
    needs: credit-finance-db
    if: always()
    steps:
      - name: Require every lane to have passed
        env:
          RESULT: ${{ needs.credit-finance-db.result }}
        run: |
          echo "Matrix result: $RESULT"
          # `success` is the only pass. `skipped` included: the matrix is not
          # conditional, so a skip means something stopped it from running and
          # that is not the same as the suite agreeing.
          test "$RESULT" = "success"
