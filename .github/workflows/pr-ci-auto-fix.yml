# CI auto-fix for every pull request: the publish half.
#
# The model runs on the AMUX server, not here. tools/review-orchestrator/bin/
# pr-ci-auto-fix.mjs polls for an open pull request of this repository, any
# base and any branch, drafts too (owner 2026-11-03: "fix CI with no
# exception"), whose CI failed, asks
# the Claude Code CLI signed in to the server's subscription for the smallest
# fix, and leaves the patch in an outbox; bin/pr-ci-auto-fix-sender.mjs, under
# its own account with the only token that can dispatch, dispatches this
# workflow with it. Owner decision 2026-10-23: subscription CLI on the AMUX
# server instead of a per-token API key.
#
# Owner approval 2026-10-20 (AGENTS.md approval list: a new autonomous
# permission). Off unless the repository variable PR_AUTO_FIX_ENABLED is
# exactly "true". workflow_dispatch runs from the default branch.
#
# Conflicts with the base (owner 2026-10-27, kind "conflict"): the server
# merges the pull request's base into the branch, the model resolves the
# markers, and the resolution -- the lines that replace each conflict (a
# lockfile does not fit whole), or a file's contents -- comes here with the
# base commit it was made against. Off unless PR_AUTO_FIX_CONFLICTS_ENABLED is
# exactly "true" as well.
#
# Every input is untrusted: whoever can dispatch can send any patch. So:
# - target: a trusted checkout of the default branch re-decides everything
#   from GitHub's own records -- the pull request is open at exactly head_sha,
#   its branch is in this repository and is not one that deploys (main,
#   develop, test: a push there would be an unapproved merge), both branch
#   names are plain refs, and each named run is a failed
#   pull_request run on that same commit and the newest run of its workflow
#   there; a conflict is one GitHub shows, and base_sha is on the pull
#   request's base branch.
# - publish: a fresh runner with a trusted checkout runs
#   scripts/pr-ci-auto-fix-guard.mjs against the patch applied to a clean
#   checkout of the pull request (any file, workflows included -- owner
#   2026-11-03; no binary), or, for
#   a conflict, merges base_sha itself and judges the resolution (exactly the
#   conflicted files, regular files on both sides and written through no
#   link, everything git merged outside the conflicts kept in order, no marker
#   left), and only then pushes with GH_AUTOMATION_PAT, leased to the commit judged. It
#   installs and runs nothing from the pull request.

name: PR CI Auto-Fix

cache-mode: read

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: The head commit CI failed on, or that conflicts
        required: true
        type: string
      run_ids:
        description: Comma-separated failed workflow run ids on that commit (none for a conflict)
        required: false
        type: string
        default: ""
      patch_gz_b64:
        description: The proposed change, git diff --binary (a conflict's resolution as JSON), gzip then base64
        required: true
        type: string
      kind:
        description: ci (a failed CI) or conflict (a conflict with the base branch)
        required: false
        type: string
        default: ci
      base_sha:
        description: For a conflict, the base branch commit the resolution merges
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-ci-auto-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr_number }}
  HEAD_SHA: ${{ inputs.head_sha }}
  RUN_IDS: ${{ inputs.run_ids }}
  KIND: ${{ inputs.kind || 'ci' }}
  BASE_SHA: ${{ inputs.base_sha }}

jobs:
  target:
    if: vars.PR_AUTO_FIX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      served: ${{ steps.decide.outputs.served }}
      head_branch: ${{ steps.decide.outputs.head_branch }}
      base_branch: ${{ steps.decide.outputs.base_branch }}
      workflows: ${{ steps.decide.outputs.workflows }}
    steps:
      - name: Trusted checkout of the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Decide whether the pull request and the runs are served
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS_ENABLED: ${{ vars.PR_AUTO_FIX_CONFLICTS_ENABLED }}
        run: |
          refuse() { echo "$1"; echo "served=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$PR_NUMBER" =~ ^[0-9]{1,7}$ ]] || refuse "pr_number is not a number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse "head_sha is not a commit id."
          if [ "$KIND" = conflict ]; then
            [ "$CONFLICTS_ENABLED" = true ] || refuse "Conflict resolution is off (PR_AUTO_FIX_CONFLICTS_ENABLED)."
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse "base_sha is not a commit id."
            [ -z "$RUN_IDS" ] || refuse "A conflict resolution names no runs."
          elif [ "$KIND" = ci ]; then
            [ -z "$BASE_SHA" ] || refuse "A CI fix names no base commit."
            [[ "$RUN_IDS" =~ ^[0-9]{1,15}(,[0-9]{1,15}){0,7}$ ]] || refuse "run_ids is not a list of run ids."
          else
            refuse "kind is neither ci nor conflict."
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          [ "$(jq -r .state /tmp/pr.json)" = open ] || refuse "The pull request is not open."
          [ "$(jq -r .head.sha /tmp/pr.json)" = "$HEAD_SHA" ] || refuse "The branch moved on after the commit judged; its own CI decides."
          workflows=""
          if [ "$KIND" = conflict ]; then
            # A conflict GitHub shows (null: still computing, so not shown), and
            # a commit of the pull request's base branch, not one from anywhere else.
            [ "$(jq -r .mergeable /tmp/pr.json)" = false ] || refuse "GitHub does not show the pull request conflicting."
            base_ref=$(jq -r .base.ref /tmp/pr.json)
            # A plain ref name before it reaches a URL (the guard below checks both names again).
            [[ "$base_ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || refuse "The base branch name is not a plain ref."
            relation=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${base_ref}" --jq .status) || refuse "base_sha cannot be compared with ${base_ref}."
            [ "$relation" = identical ] || [ "$relation" = ahead ] || refuse "base_sha is not on ${base_ref}."
          else
            # Every pull_request run on this commit: a named run must be the newest
            # of its workflow here, or a later green run (reopen, ready for
            # review) would still let an old failure publish onto a green head.
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" > /tmp/head-runs.json
            for id in ${RUN_IDS//,/ }; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" > /tmp/run.json
              ok=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
                .head_sha == $sha and .conclusion == "failure" and .event == "pull_request"
                and .head_repository.full_name == $repo' /tmp/run.json)
              [ "$ok" = true ] || refuse "Run ${id} is not a failed pull_request run on ${HEAD_SHA}."
              newest=$(jq -r --argjson wf "$(jq .workflow_id /tmp/run.json)" \
                '[.[].workflow_runs[] | select(.workflow_id == $wf)] | max_by(.id) | .id // empty' /tmp/head-runs.json)
              [ "$newest" = "$id" ] || refuse "Run ${id} is not the newest run of its workflow on ${HEAD_SHA}."
              # Any workflow is served now, so its name is the repository's text: kept to
              # plain characters, it can carry no newline into GITHUB_OUTPUT.
              workflows="${workflows:+${workflows}, }$(jq -r '.name | gsub("[^A-Za-z0-9 ._()/-]"; "")' /tmp/run.json)"
            done
          fi
          node --experimental-strip-types scripts/pr-ci-auto-fix-guard.mjs target /tmp/pr.json || refuse "The pull request is not served."
          {
            echo "served=true"
            echo "head_branch=$(jq -r .head.ref /tmp/pr.json)"
            echo "base_branch=$(jq -r .base.ref /tmp/pr.json)"
            echo "workflows=${workflows}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: target
    if: needs.target.outputs.served == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trusted checkout of the default branch (the guard)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: trusted
          persist-credentials: false

      - name: Clean checkout of the commit judged
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          persist-credentials: false
          # A conflict merges the base here: the whole history, so base_sha is present.
          fetch-depth: ${{ inputs.kind == 'conflict' && '0' || '1' }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply and judge the patch
        id: judge
        if: inputs.kind != 'conflict'
        env:
          PATCH_GZ_B64: ${{ inputs.patch_gz_b64 }}
        run: |
          mkdir -p patch
          # A bounded read: a dispatch carries at most 60 KB of gzip, far below this.
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gunzip | head -c 4000000 > patch/fix.patch
          if [ ! -s patch/fix.patch ]; then echo "The patch is empty."; echo "push=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -C pr apply --binary --index "$GITHUB_WORKSPACE/patch/fix.patch"
          if node --experimental-strip-types trusted/scripts/pr-ci-auto-fix-guard.mjs diff pr; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            git -C pr diff --cached --stat HEAD >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Merge the base and judge the resolution
        id: resolve
        if: inputs.kind == 'conflict'
        env:
          PATCH_GZ_B64: ${{ inputs.patch_gz_b64 }}
        run: |
          mkdir -p patch
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gunzip | head -c 8000000 > patch/resolution.json
          # The merge is made here, from base_sha, never taken from the dispatch.
          git -C pr -c user.name=pr-auto-fix -c user.email=pr-auto-fix@users.noreply.github.com merge --no-commit --no-ff "$BASE_SHA" > /dev/null 2>&1 || true
          if [ -z "$(git -C pr diff --name-only --diff-filter=U)" ]; then
            echo "Merging ${BASE_SHA} leaves no conflict to resolve."
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if node --experimental-strip-types trusted/scripts/pr-ci-auto-fix-guard.mjs conflict pr "$GITHUB_WORKSPACE/patch/resolution.json"; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            git -C pr diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Commit and push to the pull request branch
        if: steps.judge.outputs.push == 'true' || steps.resolve.outputs.push == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          HEAD_BRANCH: ${{ needs.target.outputs.head_branch }}
          BASE_BRANCH: ${{ needs.target.outputs.base_branch }}
          WORKFLOWS: ${{ needs.target.outputs.workflows }}
        run: |
          # The target job judged these names; the push checks them again itself.
          plain='^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}
          git config user.email "pr-auto-fix@users.noreply.github.com"
          if [ "$KIND" = conflict ]; then
            [ -z "$(git diff --name-only --diff-filter=U)" ] || { echo "Conflicts are left."; exit 1; }
            git commit -q -m "auto-fix(conflict): merge ${BASE_BRANCH} into #${PR_NUMBER}" -m "${BASE_BRANCH} at ${BASE_SHA}. Resolved by Claude Code on the AMUX server; judged and published by .github/workflows/pr-ci-auto-fix.yml."
          else
            git add --all
            git commit -q -m "auto-fix(ci): ${WORKFLOWS} failure on #${PR_NUMBER}" -m "Runs ${RUN_IDS}. Proposed by Claude Code on the AMUX server; published by .github/workflows/pr-ci-auto-fix.yml."
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_BRANCH}" --force-with-lease="refs/heads/${HEAD_BRANCH}:${HEAD_SHA}"
          echo "Pushed one ${KIND} auto-fix commit to ${HEAD_BRANCH}." >> "$GITHUB_STEP_SUMMARY"

          [[ "$HEAD_BRANCH" =~ $plain && "$BASE_BRANCH" =~ $plain ]] || { echo "A branch name is not a plain ref."; exit 1; }
          case "$HEAD_BRANCH" in main|develop|test) echo "$HEAD_BRANCH deploys; nothing is pushed to it."; exit 1 ;; esac
          git config user.name "tomverse-pr-auto-fix"
          git config user.email "pr-auto-fix@users.noreply.github.com"
          if [ "$KIND" = conflict ]; then
            [ -z "$(git diff --name-only --diff-filter=U)" ] || { echo "Conflicts are left."; exit 1; }
            git commit -q -m "auto-fix(conflict): merge ${BASE_BRANCH} into #${PR_NUMBER}" -m "${BASE_BRANCH} at ${BASE_SHA}. Resolved by Claude Code on the AMUX server; judged and published by .github/workflows/pr-ci-auto-fix.yml."
          else
            git add --all
            git commit -q -m "auto-fix(ci): ${WORKFLOWS} failure on #${PR_NUMBER}" -m "Runs ${RUN_IDS}. Proposed by Claude Code on the AMUX server; published by .github/workflows/pr-ci-auto-fix.yml."
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_BRANCH}" --force-with-lease="refs/heads/${HEAD_BRANCH}:${HEAD_SHA}"
          echo "Pushed one ${KIND} auto-fix commit to ${HEAD_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
