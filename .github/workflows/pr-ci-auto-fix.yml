# CI auto-fix for develop pull requests from agent sessions: the publish half.
#
# The model runs on the AMUX server, not here. tools/review-orchestrator/bin/
# pr-ci-auto-fix.mjs polls for a ready develop pull request from
# claude/to-develop/** or codex/to-develop/** whose required CI failed, asks
# the Claude Code CLI signed in to the server's subscription for the smallest
# fix, and leaves the patch in an outbox; bin/pr-ci-auto-fix-sender.mjs, under
# its own account with the only token that can dispatch, dispatches this
# workflow with it. Owner decision 2026-10-23: subscription CLI on the AMUX
# server instead of a per-token API key.
#
# Owner approval 2026-10-20 (AGENTS.md approval list: a new autonomous
# permission). Off unless the repository variable PR_AUTO_FIX_ENABLED is
# exactly "true". workflow_dispatch runs from the default branch.
#
# Every input is untrusted: whoever can dispatch can send any patch. So:
# - target: a trusted checkout of the default branch re-decides everything
#   from GitHub's own records -- the pull request is open at exactly head_sha
#   and served (same repository, develop base, not draft, agent branch, every
#   commit read, fewer than two auto-fix commits), and each named run is a
#   failed pull_request run of a required workflow on that same commit.
# - publish: a fresh runner with a trusted checkout runs
#   scripts/pr-ci-auto-fix-guard.mjs against the patch applied to a clean
#   checkout of the pull request (no gate path -- the merge lane's own list --,
#   no test file, no deletion, no binary, at most 400 changed lines) and only
#   then pushes with GH_AUTOMATION_PAT, leased to the commit CI ran on. It
#   installs and runs nothing from the pull request.

name: PR CI Auto-Fix

cache-mode: read

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: The head commit CI failed on
        required: true
        type: string
      run_ids:
        description: Comma-separated failed workflow run ids on that commit
        required: true
        type: string
      patch_gz_b64:
        description: The proposed change, git diff --binary, gzip then base64
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-ci-auto-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.pr_number }}
  HEAD_SHA: ${{ inputs.head_sha }}
  RUN_IDS: ${{ inputs.run_ids }}

jobs:
  target:
    if: vars.PR_AUTO_FIX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      served: ${{ steps.decide.outputs.served }}
      head_branch: ${{ steps.decide.outputs.head_branch }}
      workflows: ${{ steps.decide.outputs.workflows }}
    steps:
      - name: Trusted checkout of the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Decide whether the pull request and the runs are served
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() { echo "$1"; echo "served=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$PR_NUMBER" =~ ^[0-9]{1,7}$ ]] || refuse "pr_number is not a number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse "head_sha is not a commit id."
          [[ "$RUN_IDS" =~ ^[0-9]{1,15}(,[0-9]{1,15}){0,7}$ ]] || refuse "run_ids is not a list of run ids."
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/pr.json
          [ "$(jq -r .state /tmp/pr.json)" = open ] || refuse "The pull request is not open."
          [ "$(jq -r .head.sha /tmp/pr.json)" = "$HEAD_SHA" ] || refuse "The branch moved on after the failed run; its own CI decides."
          workflows=""
          for id in ${RUN_IDS//,/ }; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" > /tmp/run.json
            ok=$(jq -r --arg sha "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .conclusion == "failure" and .event == "pull_request"
              and .head_repository.full_name == $repo
              and (.name | IN("PR Fast Gate", "Admin Console E2E", "Credit Finance DB Integration", "Orchestrator Rust"))' /tmp/run.json)
            [ "$ok" = true ] || refuse "Run ${id} is not a failed required pull_request run on ${HEAD_SHA}."
            workflows="${workflows:+${workflows}, }$(jq -r .name /tmp/run.json)"
          done
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" > /tmp/commits.json
          node --experimental-strip-types scripts/pr-ci-auto-fix-guard.mjs target /tmp/pr.json /tmp/commits.json || refuse "The pull request is not served."
          {
            echo "served=true"
            echo "head_branch=$(jq -r .head.ref /tmp/pr.json)"
            echo "workflows=${workflows}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: target
    if: needs.target.outputs.served == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trusted checkout of the default branch (the guard)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: trusted
          persist-credentials: false

      - name: Clean checkout of the commit CI failed on
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Apply and judge the patch
        id: judge
        env:
          PATCH_GZ_B64: ${{ inputs.patch_gz_b64 }}
        run: |
          mkdir -p patch
          # A bounded read: the guard's 400-line cap is far below this.
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gunzip | head -c 4000000 > patch/fix.patch
          if [ ! -s patch/fix.patch ]; then echo "The patch is empty."; echo "push=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -C pr apply --binary --index "$GITHUB_WORKSPACE/patch/fix.patch"
          if node --experimental-strip-types trusted/scripts/pr-ci-auto-fix-guard.mjs diff pr; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            git -C pr diff --cached --stat HEAD >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Commit and push to the pull request branch
        if: steps.judge.outputs.push == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          HEAD_BRANCH: ${{ needs.target.outputs.head_branch }}
          WORKFLOWS: ${{ needs.target.outputs.workflows }}
        run: |
          git config user.name "tomverse-pr-auto-fix"
          git config user.email "pr-auto-fix@users.noreply.github.com"
          git add --all
          git commit -q -m "auto-fix(ci): ${WORKFLOWS} failure on #${PR_NUMBER}" -m "Runs ${RUN_IDS}. Proposed by Claude Code on the AMUX server; published by .github/workflows/pr-ci-auto-fix.yml."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${HEAD_BRANCH}" --force-with-lease="refs/heads/${HEAD_BRANCH}:${HEAD_SHA}"
          echo "Pushed one auto-fix commit to ${HEAD_BRANCH}." >> "$GITHUB_STEP_SUMMARY"
