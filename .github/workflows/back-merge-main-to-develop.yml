name: Back-merge main into develop
#
# Releases reach `main` as squash commits, which leaves `main` outside
# `develop`'s ancestry: the trees agree, but git holds no commit connecting
# them. A later edit on `develop` to code `main` already carries then has no
# common base for that work and conflicts. #200 cost eighteen conflicted files
# for this reason, and #209 opened the same gap again the same day.
#
# The recovery is a back-merge, and doing it by hand did not hold: of the three
# opened on 2026-08-01, two (#203, #213) were squashed on the way in, which
# discards the second parent and leaves the merge having done nothing at all.
# A recovery step that is easy to nullify is a weak place to keep the
# guarantee, so this workflow performs it instead of asking someone to.
#
# The real fix would be to forbid squashing the release pull request, but
# GitHub's merge-method setting is repository-wide and cannot be scoped to one
# target branch, and squash is wanted for feature pull requests into `develop`.
# So this workflow makes the release's merge method stop mattering.
#
# Two jobs:
#
#   back-merge  performs it. The two ways it can fail are handled differently
#               and deliberately so:
#
#                 * the merge CONFLICTS -- it aborts and fails the job. No
#                   branch is pushed and no pull request is opened, because
#                   choosing a side is a judgement call and a pull request
#                   full of somebody's guess is worse than none. A person
#                   starts from `origin/develop`, merges `origin/main`,
#                   resolves, and merges the result with a merge commit.
#                 * the merge SUCCEEDS but the push to `develop` is REFUSED
#                   (branch protection, typically) -- there is nothing to
#                   judge, so it opens `automation/back-merge-main-<sha>` as
#                   a pull request carrying the merge commit it already made.
#
#   verify      asserts the invariant afterwards -- `main` reachable from
#               `develop` -- and reports loudly when it is not, which is the
#               signal that a human has to finish the job. It reports on both
#               paths above, so neither is silent.
#
# The invariant, and the one command that decides it:
#
#   git merge-base --is-ancestor origin/main origin/develop   # must exit 0
#
# Why this workflow never fails its run
# -------------------------------------
#
# Railway's production service runs with Wait for CI on, and Railway's rule is
# all-or-nothing: "if any workflow fails, the deployments will be SKIPPED"
# (docs.railway.com/deployments/github-autodeploys#wait-for-ci). It cannot be
# told which workflows are the release verdict, and GitHub cannot mark a
# workflow as outside a deploy gate. So while this workflow failed on a
# conflict, every conflict here also cancelled the production deployment of a
# release that had nothing to do with it. On 2026-08-25 that took out #953,
# #954, #960, #968 and #969: the deployment was skipped 1-2 seconds after this
# workflow reported failure, before the release suite had even finished.
#
# A develop-side conflict says nothing about whether `main` is deployable, so
# it must not be able to answer that question. Both jobs therefore exit 0 and
# the alarm moves to channels the gate does not read:
#
#   * a tracking issue, opened when the invariant breaks, kept current while it
#     stays broken, and closed when it is restored. More durable than a red X,
#     which scrolls out of the Actions list within a day.
#   * `::error::` annotations and a job summary on the run itself, which render
#     in red regardless of the run's conclusion.
#
# What this costs is the red X in the Actions list, and that is the trade being
# made deliberately. What it must never become is silence -- if the issue
# cannot be opened, that failure is itself annotated.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two back-merges at once: they would race on the same develop ref.
  group: back-merge-main-to-develop
  cancel-in-progress: false

jobs:
  back-merge:
    name: Back-merge main into develop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}

    steps:
      # Full history: ancestry questions cannot be answered from a shallow
      # clone, and the merge needs both branches whole.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTOMATION_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check whether a back-merge is needed
        id: needed
        run: |
          set -uo pipefail
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "main is already an ancestor of develop; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main ($(git rev-parse --short origin/main)) is not an ancestor of develop ($(git rev-parse --short origin/develop))."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Merged, not resolved. A conflict here means main and develop both
      # changed the same lines, and choosing a side is a judgement call --
      # the eslint.config.mjs conflict in #217 was develop adding an ignore
      # entry main lacked, which a machine cannot know to keep. So a conflict
      # stops and becomes a pull request rather than a guess.
      - name: Merge main into develop
        id: merge
        if: steps.needed.outputs.needed == 'true'
        run: |
          set -uo pipefail
          git checkout -B develop origin/develop
          if git merge --no-ff origin/main \
            -m "Merge main into develop to restore the shared ancestry" \
            -m "Automated back-merge. main reached this state as a squash commit, so develop and main share no commit for the released work even where they share its content. This merge records the ancestry that the squash could not, which is what keeps the next change to already-released code from conflicting." \
            -m "See .github/workflows/back-merge-main-to-develop.yml."; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The back-merge conflicted. The job will fail without opening a pull request; a person has to resolve it."
            git merge --abort || true
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
          fi

      # Reported for the log, and worth reading: a back-merge after a squashed
      # release normally changes nothing, because the content is already on
      # develop. A non-empty diff means main carries work develop never had --
      # a hotfix landed straight on main, say -- which is exactly what a
      # back-merge is also for, but worth seeing rather than assuming.
      - name: Report what the merge changed
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          if git diff --quiet origin/develop HEAD; then
            echo "The merge changes no file: the tree is identical to origin/develop."
          else
            echo "The merge brings content develop did not have:"
            git diff --stat origin/develop HEAD
          fi

      - name: Push to develop
        id: push
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          set -uo pipefail
          if git push origin develop; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pushing to develop was refused -- most likely branch protection. Opening a pull request instead."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # This step reaches two different outcomes, and the difference is the
      # whole contract:
      #
      #   push refused  -- the merge already succeeded, so replaying it here
      #                    succeeds too. The branch is pushed and a pull
      #                    request opened. Merging that pull request WITH A
      #                    MERGE COMMIT restores the ancestry; squashing it
      #                    discards the second parent and achieves nothing,
      #                    which is what happened to #203 and #213.
      #   conflicted    -- replaying it conflicts again, so this aborts and
      #                    stops. NO branch is pushed and NO pull request is
      #                    opened: a pull request whose content a machine
      #                    guessed is worse than the absence of one. The step
      #                    annotates the conflict, `verify` opens the tracking
      #                    issue after it, and a person picks it up from
      #                    `origin/develop`.
      #
      # The conflict path exits 0 on purpose -- see "Why this workflow never
      # fails its run" at the top. It is `verify` that decides whether the
      # invariant holds, and it decides it from git rather than from this
      # job's exit code, so nothing is lost by leaving the run green.
      - name: Open a pull request when the push was refused, or report a conflict
        if: |
          steps.needed.outputs.needed == 'true' &&
          (steps.merge.outputs.conflicted == 'true' || steps.push.outputs.pushed == 'false')
        run: |
          set -uo pipefail
          branch="automation/back-merge-main-$(git rev-parse --short origin/main)"
          git checkout -B "$branch" origin/develop
          git merge --no-ff origin/main -m "Merge main into develop to restore the shared ancestry" || true
          if [ -n "$(git ls-files --unmerged)" ]; then
            # Leave the conflict markers out of the branch; a human resolves it
            # from this base. The branch is still the right starting point.
            git merge --abort || true
            echo "::error::The back-merge conflicts and needs a human. Start from origin/develop, merge origin/main, resolve, and merge the pull request WITH A MERGE COMMIT."
            exit 0
          fi
          git push -u origin "$branch"
          existing=$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$branch" \
              --base develop \
              --title "Merge main into develop to restore the shared ancestry" \
              --body-file .github/workflows/back-merge-pr-body.md
          fi

  # Method 3: the guard. The back-merge above is the fix; this is what makes a
  # failed fix visible instead of silent. It runs even when the back-merge job
  # failed, because that is precisely when the invariant needs reporting.
  #
  # It reads git, not the job above: an exit code says what a script did, and
  # the invariant is a fact about two refs. That is also what lets the whole
  # workflow stay green without losing anything -- the verdict never came from
  # the exit code in the first place.
  verify:
    name: main is in develop's ancestry
    runs-on: ubuntu-latest
    needs: back-merge
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One issue, matched by exact title rather than by search. GitHub's search
      # index lags a fresh issue by up to minutes, and two releases can land
      # inside that window -- `gh issue list` reads the API directly, so it
      # cannot open a second issue for a break it already reported.
      GUARD_ISSUE_TITLE: "Back-merge main into develop is blocked"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assert the invariant
        id: invariant
        run: |
          set -uo pipefail
          git fetch origin main develop
          main_sha=$(git rev-parse --short origin/main)
          develop_sha=$(git rev-parse --short origin/develop)
          {
            echo "main_sha=$main_sha"
            echo "develop_sha=$develop_sha"
          } >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "main ($main_sha) is an ancestor of develop ($develop_sha)."
            echo "holds=true" >> "$GITHUB_OUTPUT"
            echo "main (\`$main_sha\`) is an ancestor of develop (\`$develop_sha\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::main ($main_sha) is NOT an ancestor of develop ($develop_sha). The back-merge did not land -- check the job above for a conflict, a refused push, or a pull request waiting to be merged with a merge commit. Until this is fixed, the next change to already-released code will conflict."
          echo "holds=false" >> "$GITHUB_OUTPUT"
          {
            echo "### The back-merge did not land"
            echo
            echo "main (\`$main_sha\`) is **not** an ancestor of develop (\`$develop_sha\`)."
            echo "Until this is fixed, the next change to already-released code will conflict."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # The alarm. Not a red X, because a red X here cancels the production
      # deployment of whatever release happened to be waiting -- see the top of
      # this file. An issue outlives the run, and the backlog report already
      # reads open issues.
      - name: Open or refresh the tracking issue
        if: steps.invariant.outputs.holds == 'false'
        run: |
          set -uo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(cat <<EOF
          \`main\` (\`${{ steps.invariant.outputs.main_sha }}\`) is not an ancestor of
          \`develop\` (\`${{ steps.invariant.outputs.develop_sha }}\`), so the automated
          back-merge did not land. Until it does, the next change to code \`main\`
          already carries has no common base and will conflict.

          The check that decides this:

          \`\`\`
          git merge-base --is-ancestor origin/main origin/develop
          \`\`\`

          To fix it, start from \`origin/develop\`, merge \`origin/main\`, resolve, and
          merge the pull request **with a merge commit** -- squashing it discards the
          second parent and restores nothing.

          Last checked by $run_url

          This issue is opened, refreshed and closed by
          \`.github/workflows/back-merge-main-to-develop.yml\`. It closes itself once
          the invariant holds again.
          EOF
          )
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$GUARD_ISSUE_TITLE" '[.[] | select(.title == $t)] | .[0].number // empty') || number=""
          if [ -n "$number" ]; then
            gh issue edit "$number" --body "$body" \
              || echo "::error::Could not refresh tracking issue #$number. The back-merge is still blocked -- see this run."
          else
            gh issue create --title "$GUARD_ISSUE_TITLE" --body "$body" \
              || echo "::error::Could not open a tracking issue. The back-merge is blocked and nothing else is recording it -- see this run."
          fi
          exit 0

      - name: Close the tracking issue once the ancestry is restored
        if: steps.invariant.outputs.holds == 'true'
        run: |
          set -uo pipefail
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$GUARD_ISSUE_TITLE" '[.[] | select(.title == $t)] | .[0].number // empty') || number=""
          if [ -n "$number" ]; then
            gh issue close "$number" \
              --comment "main (\`${{ steps.invariant.outputs.main_sha }}\`) is an ancestor of develop (\`${{ steps.invariant.outputs.develop_sha }}\`) again. Closed by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID." \
              || echo "::warning::The ancestry is restored but tracking issue #$number could not be closed."
          fi
          exit 0
