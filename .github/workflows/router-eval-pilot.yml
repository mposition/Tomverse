name: Router eval — ROUTE-01 pilot and judge calibration
#
# Two measurements in one dispatch, because the second needs the first's
# answers and nothing else:
#
#   * §3's sizing run, measuring the discordance rate so the decision set's
#     `n` is computed rather than guessed;
#   * §5's judge calibration, re-grading those same answers with the
#     pre-registered independent judge and reporting how far the two judges
#     are apart, with a pair-level bootstrap interval.
#
# One job rather than two, so the answer bundle stays on disk between them. A
# calibration compares two passes over the SAME answers; round-tripping the
# bundle through an artifact would add a way for them to stop being the same.
#
# ############################################################################
# # THIS WORKFLOW SPENDS MONEY. Three provider calls per item, 210 items.    #
# # Manual dispatch only, with a typed confirmation, and never on push.      #
# ############################################################################
#
# Why here rather than a shell on a deployed container. The same three reasons
# `.github/workflows/memory-eval-development-probe.yml` gives, and they bite
# harder here because this run is long:
#
#   * the checkout is clean by construction and carries a git directory, so
#     the artifact's commitSha names a real commit. scripts/eval-router-quality.mjs
#     reads it with `git rev-parse HEAD` and records null when that fails --
#     which is what a Railway container does, because it has no git;
#   * the keys are repository secrets rather than a container's environment,
#     so adding one does not mean waiting for a container to be replaced;
#   * the artifact is preserved by the platform. A console session that
#     refreshes takes the run and the file with it, and 630 calls is long
#     enough for that to happen.
#
# **This run produces no ROUTE-01 evidence.** The set is `development`, so
# `--mode=decision` refuses it outright. What it produces is the discordance
# rate §3 needs, and the judge's self-preference is a known confound recorded
# in the set: the pre-registered judge is also the baseline.

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Names the artifact — e.g. 20260826"
        required: true
        default: ""
      max_cost_pilot_usd:
        description: "Ceiling for the pilot stage. Approved: 2.00"
        required: true
        default: "2.00"
      max_cost_rejudge_usd:
        description: "Ceiling for the independent judge. Approved: 18.00"
        required: true
        default: "18.00"
      confirm:
        description: "Type SPEND to confirm this dispatch will call a paid provider"
        required: true
        default: ""

# Deliberately not inputs: the baseline, the two judges and the seed. They are
# pre-registered in the set file and scripts/eval-router-quality.mjs refuses a
# run that disagrees with them. Offering them here would put the choice back
# on whoever dispatches, which is the drift that pre-registration exists to
# stop.

permissions:
  contents: read

concurrency:
  group: router-eval-pilot
  cancel-in-progress: false

jobs:
  run:
    name: ROUTE-01 pilot and calibration
    runs-on: ubuntu-latest
    # Measured, not guessed. The first pilot ran 89.5 minutes against a
    # 90-minute limit and was killed before it finished 210 items -- roughly
    # 8 seconds per provider call, three calls per item. The rejudge adds one
    # call per pair. 300 leaves room for both and for a slower day, without
    # leaving a runaway to burn a whole runner slot.
    timeout-minutes: 300
    steps:
      - name: Confirm the spend
        if: inputs.confirm != 'SPEND'
        run: |
          echo "::error::confirm must be exactly SPEND. Nothing was run."
          exit 1

      # The approval is for specific numbers, so the numbers are checked rather
      # than defaulted. Defaults can be typed over at dispatch; a ceiling that
      # only exists as a default is a suggestion.
      #
      #   pilot 2.00 + independent judge 18.00 = 20.00 total
      #
      # The pilot's worst single request is priced over the calls this run will
      # actually make -- the models the Router selects, plus the baseline --
      # rather than over every model it could rank. A model that is merely
      # ranked is never sent a prompt by this harness and costs nothing.
      #
      # Set on the judge-cap probe's measurement rather than on an assumption:
      # ten judgements on claude-fable-5 billed 45-1,437 output tokens each for
      # a three-token verdict, and input is roughly half the judge's cost.
      #
      # Raising any of them needs mposition's approval, and the way to record
      # that is to edit this step in a commit rather than to type a bigger
      # number into the dispatch form.
      - name: The ceilings are the approved ones
        env:
          PILOT: ${{ inputs.max_cost_pilot_usd }}
          REJUDGE: ${{ inputs.max_cost_rejudge_usd }}
        run: |
          node -e '
            const approved = { pilot: 2.00, rejudge: 18.00, total: 20.00 };
            const pilot = Number(process.env.PILOT);
            const rejudge = Number(process.env.REJUDGE);
            const bad = [];
            if (!(pilot > 0) || pilot > approved.pilot) bad.push(`pilot ceiling ${process.env.PILOT} exceeds the approved $${approved.pilot.toFixed(2)}`);
            if (!(rejudge > 0) || rejudge > approved.rejudge) bad.push(`judge ceiling ${process.env.REJUDGE} exceeds the approved $${approved.rejudge.toFixed(2)}`);
            if (pilot + rejudge > approved.total) bad.push(`the two together are $${(pilot + rejudge).toFixed(2)}, over the approved total $${approved.total.toFixed(2)}`);
            if (bad.length > 0) {
              for (const line of bad) console.log(`::error::${line}`);
              console.log("::error::Nothing was run and nothing was billed.");
              process.exit(1);
            }
            console.log(`Ceilings within approval: pilot $${pilot.toFixed(2)} + judge $${rejudge.toFixed(2)} = $${(pilot + rejudge).toFixed(2)} of $${approved.total.toFixed(2)}.`);
          '

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The workflow file has to exist on the default branch for GitHub to
      # offer it at all, so it can be dispatched against a ref that does not
      # carry the script. `npm run` would answer "Missing script", which says
      # nothing about which branch to pick.
      - name: The selected ref can run this
        run: |
          node -e '
            const scripts = require("./package.json").scripts ?? {};
            if (!("eval:router-quality" in scripts)) {
              console.log(
                "::error::This branch does not carry eval:router-quality. " +
                  "Re-dispatch with Branch: develop, or a branch that has it."
              );
              process.exit(1);
            }
            // decideRouterModel pulls in server-only modules. Without the
            // condition every item fails on import, before a single request.
            if (!scripts["eval:router-quality"].includes("--conditions=react-server")) {
              console.log(
                "::error::eval:router-quality does not run under the server condition."
              );
              process.exit(1);
            }
          '

      # Everything that can refuse for free refuses here, before a key is put
      # in front of a provider: the set must be well formed, every cell must
      # hold its frozen target, and the freeze digest must still verify.
      - name: Preconditions
        run: npm run check:router-quality-eval

      # Read from the set rather than retyped, so this file cannot drift from
      # the pre-registration. The runner checks them again and refuses on any
      # disagreement, so a mistake here costs nothing.
      - name: Read the pre-registered configuration
        id: preregistered
        run: |
          node -e '
            const set = require("./docs/ops/router-evaluation-set/development-v0.json");
            const out = {
              baseline: set.baseline?.modelId,
              judge: set.judge?.modelId,
              independent_judge: set.independentJudge?.modelId,
              seed: set.seed?.value,
            };
            for (const [key, value] of Object.entries(out)) {
              if (!value) {
                console.log(`::error::the set pre-registers no ${key}`);
                process.exit(1);
              }
              console.log(`${key}=${value}`);
            }
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Before the pilot spends anything. The independent judge is an Anthropic
      # model and the pilot is not, so a missing ANTHROPIC_API_KEY would let
      # the pilot run to completion and the calibration then grade nothing --
      # paying for the answers and getting no measurement.
      - name: Every key this dispatch needs is present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          for name in OPENAI_API_KEY DEEPSEEK_API_KEY ANTHROPIC_API_KEY; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing. Nothing was run and nothing was billed."
            exit 1
          fi
          echo "All three provider keys are set. Checked by name; no value is printed."

      # Before the first paid call the pilot freezes what the Router would
      # choose for all 210 items and refuses to run if the pre-registered
      # independent judge is among the answer authors or their fallbacks --
      # claude-fable-5 is both the judge and an Auto candidate, and a judge
      # grading its own answer is not a comparison of two judges. The test is a
      # call path rather than a candidate list: the baseline and the frozen
      # primary selections, which are the only models this harness sends a
      # prompt to. It aborts rather than re-routing -- dropping the judge from
      # the candidate set would measure a Router the product does not have, and
      # claude-opus-4-8 is an Auto candidate too, so swapping only moves it.
      # The 2026-08-28c pilot ran 2h44m, measured cleanly, and was then refused
      # by the gate because its last three answers hit DeepSeek's `Insufficient
      # Balance` -- three pairs at the end of the run took one cell from 14 to
      # 11, under its 13/14 floor. Nothing about that was detectable before
      # dispatch, and it cost $0.58 and three hours to find out.
      #
      # So the balance is read first. The pilot may spend up to its stage
      # ceiling, so anything less than that available is a run planned to fail
      # part-way.
      - name: DeepSeek can pay for this run
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REQUIRED_USD: ${{ inputs.max_cost_pilot_usd }}
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body -m 30 \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            https://api.deepseek.com/user/balance)" || {
              echo "::error::could not read the DeepSeek balance. Nothing was run and nothing was billed."
              exit 1
            }
          BALANCE_JSON="$response" node -e '
            const body = JSON.parse(process.env.BALANCE_JSON);
            const required = Number(process.env.REQUIRED_USD);
            const usd = (body.balance_infos ?? []).find((row) => row.currency === "USD");
            if (!usd) {
              console.log("::error::the DeepSeek balance response carries no USD row.");
              process.exit(1);
            }
            const total = Number(usd.total_balance);
            if (!Number.isFinite(total)) {
              console.log(`::error::unreadable DeepSeek total_balance "${usd.total_balance}".`);
              process.exit(1);
            }
            // is_available is the provider saying the account may call at all;
            // the number says whether it can pay for THIS run. Both.
            if (body.is_available !== true) {
              console.log("::error::DeepSeek reports the account is not available for calls.");
              process.exit(1);
            }
            if (total < required) {
              console.log(
                `::error::DeepSeek has $${total.toFixed(2)} available, under this pilot ceiling of ` +
                  `$${required.toFixed(2)}. A run that cannot pay for its own ceiling is a run planned ` +
                  "to stop part-way. Nothing was run and nothing was billed."
              );
              process.exit(1);
            }
            console.log(`DeepSeek has $${total.toFixed(2)} available against a $${required.toFixed(2)} pilot ceiling.`);
          '

      - name: Pilot run (this is the first step that spends)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p artifacts
          npm run eval:router-quality -- \
            --mode=pilot \
            --set=docs/ops/router-evaluation-set/development-v0.json \
            --baseline='${{ steps.preregistered.outputs.baseline }}' \
            --judge='${{ steps.preregistered.outputs.judge }}' \
            --seed='${{ steps.preregistered.outputs.seed }}' \
            --max-cost-usd='${{ inputs.max_cost_pilot_usd }}' \
            --per-request-max-cost-usd=1.00 \
            --bundle=artifacts/route01-pilot-${{ inputs.run_label }}.answers.jsonl \
            --json=artifacts/route01-pilot-${{ inputs.run_label }}.json

      # The hard gate mposition set in front of the expensive call. Every
      # condition must hold; any one failing means the judge is not called and
      # the job ends:
      #
      #   pilot.completed = true          the pilot ran to the end
      #   pilot.pairsAttempted = 210      the whole set, not a truncated slice
      #   bundleProblems = 0              every stored answer is judgeable
      #   pairedCoverage >= 200/210       overall floor
      #   eachCellPairedCoverage >= 13/14 per-cell floor
      #   harnessAttributableFailureCount = 0   no empty result was ours
      #   costSoFar <= the pilot ceiling
      #   stressCost <= $18.00            the judge stage fits at the probe's p90
      #   maxPerRequestWorstCase <= $0.75 one judge call cannot breach it
      #
      # The two cost conditions are recomputed from THIS bundle, not carried
      # over: the judge's input is roughly half its cost and grows with the
      # answers, so every pair it would read is rendered and counted exactly.
      #
      # A bundle short of the floors buys a calibration over the pairs that
      # happened to survive. A bundle whose answers this code mangled buys a
      # measurement of this code. Both cost ten times the run that produced the
      # answers, so both are refused for free, here.
      #
      # It runs whatever the pilot's exit code was, so a pilot that stopped
      # early is refused here by name rather than silently followed. There is
      # no retry: a re-run starts a new pilot, because regenerating the pairs
      # that already completed would rewrite answers this run already paid for
      # and graded.
      - name: The bundle may be judged
        run: |
          npm run check:router-answer-bundle -- \
            --bundle=artifacts/route01-pilot-${{ inputs.run_label }}.answers.jsonl \
            --set=docs/ops/router-evaluation-set/development-v0.json \
            --record=artifacts/route01-pilot-${{ inputs.run_label }}.json \
            --max-cost-usd='${{ inputs.max_cost_pilot_usd }}'

      # The same answers, graded by the independent judge. No answer is
      # regenerated and the display order is the one the bundle fixed, so the
      # only thing that differs between the two passes is who graded.
      #
      # Every verdict is appended as it is produced, so a pass stopped at the
      # $18 ceiling keeps what it paid for. `--resume` makes a later pass read
      # those verdicts and skip those pairs: re-calling a pair that already
      # carries one spends the same money twice for an answer already held.
      # `--per-request-max-cost-usd` is checked before the first call, because
      # a running total cannot stop a single call that breaches the ceiling.
      #
      # The target judge's own pass is not re-run: the pilot wrote it beside
      # the bundle from the verdicts it had already paid for.
      - name: Independent judge (this is the expensive step)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm run eval:router-quality -- \
            --rejudge=artifacts/route01-pilot-${{ inputs.run_label }}.answers.jsonl \
            --set=docs/ops/router-evaluation-set/development-v0.json \
            --judge='${{ steps.preregistered.outputs.independent_judge }}' \
            --max-cost-usd='${{ inputs.max_cost_rejudge_usd }}' \
            --per-request-max-cost-usd=0.75 \
            --resume \
            --json=artifacts/route01-independent-${{ inputs.run_label }}.verdicts.jsonl

      # Pure analysis of the two verdict files. It sends nothing and costs
      # nothing, and it prints the cross-tab and the paired shift with its
      # interval into this log, which is readable without downloading the
      # artifact.
      - name: Judge calibration
        run: |
          npm run eval:router-quality -- \
            --mode=judge-calibration \
            --verdicts=artifacts/route01-pilot-${{ inputs.run_label }}.answers.jsonl.${{ steps.preregistered.outputs.judge }}.verdicts.jsonl \
            --verdicts=artifacts/route01-independent-${{ inputs.run_label }}.verdicts.jsonl \
            --seed='${{ steps.preregistered.outputs.seed }}' \
            --json=artifacts/route01-calibration-${{ inputs.run_label }}.json

      # Before anything that can fail: a run that paid must not lose its
      # records because a later step exited non-zero.
      - name: Preserve the artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route01-calibration-${{ inputs.run_label }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
