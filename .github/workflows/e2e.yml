name: Main Chromium Regression
#
# This workflow owns the desktop-chromium coverage that PR Fast Gate no
# longer runs. PR Fast Gate runs only the 25 `@smoke` contracts (see
# scripts/verify-smoke-coverage.mjs); every other desktop-chromium test --
# visual regression, typography, touch targets, keyboard policy, responsive
# layout, analytics consent, i18n -- is still executed here, unfiltered, on
# every main push. Nothing was deleted; the CI tier moved.
#
# `test:e2e:chromium` must therefore stay unfiltered. Adding a tag filter to
# it would drop those tests from CI entirely, and the security-regression
# check asserts that it has none.
#
# The suite is split across shards rather than projects. `--shard` divides the
# same unfiltered run by test count, so every shard still carries all three
# Chromium projects and the union of the shards is exactly what one job used
# to execute. Sharding by `--project` would have been the obvious cut and is
# the wrong one twice over: the projects are lopsided (desktop-chromium alone
# is over half the suite, so the slowest shard would barely improve), and it
# would mean dropping `npm run test:e2e:chromium` in favour of per-project
# `playwright test` calls -- which is the command the security-regression
# check pins precisely so nobody can quietly narrow this run.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Every push to `main` is a release, so every push needs its own verdict.
#
# This run takes ~28 minutes wall clock (~106 runner-minutes across the five
# shards). On 2026-08-02 seven releases landed 11-20 minutes apart, and with
# `cancel-in-progress: true` each one killed the previous run before it could
# finish: `14ecd96`, `cd3e1b0` and `2a7eb03` were all cancelled in a row. The
# last *completed* verdict was `2e0eff2`, a failure, four releases and two
# hours earlier -- so the fix meant to clear it (#252) shipped three times
# without a completed canonical run ever confirming it.
#
# `cancel-in-progress: false` alone does not fix that. By default a group
# holds one running and one *pending* run, and a third arrival cancels the
# pending one and takes its place, so a burst still loses the middle of the
# sequence. `queue: max` raises the pending limit to 100, which is what
# actually preserves a verdict per SHA. The two settings are only valid
# together in this direction: `queue: max` with `cancel-in-progress: true` is
# a workflow validation error.
#
# The cost is queue delay, not money -- this repository is public on standard
# GitHub-hosted runners. During a burst the newest release's verdict can be
# hours behind, which is the deliberate trade: a late answer for every commit
# beats a prompt answer for one and silence for the rest.
#
# What this does NOT do is stop a broken release from shipping. It runs after
# the merge button, so it reports rather than blocks. Moving the canonical
# suite in front of the release -- a required gate on the release pull request
# -- is the real fix and is not attempted here.
concurrency:
  group: main-chromium-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  playwright:
    name: Chromium regression (shard ${{ matrix.shard }}/${{ matrix.shards }})
    # Canonical visual baseline: pinned image, not ubuntu-latest, so a
    # runner-image bump cannot silently re-rasterise every golden.
    # See docs/qa/canonical-visual-baseline.md. Sharding does not weaken this:
    # every shard runs the same pinned image, so a golden is compared on the
    # canonical environment no matter which shard happens to own it.
    runs-on: ubuntu-24.04
    # One shard's share of the suite, plus its own build. The single-job
    # version needed 75 minutes and was still growing into it.
    #
    # First sharded run, at three shards: 18m05s, 12m50s, 10m15s, against
    # 33m36s unsharded. Wall clock is the slowest shard, so that was a bit
    # under half, not the third the test split alone would suggest -- every
    # shard pays for its own build, and `--shard` divides by file, which does
    # not divide evenly by duration.
    #
    # 2026-08-25, tuning it as that note invited. Three shards had grown into
    # the ceiling and gone through it: on `c8e0a23` shard 1 was killed at 40
    # minutes with the run unfinished, which failed the rollup and skipped the
    # release's production deployment. Nothing was wrong with the tests --
    # shards 2 and 3 passed in 29m04s and 29m08s.
    #
    # Playwright's own test times, for whoever tunes this next:
    #
    #   5673158  31.1m  29.3m  22.1m                three shards, all finished
    #   c8e0a23  killed 29.1m  29.1m                same three, slower runners
    #   2596e0e  25.4m  20.1m  17.3m  16.4m  17.9m  five, the first run
    #
    # Two things that run reveals. The suite is ~83 minutes of execution and
    # was ~41 at the note above, so it doubled. And the split is even by test
    # count but not by work: shard 1 skipped 112 tests where 2 and 3 skipped
    # 504 and 514, so shard 1 actually ran 1553 against 1161 and 1151. Most
    # specs belong to one project, and `--shard` cannot see that.
    #
    # So the lever is the shard count, which is what the original note said it
    # would be. `2596e0e` above is the measurement, not the estimate: the
    # slowest shard took 26m48s of job time for 25m24s of tests, which leaves
    # the 40-minute ceiling 13 minutes -- a third of it -- in hand. That run
    # was 97 minutes of execution against the 83 of `5673158`, so the margin
    # was measured on a slow set of runners rather than a kind one. Wall clock
    # came to 28m24s for 106 runner-minutes across the five.
    #
    # The ceiling itself stays where it is: it is what stops a hung Playwright
    # server burning a full hour, and raising it to buy headroom would spend
    # exactly the protection it exists for. The cost is two more duplicated
    # builds, which on a public repository is queue time rather than money.
    #
    # What did not change is the imbalance. `--list` puts the five at
    # 1016 / 1044 / 940 / 1007 / 991 specs, and shard 1 still came in five
    # minutes above the next one -- the count is even, the work is not,
    # because the runtime skips above are invisible to `--list`. So the tail
    # is still one shard wide, and the next release that lands 10 minutes of
    # tests in the wrong file spends them out of shard 1's 13.
    timeout-minutes: 40
    strategy:
      # A failing shard must not cancel its siblings. Their results are the
      # evidence for what else broke, and cancelling them turns one red spec
      # into an unreadable run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        shards: [5]
    # Keep the production client bundle on the same deterministic Turnstile
    # configuration used by the isolated Playwright server.
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-main-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-main-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      # Each shard builds for itself. The shards share a cache key, so the
      # first to arrive populates .next/cache and the others restore it; the
      # duplicated work is bounded and buys the wall-clock the split exists for.
      - name: Build once for the Chromium test server
        run: npm run build

      - name: Restore Playwright Chromium cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-

      - name: Install Chromium
        run: scripts/ci/install-playwright.sh chromium

      - name: Run Chromium desktop and mobile E2E tests
        run: npm run test:e2e:chromium -- --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Shard-scoped, or the shards race to write one artifact name and
          # only the first upload survives.
          name: main-chromium-test-results-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  regression:
    name: Chromium desktop and mobile regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [playwright]
    # Keeps one check with the name this workflow reported before it was
    # sharded, so anything watching for that result still finds it.
    #
    # `always()` so this reports a red check instead of going pending when a
    # shard fails, is cancelled, or is skipped. The step below decides the
    # verdict; reaching it is not itself a pass.
    if: always()
    steps:
      # `needs.playwright.result` collapses the whole matrix: it is `success`
      # only when every shard succeeded. `skipped` and `cancelled` are
      # failures here on purpose -- a shard that never ran has verified
      # nothing, and treating either as a pass is how an aggregating gate goes
      # green without gating.
      - name: Enforce shard results
        env:
          SHARDS: ${{ needs.playwright.result }}
        run: |
          set -uo pipefail
          echo "shards: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::Chromium regression shards concluded '$SHARDS', not 'success'."
            echo "See the shard jobs above for which specs failed."
            exit 1
          fi
          echo "All Chromium regression shards passed."
