name: Main Chromium Regression
#
# This workflow owns the desktop-chromium coverage that PR Fast Gate no
# longer runs. PR Fast Gate runs only the ~20 `@smoke` contracts (see
# scripts/verify-smoke-coverage.mjs); every other desktop-chromium test --
# visual regression, typography, touch targets, keyboard policy, responsive
# layout, analytics consent, i18n -- is still executed here, unfiltered, on
# every main push. Nothing was deleted; the CI tier moved.
#
# `test:e2e:chromium` must therefore stay unfiltered. Adding a tag filter to
# it would drop those tests from CI entirely, and the security-regression
# check asserts that it has none.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-chromium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Chromium desktop and mobile regression
    # Canonical visual baseline: pinned image, not ubuntu-latest, so a
    # runner-image bump cannot silently re-rasterise every golden.
    # See docs/qa/canonical-visual-baseline.md.
    runs-on: ubuntu-24.04
    # The unfiltered suite has been growing into this budget for several
    # releases -- 33m, then 41m43s, then 42m23s -- and the go-live regression
    # specs took it past 45m, where the run is killed and reported as
    # "cancelled" rather than as a timeout, which reads like someone stopped it.
    # Raised for headroom, not because anything here got slower: no single spec
    # regressed, the suite simply has more of them.
    #
    # This buys time rather than fixing the shape. `test:e2e:chromium` runs
    # desktop-chromium, desktop-compact and mobile-chromium in one job; a matrix
    # over the three projects would cut wall-clock roughly threefold and is the
    # real fix. That is a change to make on its own, not during a release.
    timeout-minutes: 75
    # Keep the production client bundle on the same deterministic Turnstile
    # configuration used by the isolated Playwright server.
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-main-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-main-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      - name: Build once for the Chromium test server
        run: npm run build

      - name: Restore Playwright Chromium cache
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium desktop and mobile E2E tests
        run: npm run test:e2e:chromium

      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: main-chromium-test-results-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
