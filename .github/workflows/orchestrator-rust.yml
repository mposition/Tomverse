name: Orchestrator Rust

# The Rust workspace (crates/amux-core, apps/tomverse-orchestrator) had no CI
# lane, so its tests only ever ran on a developer's machine. A regression test
# nobody runs is not a defence: this lane makes the workspace's own tests a
# check on every change.
#
# It has no path filter on purpose. This job is a required check, and a
# path-filtered workflow reports nothing at all on a pull request that does not
# match -- the check then sits at "expected" forever and the pull request cannot
# merge. Every pull request pays for the product and vendored AMUX Rust
# builds; the cache and job timeout cover the larger vendor dependency set.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

# Read-only. This lane compiles and runs workspace code, so it must never hold
# a credential that outlives the run.
permissions:
  contents: read

concurrency:
  group: orchestrator-rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || github.base_ref == 'develop' || (github.base_ref == 'main' && github.head_ref != 'develop')
    name: Build and test the Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        # Restore always, save only on a pull-request run. This workflow can also
        # run outside a pull request -- a dispatch on a chosen ref, or a push to a
        # release branch -- and an entry written in the default-branch or develop
        # scope is restorable by every run that can see it, the required gate
        # included. A pull-request run writes to its own merge ref, which only that
        # pull request can restore, so it keeps the cache warm without widening
        # anything. .github/audits/actions-cache-poisoning-audit-2026-10-03.md P1.
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/amux/target
          key: ${{ runner.os }}-rust-v2-workspaces-${{ hashFiles('Cargo.lock', 'vendor/amux/Cargo.lock') }}

      # No fmt or clippy step: the workspace has no rustfmt.toml and its source
      # is hand-formatted, so adding either here would fail on code this change
      # does not touch. Formatting is its own decision.

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Build vendored AMUX server
        working-directory: vendor/amux
        run: cargo build -p amux-server --locked

      - name: Test vendored AMUX server library
        working-directory: vendor/amux
        run: cargo test -p amux-server --lib --locked

      - name: Save the Rust build cache
        # Only the pull-request scope. See the restore step above.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            vendor/amux/target
          key: ${{ runner.os }}-rust-v2-workspaces-${{ hashFiles('Cargo.lock', 'vendor/amux/Cargo.lock') }}

      - name: Check vendored AMUX Docker build inputs
        working-directory: vendor/amux
        run: cargo test -p amux-server --test dockerfile_build_inputs --locked
