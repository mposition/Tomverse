name: Memory eval — decision-grade run
#
# The §12.4 decision-grade run for a memory-extraction pair, on demand.
#
# ############################################################################
# # THIS WORKFLOW SPENDS MONEY. It makes 1,150 provider calls per dispatch.  #
# # Manual dispatch only, with a typed confirmation, and never on push.      #
# ############################################################################
#
# Why here rather than someone's machine
# (docs/ops/memory-extraction-decision-grade-run.md §2.5):
#
#   * the checkout is clean by construction, so §12.2's "same commit" cannot
#     be broken by accident, and the artifact's commitSha names a real commit
#     -- a run from a deployed container reports "unknown" and is refused;
#   * the key is a repository secret rather than a shell history;
#   * the artifact is preserved by the platform, which is what §12.1 means by
#     an immutable artifactRef: the run URL is the reference.
#
# `limit` makes the run a compatibility probe instead: the first N cases and
# stop. It exists because three dispatches went one failure at a time
# discovering the request was malformed, and ten cases answer that as well as
# 1,150 do. A probe is never a result -- the artifact records `probeLimit` and
# `decisionGrade` is false whatever the numbers say.
#
# What it does not do: approve anything. It computes a verdict and preserves
# the evidence. Moving the register entry to `approved` is the human procedure
# in §12.4 and never happens from CI.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Pair under evaluation"
        required: true
        default: gpt-5-6-luna
      run_label:
        description: "Names the artifact — run1, run2 (the independent re-run), rerun1…"
        required: true
        default: run1
      max_cost_usd:
        description: "Per-run ceiling in USD. May only narrow the approved budget."
        required: true
        default: "6"
      limit:
        description: "Compatibility probe: run only the first N cases. Empty means a full run."
        required: false
        default: ""
      confirm:
        description: "Type SPEND to confirm this dispatch will call a paid provider"
        required: true
        default: ""

permissions:
  contents: read

# One at a time. Two concurrent runs would spend two budgets and produce two
# artifacts of the same label, and `cancel-in-progress` would abandon a run
# that had already paid for most of its calls.
concurrency:
  group: memory-eval-decision-grade
  cancel-in-progress: false

jobs:
  run:
    name: Decision-grade run
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Confirm the spend
        if: inputs.confirm != 'SPEND'
        run: |
          echo "::error::confirm must be exactly SPEND. Nothing was run."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The workflow file has to exist on the default branch for GitHub to
      # offer it at all, so it lives on `main` while the scripts it calls
      # live on `develop`. Dispatching with the default ref therefore selects
      # a branch that cannot run it, and `npm run` would answer with "Missing
      # script" -- a message that says nothing about which branch to pick.
      - name: The selected ref can run this
        env:
          # Through the environment, never interpolated into the shell line:
          # an input that lands inside the command is an input that can end it.
          LIMIT: ${{ inputs.limit }}
        run: |
          node -e '
            const fs = require("node:fs");
            const scripts = require("./package.json").scripts ?? {};
            const missing = [
              "eval:memory-extraction",
              "check:memory-eval-freeze",
              "check:memory-eval-run",
              "make:memory-eval-blind-review",
            ].filter((name) => !(name in scripts));
            if (missing.length > 0) {
              console.log(
                "::error::This branch does not carry " + missing.join(", ") +
                  ". Re-dispatch with Branch: develop, or a branch that has them."
              );
              process.exit(1);
            }
            if (!process.env.LIMIT) process.exit(0);
            // A harness predating --limit drops the flag silently, so a
            // request for ten cases would run all 1150 and bill for them. An
            // unknown flag is not a smaller run, it is a full one.
            const harness = fs.readFileSync(
              "scripts/evalImportedMemoryExtraction.mjs",
              "utf8"
            );
            if (harness.includes("argValue(\"limit\"")) process.exit(0);
            console.log(
              "::error::A limit was requested but this branch does not support --limit. " +
                "It would ignore the flag and run every case."
            );
            process.exit(1);
          '

      # Everything that can refuse for free refuses here, before the key is
      # ever put in front of a provider.
      - name: Preconditions
        run: |
          npm run check:memory-eval-freeze
          npm run check:memory-extraction-eval
          npm run eval:memory-extraction

      - name: Live run (this is the step that spends)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Read through the environment rather than interpolated into the
          # command: an input that lands inside the shell line is an input
          # that can end it.
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p artifacts
          npm run eval:memory-extraction -- \
            --live \
            --model='${{ inputs.model }}' \
            --json=artifacts/mem-eval-${{ inputs.run_label }}.json \
            --max-cost-usd='${{ inputs.max_cost_usd }}' \
            ${LIMIT:+--limit="$LIMIT"}

      # Before the admissibility check, and before anything that can fail:
      # a run that paid for 1,150 calls must not lose its records because a
      # later step exited non-zero.
      - name: Preserve the artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mem-eval-${{ inputs.run_label }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

      # The rules pre-registered on 2026-08-24
      # (docs/ops/memory-extraction-decision-grade-run.md §3). Failing here
      # means the run may not be cited -- its numbers are not a result either
      # way -- and the artifact above is still preserved.
      # Skipped on a probe, and not because the check would be inconvenient:
      # a probe's `decisionGrade` is false by construction, so the rules would
      # discard it every time and the red job would say "this run may not be
      # cited" about something that was never going to be. What a probe is
      # judged on is whether the answers parsed, which is on the summary above.
      - name: Admissibility
        if: inputs.limit == ''
        run: |
          npm run check:memory-eval-run -- \
            --artifact=artifacts/mem-eval-${{ inputs.run_label }}.json

      # Same reason, plus a mechanical one: the sheet samples every cell, and
      # a probe of the first N cases does not reach most of them.
      - name: Blind review sheet
        if: inputs.limit == ''
        run: |
          npm run make:memory-eval-blind-review -- \
            --artifact=artifacts/mem-eval-${{ inputs.run_label }}.json \
            --per-cell=5 \
            --out=artifacts/blind-review-${{ inputs.run_label }}.md

      - name: Preserve the blind review sheet
        if: always() && inputs.limit == ''
        uses: actions/upload-artifact@v7
        with:
          name: mem-eval-${{ inputs.run_label }}-blind-review
          path: artifacts/blind-review-${{ inputs.run_label }}.md
          if-no-files-found: warn
          retention-days: 90
