# The AMUX idea lane (lib/amux/ideaLaneCore.ts; owner decision 2026-11-02).
#
# OFF BY DEFAULT. Nothing runs unless the repository variable
# AMUX_IDEA_LANE_ENABLED is "true", and the app answers no claim unless its own
# AMUX_IDEA_LANE_ENABLED and AMUX_IDEA_LANE_SYNC_SECRET are set.
#
# One idea per run: claim the oldest owner idea from the app, let one Claude
# Code session implement it on develop, and open a DRAFT pull request into
# develop. A failed run reports why; the app retries the idea on a later run
# up to its attempt limit and caps the attempts per day (the spending bound).
#
# Guardrails that must survive any edit to this file:
#   - workflow_dispatch and schedule only, never a pull-request trigger;
#   - this repository is public and so are its logs: the idea text lives only
#     in a file under runner.temp, and so does the model's transcript; neither
#     is printed or uploaded;
#   - each secret is in the steps that need it: the sync secret in the app
#     calls, the model credential in the model step (which also scans the
#     change for it), the PAT in the push step;
#   - the change may not touch .github/;
#   - the pull request is a draft into develop with no auto-merge: a person
#     reviews and merges it.
name: AMUX Idea Lane

# The token-level cache control, which a restore-only action is not: it narrows
# one declared step while the job keeps a key anything running in it can reserve
# an entry with. This workflow runs on the default branch, whose entries every
# run can restore, so its token gets none of that capability.
# .github/audits/actions-cache-poisoning-audit-2026-10-03.md P1a.
cache-mode: read

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: amux-idea-lane
  cancel-in-progress: false

env:
  TOMVERSE_APP_URL: https://tomverse.app

jobs:
  run:
    if: github.repository == 'mposition/Tomverse' && vars.AMUX_IDEA_LANE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The app's lease (AMUX_IDEA_LANE_LEASE_MS) is longer than this.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      IDEA_PATH: ${{ runner.temp }}/idea.md
      PR_TITLE_PATH: ${{ runner.temp }}/pr-title.txt
      PR_BODY_PATH: ${{ runner.temp }}/pr-body.md
    steps:
      - name: Claim an idea
        id: claim
        env:
          AMUX_IDEA_LANE_SYNC_SECRET: ${{ secrets.AMUX_IDEA_LANE_SYNC_SECRET }}
        run: |
          umask 077
          response=$(curl -sS -f -X POST \
            -H "Authorization: Bearer ${AMUX_IDEA_LANE_SYNC_SECRET}" \
            "${TOMVERSE_APP_URL}/api/internal/amux/idea-lane/claim")
          if [ "$(jq -r '.claimed' <<<"$response")" != "true" ]; then
            echo "No idea to run."
            exit 0
          fi
          attempt=$(jq -r '.attemptId' <<<"$response")
          branch=$(jq -r '.branch' <<<"$response")
          if ! [[ "$attempt" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] \
            || [ "$branch" != "amux-idea/${attempt}" ]; then
            echo "The claim is malformed."
            exit 1
          fi
          jq -r '.idea' <<<"$response" > "$IDEA_PATH"
          echo "claimed=true" >> "$GITHUB_OUTPUT"
          echo "attempt=${attempt}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Checkout develop
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # This job holds credentials and caches nothing (see feedback-autofix.yml).
          package-manager-cache: false

      - name: Install dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: npm ci

      - name: Install Claude Code CLI (pinned)
        if: steps.claim.outputs.claimed == 'true'
        env:
          CLAUDE_CODE_VERSION: "2.1.220"
          CLAUDE_CODE_INTEGRITY: "sha512-ogBrvwkqF9f8okmnXKxmRNHuvtFxFEffe5pWdqOV3iQDxlUOKirFqnyWC7NGXXnDA4WkkbPH8pvSbwyCR2Auyw=="
        run: |
          package=$(npm pack --json "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" | jq -r '.[0].filename')
          actual="sha512-$(openssl dgst -sha512 -binary "$package" | openssl base64 -A)"
          if [ "$actual" != "$CLAUDE_CODE_INTEGRITY" ]; then
            echo "Claude Code package integrity mismatch."
            exit 1
          fi
          npm install -g "$package"

      - name: Implement the idea (model credential only in this step)
        if: steps.claim.outputs.claimed == 'true'
        id: model
        env:
          # One of the two is set: an API key (billed per call) or a
          # subscription token from `claude setup-token`.
          ANTHROPIC_API_KEY: ${{ secrets.AMUX_IDEA_LANE_ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.AMUX_IDEA_LANE_CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ vars.AMUX_IDEA_LANE_MODEL || 'opus' }}
          TRANSCRIPT_PATH: ${{ runner.temp }}/transcript.txt
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          prompt=$(cat <<'PROMPT'
          You are implementing one owner request for the Tomverse repository,
          on a fresh checkout of develop. Read AGENTS.md first and follow it.

          The request is in the file named by the IDEA_PATH environment
          variable. It is the owner's own text: do what it asks with the
          smallest change that makes it work, and resolve routine technical
          choices yourself. If it is ambiguous, take the most reasonable
          reading and say which one in the PR body.

          Rules:
          - Edit files in this checkout only. Do not commit, push, open a pull
            request or call GitHub; this job does that after you finish.
          - Never edit anything under .github/.
          - Add or update tests for what you change. Run the relevant tests
            and `npx eslint --max-warnings 0` on the files you changed, and
            fix what fails.
          - Never print, copy or write the value of an environment variable.
          - If the request cannot be done in this repository, change nothing.

          When you finish with changes, write two files outside the
          repository, and nothing else there:
          - PR_TITLE_PATH: one line of at most 80 characters, a conventional
            commit title in English, for example "feat(chat): ...";
          - PR_BODY_PATH: in English, what changed and why, and which tests
            you ran with their results. Describe the code. Do not quote the
            request or repeat its business context: the pull request is public.
          PROMPT
          )
          set +e
          claude --print --dangerously-skip-permissions --model "$MODEL" --max-turns 300 \
            -- "$prompt" > "$TRANSCRIPT_PATH" 2>&1
          code=$?
          set -e
          echo "Claude Code exited with ${code}."
          if [ "$code" -ne 0 ]; then
            echo "failure=cli_failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "failure=no_change" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --name-only | grep -q '^\.github/'; then
            echo "failure=workflow_edit" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for value in "${ANTHROPIC_API_KEY:-}" "${CLAUDE_CODE_OAUTH_TOKEN:-}"; do
            if [ -n "$value" ] && git diff --cached | grep -qF -- "$value"; then
              echo "failure=secret_in_diff" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          git diff --cached --stat

      - name: Push the branch and open the draft PR (PAT only here)
        if: steps.claim.outputs.claimed == 'true' && steps.model.outputs.failure == ''
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          BRANCH: ${{ steps.claim.outputs.branch }}
          ATTEMPT: ${{ steps.claim.outputs.attempt }}
        run: |
          title=$(head -n 1 "$PR_TITLE_PATH" 2>/dev/null | tr -d '\000-\037' | cut -c 1-100)
          [ -n "$title" ] || title="feat: implement an AMUX idea"
          body="${RUNNER_TEMP}/pr-body-final.md"
          { head -c 50000 "$PR_BODY_PATH" 2>/dev/null || true
            printf '\n\n---\nOpened by the AMUX idea lane (attempt `%s`). A draft: a person reviews and merges it.\n\n' "$ATTEMPT"
            printf '🤖 Generated with [Claude Code](https://claude.com/claude-code)\n'; } > "$body"
          git checkout -b "$BRANCH"
          git -c user.name="tomverse-idea-lane[bot]" \
              -c user.email="tomverse-idea-lane-bot@users.noreply.github.com" \
              commit -q -m "$title"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "$BRANCH"
          url=$(gh pr create --draft --base develop --head "$BRANCH" --title "$title" --body-file "$body")
          echo "number=$(gh pr view "$url" --json number -q .number)" >> "$GITHUB_OUTPUT"

      - name: Report the result
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          AMUX_IDEA_LANE_SYNC_SECRET: ${{ secrets.AMUX_IDEA_LANE_SYNC_SECRET }}
          ATTEMPT: ${{ steps.claim.outputs.attempt }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FAILURE: ${{ steps.model.outputs.failure }}
          PR_STEP: ${{ steps.pr.outcome }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            payload=$(jq -cn --arg id "$ATTEMPT" --argjson pr "$PR_NUMBER" '{attemptId:$id, outcome:"pr_open", prNumber:$pr}')
          else
            outcome="${FAILURE:-job_failed}"
            [ -n "$FAILURE" ] || [ "$PR_STEP" != "failure" ] || outcome=push_failed
            payload=$(jq -cn --arg id "$ATTEMPT" --arg outcome "$outcome" '{attemptId:$id, outcome:$outcome}')
          fi
          echo "Reporting: $(jq -c 'del(.attemptId)' <<<"$payload")"
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${AMUX_IDEA_LANE_SYNC_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${TOMVERSE_APP_URL}/api/internal/amux/idea-lane/result"
