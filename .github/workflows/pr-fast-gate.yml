name: PR Fast Gate
#
# Four jobs, one required status check.
#
# ############################################################################
# # `fast-gate` below MUST keep the name                                     #
# #     Security, unit, build, and Chromium smoke tests                      #
# # Branch protection on develop and main references check runs by NAME, and #
# # that string is the required check. The three jobs it aggregates are      #
# # deliberately NOT registered as required checks -- adding them would mean #
# # reconfiguring branch protection, and renaming this one would leave every #
# # open PR waiting forever on a check that no longer exists.                #
# ############################################################################
#
# The build-and-e2e job runs two Playwright tiers: the @smoke contract set and
# the @ui-risk layout/accessibility set (UI-008). Neither is the full suite --
# see .github/audits/ui-test-tiers.md for what runs where.
#
# secret-scan, static-and-unit and build-and-e2e run concurrently; fast-gate
# waits for all three and fails unless every one of them succeeded. Nothing
# merges on a green fast-gate that did not pass all three, and no upstream
# job can go green by being skipped -- see the aggregation step.

on:
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: pr-fast-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This duplicates the scan Secret History Scan performs on the same PR
  # (gitleaks-action scans base..head on pull_request in both), but it is
  # deliberately kept: fast-gate is the only required status check on develop
  # and main, so removing this would take secret scanning off the
  # merge-blocking path entirely. Remove it only after
  # "Scan repository history for secrets" is itself made a required check.
  # `fetch-depth: 0` exists for this job, and only for this job.
  secret-scan:
    name: Secret scan (PR commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan pull-request commits for secrets
        timeout-minutes: 5
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Everything that needs node_modules but neither a build nor a browser.
  # Runs unconditionally, including on documentation-only PRs: the encoding
  # check is exactly the check a Markdown-only change needs, and the rest is
  # cheap enough that scoping it would buy less than it risks.
  static-and-unit:
    name: Security, lint, encoding, and unit tests
    runs-on: ubuntu-latest
    # Measured 83s of work (run #130 step timings); 15 minutes covers a cold
    # npm cache with room to spare.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `--no-audit` skips the registry advisory round-trip npm otherwise
      # makes on every install; it does not weaken the audit itself, which
      # Daily Security Audit runs deliberately (`npm audit --omit=dev`) and
      # reports on. `--no-fund` drops the funding banner. Neither flag changes
      # which packages are installed -- `npm ci` still resolves solely from
      # the lockfile.
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Security regression checks
        timeout-minutes: 5
        run: npm run security:regression

      - name: Unit and API policy tests
        timeout-minutes: 10
        run: npm run test:unit

      # Its own process, not part of test:unit, because it needs
      # --experimental-test-module-mocks and module mocks are process-global
      # (see scripts/run-server-contract-tests.mjs). That separation is why it
      # was never wired into CI: until now the only places naming it were audit
      # write-ups, i.e. it ran when someone remembered to run it.
      #
      # What it asserts is not optional. It pins that a rejected chat request
      # reaches no provider and reserves no credits, and -- since #250 -- that
      # /api/models/catalog does not go back to spreading the registry row,
      # which is what published Tomverse's per-model USD cost basis to anyone
      # who asked. A guard nobody runs is not a guard.
      #
      # No database, no browser: 110 tests in ~6s, so it belongs in the static
      # tier beside the other cheap fail-closed checks.
      - name: Server contract tests
        timeout-minutes: 5
        run: npm run test:server-contract

      # UI-012: semantic accent colours must stay addressed by role inside the
      # guarded components. Cheap, no browser, so it sits with the other static
      # checks rather than in the browser tier.
      - name: Accent token usage
        timeout-minutes: 5
        run: npm run check:accent-tokens

      # An enabled premium model with no explicit billing profile falls back to
      # generic US$15/US$60 pricing, which is what mispriced GPT-5.5, Gemini
      # 3.1 Pro and Claude Opus 4.8 by 3x-7.5x in production. Fail closed.
      - name: Model pricing coverage
        timeout-minutes: 5
        run: npm run check:model-pricing

      # Import/memory policy §12.1/§12.4: an "approved" extraction pair is
      # what the memory pipeline will actually call, so approval without
      # complete eval evidence, passing §12.3 metrics, a live (unexpired)
      # approval and a human-approved eval budget fails the build.
      - name: Memory extraction eval register
        timeout-minutes: 5
        run: npm run check:memory-extraction-eval

      # Tomverse Chat release thresholds live only in the canonical registry
      # (docs/release-gates/tomverse-chat-v1.yaml); prose documents reference
      # gate IDs and may not redefine numbers. A registry with duplicate IDs,
      # missing required/approval fields, or invalid operators must not merge.
      # Cheap, no browser, so it sits in the static tier with the other
      # fail-closed checks.
      - name: Tomverse Chat release gates
        timeout-minutes: 5
        run: npm run verify:tomverse-chat-release-gates

      # The registry declares generatedMarkdownOnly, which was a claim with
      # nothing behind it until this check: the committed readable view is
      # re-rendered and compared byte for byte, so a threshold hand-edited into
      # the Markdown -- or a registry change that never regenerated the view --
      # fails here instead of shipping a table that disagrees with the gates.
      - name: Tomverse Chat release gate view is generated
        timeout-minutes: 5
        run: npm run check:tomverse-chat-release-gate-view

      # The chat route's context guard short-circuits on an undeclared window
      # (`modelConfig.contextWindowTokens && ...`), so a model without one is
      # not clamped to a safe default -- it is not checked at all, and an
      # over-limit request reaches the provider. ESTIMATE-03 forbids that at
      # zero tolerance. A ratchet rather than a cliff: today's gap is recorded
      # as a baseline that may only shrink, while any newly added or enabled
      # model must declare a window.
      - name: Router context-window declarations
        timeout-minutes: 5
        run: npm run check:router-context-window

      # Declaring a context window is not a no-op: the chat route's guard only
      # runs when contextWindowTokens is set, so a new value immediately starts
      # rejecting long requests that used to pass. Windows are verified with a
      # source, a date and a verifier in the register first. This fails when an
      # unverified row carries a value, a verified row has no provenance, or the
      # catalogue gains a window whose evidence was never recorded.
      - name: Context-window register
        timeout-minutes: 5
        run: npm run check:context-window-register

      # The delivery plan promises a new product table cannot silently escape
      # account deletion and export. A registry alone does not deliver that --
      # someone adds a table, forgets the registry, and the promise is quietly
      # untrue. The user-linked set and the cascade closure are derived from
      # schema.prisma here, so an unregistered table, or a row claiming a
      # cascade the schema no longer has, fails the build.
      - name: Data-domain registry
        timeout-minutes: 5
        run: npm run check:data-domain-registry

      # gpt-image-2 lives outside AVAILABLE_MODELS by design, so the model
      # pricing check above cannot see it. Same release contract -- every
      # enabled price is explicit and verified -- separate fail-closed net.
      - name: Image pricing coverage
        timeout-minutes: 5
        run: npm run check:image-pricing

      # The cost guardrails are derived from plan credits and stored in
      # ChatUsageBucket.count. When that product outgrew int4, PostgreSQL threw
      # 22003 in the guard query instead of returning an allow/deny decision and
      # every Max-plan request failed. Re-check the storage requirement whenever
      # a policy constant or plan grant moves.
      - name: Usage bucket storage range
        timeout-minutes: 5
        run: npm run check:usage-bucket-range

      # Two separate decisions that get mistaken for each other: which model
      # leads a guest's first comparison (an AppSetting) and what a newly
      # signed-in account gets (DEFAULT_MODEL_ID, APP_DEFAULTS, the Prisma
      # column default and the row app/api/user/settings creates). Nothing
      # else reads all four together, so they drift apart in silence. With no
      # DATABASE_URL this audits the compiled catalogue against the schema,
      # which is exactly the half CI can answer.
      - name: Default model coherence
        timeout-minutes: 5
        run: npm run check:default-models

      - name: Strict encoding validation
        timeout-minutes: 5
        run: npm run check:encoding:strict

      # `npm run check` still runs both locally and in the daily audit. They
      # are split here so the step timings in this log attribute time to the
      # right stage, and so a lint failure reports without paying for a build.
      - name: ESLint
        timeout-minutes: 10
        run: npx eslint . --max-warnings=0

  build-and-e2e:
    name: Production build and Chromium smoke tests
    runs-on: ubuntu-latest
    # Measured 143s of work with a warm cache (run #130 step timings, minus
    # the steps that moved to static-and-unit). 20 minutes is ~8x that: still
    # generous for a cold npm/Playwright cache, but a hung Playwright web
    # server now stops burning runner time at 20 minutes instead of 40.
    # Step-level timeouts bound each stage under that, so a hang says which
    # stage hung rather than only that the job did.
    timeout-minutes: 20
    # NEXT_PUBLIC values are embedded by `next build`. Guest E2E tests mock
    # Turnstile in the browser, but the client still requires a configured key.
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key

    steps:
      # Full history so the scope check below can diff against the PR base.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Documentation-only PRs skip this job's expensive half. The rule is a
      # deliberately narrow allowlist: top-level Markdown and audit reports
      # only. A Markdown file anywhere else -- under app/, tests/, scripts/,
      # public/ -- does NOT qualify, because those trees can hold fixtures
      # and generated content. Shared code, configuration, the lockfile,
      # workflows and tests all put the full gate back, as does detection
      # failing for any reason at all: `code=true` is the fallback on every
      # error path, so the failure mode is "ran too much", never "skipped a
      # check". `--no-renames` lists both sides of a rename so a file moved
      # out of documentation is still seen.
      - name: Determine whether this PR touches anything but documentation
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if ! changed=$(git diff --no-renames --name-only "$BASE_SHA"...HEAD); then
            echo "Could not diff against $BASE_SHA; running the full gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Diff reported no changed paths; running the full gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed paths:"
          echo "$changed"
          code=false
          while IFS= read -r path; do
            case "$path" in
              .github/audits/*) ;;
              docs/*.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            if [ "$code" = "true" ]; then
              echo "Non-documentation path found: $path"
              break
            fi
          done <<< "$changed"
          if [ "$code" = "false" ]; then
            echo "Documentation-only PR: skipping build, Chromium and smoke tests."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-pr-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-pr-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      # As early in this job as it can run, and still before the smoke tests
      # -- the ordering is what makes the tier sound: a smoke set that has
      # silently lost the billing/credit/auth contracts fails here rather
      # than passing a green-but-empty gate below. The check is
      # `playwright test --list`, so it needs node_modules and nothing else
      # (no build, no browser) and costs ~2s measured. Running it here rather
      # than next to the smoke tests reports a broken manifest ~50s into the
      # job instead of ~110s.
      - name: Verify smoke coverage manifest
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 5
        run: npm run verify:smoke-coverage

      - name: Production build
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 15
        run: npm run build

      - name: Restore Playwright Chromium cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-

      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 20
        run: scripts/ci/install-playwright.sh chromium

      # The @smoke tier only. Every other desktop-chromium test still runs --
      # on main push via Main Chromium Regression, and nightly via Daily
      # Security Audit and Nightly Visual Regression. See
      # scripts/verify-smoke-coverage.mjs for what this tier must cover.
      #
      # Workers stay at the config default of 1. `--workers=2` was measured
      # here and bought nothing: 30s in run #133 against 30s at one worker in
      # run #130, to the second. `fullyParallel: false` parallelises by file
      # rather than by test, and at 20 tests over 9 files the step is
      # dominated by the Next server boot, not by test execution -- so a
      # second worker only adds CPU contention on a 4 vCPU runner. Revisit
      # only if this tier grows enough for execution to dominate again.
      - name: Run desktop Chromium smoke tests
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        run: npm run test:e2e:smoke

      - name: Upload failed test evidence
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: pr-fast-gate-playwright-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # UI-008. The @smoke tier covers the commercial contracts (sign-in, billing,
  # credit preflight, attachments); it deliberately covers none of the layout
  # and accessibility regressions the Insight UI audit found, which is why
  # those went unnoticed until a manual audit. This is the focused,
  # deterministic subset of that follow-up work:
  #
  #   UI-001  the model picker under a real reduced visual viewport
  #   UI-002  the analytics settings target, hit area and overlap
  #   UI-003  composited-pixel contrast on the failure/recovery surfaces
  #   UI-006  Korean display headings that must not break mid-어절
  #   UI-007  the 11px floor on consumer auxiliary text
  #
  # Split out of build-and-e2e, where it was one step with a 10-minute budget.
  # That budget was written when the tier was 44 tests measured at 46s. It is
  # now 488 tests over 15 files, and it began timing out mid-run with every
  # test still passing -- a red required check that said nothing about the
  # product. Raising the number alone would only move the same cliff.
  #
  # Sharded by project because that is the seam the tests already have: the
  # two Chromium projects are independent browser configurations, the split is
  # almost exactly even (244 each), and a failure names the viewport class it
  # belongs to rather than an arbitrary shard index. Each shard builds its own
  # copy rather than sharing an artifact -- the shards run concurrently, so the
  # cost is runner time, not wall clock, and it keeps this job independent of
  # build-and-e2e's success.
  #
  # The full 63-golden visual matrix stays out of the PR tier -- it runs
  # unfiltered on main push and nightly.
  ui-risk:
    name: High-risk UI regression checks (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Each shard: install, build, then ~half of the tier. 25 minutes is well
    # above the measured work so a slow runner does not fail a passing suite,
    # while still bounding a hung Playwright web server.
    timeout-minutes: 25
    strategy:
      # One shard's failure must not cancel the other: the second result is
      # what tells a reviewer whether the defect is viewport-specific.
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    env:
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: tomverse-playwright-turnstile-site-key
    steps:
      # Full history so the scope check below can diff against the PR base --
      # the same reason build-and-e2e needs it.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Identical rule to build-and-e2e's: a documentation-only PR skips the
      # expensive half, and every error path falls back to code=true so the
      # failure mode is "ran too much", never "skipped a check". Inlined rather
      # than shared because this repository has no composite action to share it
      # through; if a third job needs it, extract it then.
      - name: Determine whether this PR touches anything but documentation
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if ! changed=$(git diff --no-renames --name-only "$BASE_SHA"...HEAD); then
            echo "Could not diff against $BASE_SHA; running the full gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "Diff reported no changed paths; running the full gate."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r path; do
            case "$path" in
              .github/audits/*) ;;
              docs/*.md) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            if [ "$code" = "true" ]; then
              echo "Non-documentation path found: $path"
              break
            fi
          done <<< "$changed"
          if [ "$code" = "false" ]; then
            echo "Documentation-only PR: skipping the UI regression shards."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-pr-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-pr-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Production build
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 15
        run: npm run build

      - name: Restore Playwright Chromium cache
        if: steps.scope.outputs.code == 'true'
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-chromium
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}-

      - name: Install Chromium
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 20
        run: scripts/ci/install-playwright.sh chromium

      - name: Run the high-risk UI regression checks
        if: steps.scope.outputs.code == 'true'
        timeout-minutes: 20
        env:
          UI_RISK_PROJECT: ${{ matrix.project }}
        run: npm run test:e2e:ui-risk:shard

      - name: Upload failed test evidence
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: pr-fast-gate-ui-risk-${{ matrix.project }}-${{ github.run_id }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # The required status check. Its name is load-bearing -- see the header.
  fast-gate:
    name: Security, unit, build, and Chromium smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, static-and-unit, build-and-e2e, ui-risk]
    # `always()` so this reports a red check instead of going pending when an
    # upstream job fails, is cancelled, or is skipped. The step below decides
    # the verdict; reaching it is not itself a pass.
    if: always()
    steps:
      # Every upstream job must have concluded `success`. `skipped` and
      # `cancelled` are failures here on purpose: a job that never ran has
      # not verified anything, and treating either as a pass is exactly how
      # an aggregating gate goes green without gating. Documentation-only
      # PRs skip *steps* inside build-and-e2e, never the job, so the job
      # still concludes `success` and this stays a simple all-must-pass.
      - name: Enforce upstream job results
        env:
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          STATIC_AND_UNIT: ${{ needs.static-and-unit.result }}
          BUILD_AND_E2E: ${{ needs.build-and-e2e.result }}
          # A matrix job's result is the roll-up of every shard: `success` only
          # if all shards succeeded, so both viewport classes are gated.
          UI_RISK: ${{ needs.ui-risk.result }}
        run: |
          set -uo pipefail
          failed=0
          for entry in \
            "secret-scan=$SECRET_SCAN" \
            "static-and-unit=$STATIC_AND_UNIT" \
            "build-and-e2e=$BUILD_AND_E2E" \
            "ui-risk=$UI_RISK"
          do
            job="${entry%%=*}"
            result="${entry#*=}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::PR Fast Gate job '$job' concluded '$result', not 'success'."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "PR Fast Gate failed. See the job listed above for the cause."
            exit 1
          fi
          echo "All PR Fast Gate jobs passed."
