# /etc/autorec-ssh/config -- root:root 0644, installed by install.sh. The only
# ssh configuration the auto-rec runner's review client reads (deploy/review-ssh).
Host review-orch
  HostName 127.0.0.1
  User review
  IdentityFile /home/autorec/.ssh/review_orch
  IdentitiesOnly yes
  # The review server is this host's sshd; its key is pinned by install.sh.
  UserKnownHostsFile /etc/autorec-ssh/known_hosts
  GlobalKnownHostsFile /dev/null
  StrictHostKeyChecking yes
  BatchMode yes
  ProxyCommand none
  ControlMaster no
  ControlPath none
