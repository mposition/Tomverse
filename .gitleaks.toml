title = "Tomverse gitleaks config"

# Extend (not replace) gitleaks' built-in ruleset. Everything below only
# narrows known false positives; it does not disable scanning anywhere else.
[extend]
useDefault = true

[allowlist]
description = "Known false positives: public model identifiers, non-secret config keys, and SHA-256 digests cited in operations records -- not credentials. All real API keys in this codebase are loaded from environment variables (see lib/*.ts), never hardcoded."
regexTarget = "line"
regexes = [
  # e.g. lib/models.ts, components/chat/*.tsx: apiModel: "claude-haiku-4-5-20251001"
  # e.g. lib/modelPricing.ts: apiModelId: "claude-haiku-4-5-20251001"
  # A public provider model identifier, not a secret.
  #
  # `apiModelId` is spelled out here because `apiModel:` does not match it --
  # the next character is `I`, not `:`. lib/modelPricing.ts uses `apiModelId`
  # throughout, so every profile added to it was scanned against the default
  # generic-api-key rule with no field-level allowlist at all, and two of them
  # tripped it on entropy alone. The `mistral-medium-3-5` line below is the
  # scar from the first time that happened: one value pinned instead of the
  # field, which fixed that model and left the next one to fail the same way.
  '''apiModel(?:Id)?:\s*"[A-Za-z0-9._/-]+"''',
  # Still needed after the rule above: this identifier also appears as an
  # assertion argument (`mistral.apiModel, "mistral-medium-3-5"`), where there
  # is no `field:` for a field rule to anchor to.
  '''mistral-medium-3-5''',
  # SEC-009. The two shapes that actually appear in this repo for a `*_KEY`
  # constant, and nothing wider. The previous rule was
  # `[A-Z_]*_KEY = "[A-Za-z0-9._-]+"`, whose value class also describes a
  # credential: a single line reading `STRIPE_SECRET_KEY = "sk_live_51Hx..."`
  # matched it and would have been suppressed. Neither pattern below can:
  # the first is all-lowercase and must carry a `.`/`_`/`-` separator, the
  # second is a short camelCase identifier with no separator at all.
  # tests/gitleaksAllowlist.test.mjs pins both directions with canaries.
  #
  # e.g. lib/billingPriceCatalog.ts: BILLING_PRICE_CATALOG_KEY = "billing.fixed-prices.v1"
  # e.g. lib/theme.ts: THEME_STORAGE_KEY = "tomverse_theme_preference"
  '''[A-Za-z_]*_KEY\s*=\s*"[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+"''',
  # e.g. lib/appSettings.ts: GUEST_DEFAULT_MODEL_KEY = "guestDefaultModelId"
  '''[A-Za-z_]*_KEY\s*=\s*"[a-z]+(?:[A-Z][a-z0-9]*)+"''',
  # A truncated SHA-256 digest cited in an operations record, not a credential.
  #
  # e.g. lib/voiceInputPricing.ts: "Key sha256:<digest>, project sha256:<digest>"
  # e.g. docs/policy/voice-input.md: the same citation in the policy text
  #
  # These records name which API key an observed provider charge was billed to
  # by its digest *precisely so the key itself never appears*. The shape exists
  # to avoid writing a secret, so reporting it as one inverts its purpose.
  #
  # The anchor is the `sha256:` label rather than the value class: a token
  # announced as a digest is not a credential, and nothing this repo assigns to
  # a `*_KEY` constant carries that prefix. Lowercase hex only, and at least the
  # 12 characters these records truncate to. The canaries in
  # tests/gitleaksAllowlist.test.mjs pin that a bare lowercase-hex secret --
  # which is what a 32- or 64-character key looks like -- is still reported
  # without that label.
  #
  # Without a rule for the class, it fails one value at a time on entropy
  # alone. `generic-api-key` reports above 3.5, and a 12-character hex digest
  # falls either side of that line depending only on how many of its characters
  # repeat: the two digests already recorded score 3.25 and 2.86 and were never
  # reported, while the third -- twelve distinct characters, so exactly
  # log2(12) = 3.584963 -- failed PR #1309 on 2026-09-10. Nothing about the
  # first two made them safer. That is the `mistral-medium-3-5` scar above
  # repeating: pin the shape, not the value, or the next digest fails the same
  # way and gets its own line here.
  '''sha256:[0-9a-f]{12,64}\b''',
]
