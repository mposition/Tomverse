[package]
name = "tomverse-orchestrator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
amux-core = { path = "../../crates/amux-core" }

anyhow = "1"
async-trait = "0.1"
# The Decision Maker relay (src/dm_relay): the app's request-keyed HMAC-SHA256
# digests and the base64 of the request key and the broker payload. Both were
# already in Cargo.lock (amux-core, reqwest); no new package.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["process", "net", "io-util", "test-util"] }
