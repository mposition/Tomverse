# Start workflows manually in Codemagic. Simulator builds need no Apple key;
# TestFlight builds use the signing identities configured in the account UI.
workflows:
  ios-simulator:
    name: Tomverse iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: "22.22.2"
      xcode: "26.6"
    scripts:
      - &ios_install
        name: Install locked dependencies
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          node --version
          xcodebuild -version
          npm ci --no-audit --no-fund
      - name: Prepare the bundled iOS project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npm run prepare:ios
          npm run test:ios-prebuild
          npm run test:mobile-billing
          mkdir -p .tmp/codemagic
          npm run --silent check:ios-prebuild > .tmp/codemagic/prebuild.json
      - name: Compile without signing
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npm run build:ios 2>&1 | tee .tmp/codemagic/xcodebuild.log
      - name: Package the Simulator application
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          test -d .tmp/ios-build/Debug-simulator/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent \
            .tmp/ios-build/Debug-simulator/Build/Products/Debug-iphonesimulator/App.app \
            .tmp/codemagic/tomverse-ios-simulator.zip
    artifacts:
      - .tmp/codemagic/prebuild.json
      - .tmp/codemagic/xcodebuild.log
      - .tmp/codemagic/tomverse-ios-simulator.zip

  ios-testflight: &ios_testflight
    name: Tomverse iOS TestFlight Internal
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Tomverse Codemagic Signing
    environment: &ios_testflight_environment
      node: "22.22.2"
      xcode: "26.6"
      ios_signing:
        provisioning_profiles:
          - tomverse-app-store-apple-signin
        certificates:
          - tomverse-apple-distribution
      vars: &ios_testflight_variables
        XCODE_PROJECT: apps/mobile/ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Install locked dependencies
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npm ci --no-audit --no-fund
      - &ios_prepare
        name: Prepare and verify the bundled iOS project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npm run prepare:ios
          npm run test:ios-prebuild
          npm run test:codemagic
          npm run test:mobile-billing
          mkdir -p .tmp/codemagic
          npm run --silent check:ios-prebuild > .tmp/codemagic/prebuild.json
      - &ios_version
        name: Assign a unique project build number
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          : "${PROJECT_BUILD_NUMBER:?Codemagic project build number is required}"
          [[ "$PROJECT_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid project build number" >&2; exit 1; }
          cd apps/mobile/ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - &ios_session_namespace
        name: Verify isolated native session storage
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          swiftc apps/mobile/native-auth/ios/Sources/MobileAuth/MobileSessionNamespace.swift \
            apps/mobile/native-auth/ios/Tests/MobileSessionNamespaceTests.swift \
            -o .tmp/codemagic/session-namespace-tests
          .tmp/codemagic/session-namespace-tests
      - name: Apply the internal TestFlight signing profile
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project use-profiles --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --custom-export-options='{"testFlightInternalTestingOnly":true}'
      - &ios_archive
        name: Archive and export the signed IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project build-ipa --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" --config Release \
            2>&1 | tee .tmp/codemagic/xcodebuild-testflight.log
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -f "$IPA_PATH"
          python3 - "$IPA_PATH" "$PROJECT_BUILD_NUMBER" <<'PY'
          import plistlib, re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as ipa:
              names = [name for name in ipa.namelist() if re.fullmatch(r"Payload/[^/]+\.app/Info\.plist", name)]
              assert len(names) == 1, "Expected one app in the IPA"
              info = plistlib.loads(ipa.read(names[0]))
          assert info["CFBundleIdentifier"] == "app.tomverse.shell", "Unexpected app"
          assert info["CFBundleVersion"] == sys.argv[2], "Unexpected build number"
          assert info["MinimumOSVersion"] == "17.4", "Unexpected minimum OS"
          assert set(info["UIDeviceFamily"]) == {1, 2}, "Expected iPhone and iPad support"
          assert info["CFBundleSupportedPlatforms"] == ["iPhoneOS"], "Expected a device IPA"
          print("Verified Tomverse device IPA and CI build number before upload")
          PY
    artifacts:
      - build/ios/ipa/*.ipa
      - .tmp/codemagic/prebuild.json
      - .tmp/codemagic/xcodebuild-testflight.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload for internal testing; adding the owner to a group is a separate
        # account action. Internal-only builds cannot be released to customers.
        submit_to_testflight: false
        submit_to_app_store: false

  ios-testflight-sandbox:
    <<: *ios_testflight
    name: Tomverse iOS StoreKit Sandbox
    environment:
      <<: *ios_testflight_environment
      groups:
        - ios_store_billing
      vars:
        <<: *ios_testflight_variables
        VITE_TOMVERSE_API_ORIGIN: https://staging.tomverse.app
        VITE_NATIVE_BILLING_ENABLED: "true"

  ios-app-store:
    <<: *ios_testflight
    name: Tomverse iOS App Store Submission
    environment:
      <<: *ios_testflight_environment
      groups:
        - ios_store_billing
      vars:
        <<: *ios_testflight_variables
        VITE_TOMVERSE_API_ORIGIN: https://tomverse.app
        VITE_NATIVE_BILLING_ENABLED: "true"
    scripts:
      - *ios_install
      - *ios_prepare
      - *ios_version
      - *ios_session_namespace
      - name: Apply the App Store submission signing profile
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcode-project use-profiles --project "$XCODE_PROJECT" \
            --archive-method app-store \
            --custom-export-options='{"testFlightInternalTestingOnly":false}'
      - *ios_archive
